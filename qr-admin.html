<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HS Coaching — QR Codes</title><link rel="stylesheet" href="style.css"><style>
.qr-admin{padding:35px 0 80px}.qr-admin h1{font-size:clamp(38px,7vw,64px);letter-spacing:-3px;margin:8px 0}.sub{color:#888;line-height:1.5}.panel{background:#141414;border:1px solid #292929;border-radius:18px;padding:22px;margin:18px 0}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.toolbar input{background:#0d0d0d;border:1px solid #303030;color:#fff;border-radius:10px;padding:12px;font:inherit;min-width:240px}.grid-qr{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}.qr-card{background:#101010;border:1px solid #292929;border-radius:14px;padding:16px}.qr-card h3{font-size:16px;margin:0 0 5px}.qr-card small{color:#777}.qr-box{background:#fff;border-radius:10px;width:180px;height:180px;margin:15px auto;display:grid;place-items:center}.qr-box img{display:block}.qr-actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#000}.secondary{background:#242424;color:#fff}.hidden{display:none}.status{color:#aaa;font-size:13px;margin-top:12px}.login{max-width:460px;margin:50px auto}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.08em}.field input{background:#0d0d0d;border:1px solid #303030;color:#fff;border-radius:10px;padding:12px;font:inherit;width:100%;box-sizing:border-box}.btns{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}@media(max-width:600px){.toolbar input{min-width:0;width:100%}.grid-qr{grid-template-columns:1fr}}
</style></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">HS</span><div><strong>HS COACHING</strong><small>QR Codes machines</small></div></div><nav style="margin-left:auto;margin-right:22px;display:flex;gap:8px"><a href="admin.html" style="color:#888;text-decoration:none;padding:9px 12px">Admin</a><a href="index.html" style="color:#888;text-decoration:none;padding:9px 12px">Exercices</a></nav></header>
<main class="container qr-admin"><section id="login" class="panel login"><p class="eyebrow">ESPACE PRIVÉ</p><h1>QR Codes.</h1><p class="sub">Connecte-toi pour générer les QR codes à afficher sur les machines de la salle.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field" style="margin-top:12px"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div><div class="btns"><button class="btn primary" id="loginBtn">Se connecter</button></div><div id="loginStatus" class="status"></div></section>
<section id="dashboard" class="hidden"><div class="panel"><p class="eyebrow">ADMINISTRATION</p><h1>QR Codes.</h1><p class="sub">Chaque QR code ouvre directement la fiche de l’exercice correspondant.</p><div class="toolbar"><input id="search" placeholder="Rechercher un exercice…"><button class="btn secondary" id="logout">Se déconnecter</button></div><div id="list" class="grid-qr"></div><div id="status" class="status"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const SUPABASE_URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co',SUPABASE_KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let exercises=[];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function isAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return data?user:null}
async function boot(){const u=await isAdmin();if(!u)return;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');const r=await sb.from('exercises').select('id,name,slug,is_published').order('name');exercises=r.data||[];render()}
function urlFor(e){const u=new URL('https://hscoaching.github.io/Biblioth-que-O2/');u.searchParams.set('exercice',e.id);return u.toString()}
function render(){const q=$('search').value.trim().toLowerCase();const list=exercises.filter(e=>String(e.name||'').toLowerCase().includes(q));$('list').innerHTML=list.map(e=>`<article class="qr-card"><h3>${esc(e.name)}</h3><small>${e.is_published?'Publié':'Brouillon'} · ID ${e.id}</small><div class="qr-box" id="qr-${e.id}"></div><div class="qr-actions"><button class="btn primary" onclick="printQR(${e.id})">Imprimer</button><button class="btn secondary" onclick="copyLink(${e.id})">Copier le lien</button></div></article>`).join('')||'<p class="sub">Aucun exercice.</p>';list.forEach(e=>new QRCode(document.getElementById('qr-'+e.id),{text:urlFor(e),width:160,height:160,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}));}
window.copyLink=async id=>{const e=exercises.find(x=>x.id===id);if(!e)return;try{await navigator.clipboard.writeText(urlFor(e));$('status').textContent='Lien copié pour '+e.name+'.'}catch{$('status').textContent=urlFor(e)}};
window.printQR=id=>{const e=exercises.find(x=>x.id===id);const qr=document.getElementById('qr-'+id);if(!e||!qr)return;const w=window.open('','_blank','width=600,height=700');w.document.write('<html><head><title>QR — '+esc(e.name)+'</title><style>body{font-family:Arial;text-align:center;padding:40px}img{width:320px;height:320px}h1{font-size:28px}</style></head><body><h1>'+esc(e.name)+'</h1>'+qr.innerHTML+'<p>HS Coaching — Bibliothèque O2</p></body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),300)};
$('loginBtn').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginStatus').textContent=r.error?r.error.message:'Connexion…';if(!r.error)boot()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('search').oninput=render;boot();
</script></body></html>
