<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>HS Coaching — Mes programmes</title>
<link rel="stylesheet" href="style.css">
<style>
body{background:#0b0b0b;color:#fff}
.nav{margin-left:auto;margin-right:18px;display:flex;gap:3px;padding:3px;background:#151515;border:1px solid #292929;border-radius:12px}.nav a{color:#888;text-decoration:none;padding:8px 11px;border-radius:9px;font-size:11px;font-weight:800}.nav a.active{background:#fff;color:#000}
.hero{padding:48px 0 25px}.hero h1{font-size:clamp(38px,7vw,64px);line-height:.98;letter-spacing:-3px;margin:12px 0 15px}.hero h1 span{color:#999}.hero p{color:#999;max-width:650px;font-size:14px;line-height:1.55}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.btn{min-height:44px;border-radius:11px;padding:11px 14px;border:1px solid #333;background:#151515;color:#fff;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none}.btn.primary{background:#fff;color:#000;border-color:#fff}
.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}.quick-stat{background:#121212;border:1px solid #292929;border-radius:14px;padding:13px}.quick-stat b{display:block;font-size:22px}.quick-stat span{display:block;color:#777;font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-top:3px}.program-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.program-card{background:linear-gradient(145deg,#171717,#111);border:1px solid #292929;border-radius:18px;padding:18px;min-height:210px;display:flex;flex-direction:column}.program-card h3{font-size:21px;margin:9px 0}.muted{color:#777;font-size:11px;line-height:1.5}.program-actions{margin-top:auto;display:flex;gap:8px;padding-top:16px}.program-actions .btn{flex:1;text-align:center}
.editor{display:none}.editor.show{display:block}.editor-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.editor-head h2{margin:0;font-size:25px}.field{margin-bottom:12px}.field label{display:block;color:#777;font-size:9px;text-transform:uppercase;letter-spacing:1.2px;font-weight:900;margin:0 0 6px 2px}.input{width:100%;height:44px;border:1px solid #303030;border-radius:10px;background:#111;color:#fff;padding:0 12px;outline:none}.input:focus{border-color:#777}.sessions{display:grid;gap:13px;margin-top:18px}.session{border:1px solid #292929;border-radius:16px;background:#111;overflow:hidden}.session-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;background:#171717;border-bottom:1px solid #292929}.session-title{display:flex;gap:9px;align-items:center;min-width:0}.session-title input{font-weight:900}.session-body{padding:12px}.exercise-row{display:grid;grid-template-columns:28px minmax(0,1fr) 70px 70px 58px 70px 38px;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid #202020}.exercise-row:last-child{border-bottom:0}.num{width:28px;height:28px;border:1px solid #333;border-radius:8px;display:grid;place-items:center;color:#777;font-size:9px;font-weight:900}.ex-name{font-size:11px;font-weight:900}.mini{height:36px;width:100%;border:1px solid #303030;border-radius:8px;background:#0d0d0d;color:#fff;text-align:center;font-size:11px;font-weight:900}.icon-btn{width:38px;height:36px;border:1px solid #303030;border-radius:8px;background:#171717;color:#fff;cursor:pointer;font-weight:900}.session-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.exercise-picker{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.96);padding:16px}.exercise-picker.show{display:block}.picker-panel{width:min(850px,100%);height:100%;margin:auto;background:#111;border:1px solid #333;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}.picker-head{padding:14px;border-bottom:1px solid #292929;display:flex;gap:9px;align-items:center}.picker-head h3{margin:0;font-size:16px;flex:1}.picker-list{overflow:auto;padding:10px}.picker-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid #242424;border-radius:11px;background:#151515;margin-bottom:7px}.picker-item strong{font-size:12px}.picker-item small{display:block;color:#777;font-size:9px;margin-top:4px}.picker-actions{display:flex;gap:7px}.empty{color:#777;text-align:center;padding:35px 10px;font-size:12px}.coach-label{display:inline-flex;border:1px solid #333;border-radius:99px;padding:5px 8px;color:#aaa;font-size:8px;font-weight:900;letter-spacing:1px}.quick-actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:650px){.quick-stats{grid-template-columns:1fr 1fr 1fr}.quick-stat{padding:10px}.quick-stat b{font-size:18px}}
@media(max-width:650px){.topbar{height:64px;position:sticky;top:0;z-index:50;background:rgba(11,11,11,.92);backdrop-filter:blur(14px)}.brand{min-width:0;flex:1;padding-left:12px}.brand-mark{width:34px;height:34px}.brand strong{font-size:12px}.brand small{font-size:10px}.nav{margin:0 8px;gap:2px}.nav a{padding:7px 8px;font-size:9px}.hero{padding:34px 0 20px}.hero h1{font-size:42px;letter-spacing:-2px}.program-list{grid-template-columns:1fr}.exercise-row{grid-template-columns:27px minmax(0,1fr) 60px 60px 52px 60px 36px}.exercise-row .tempo{display:none}.program-actions{display:grid;grid-template-columns:1fr 1fr}.editor-head{align-items:center}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark">HS</span><div><strong>HS COACHING</strong><small>Bibliothèque O2</small></div></div><nav class="nav"><a href="index.html">Accueil</a><a class="active" href="mes-programmes.html">Programmes</a><a href="compte.html">Mon compte</a></nav></header>
<main class="container">
<section class="hero" id="listView"><h1>Programmes.</h1><p>Retrouve tes programmes, lance une séance ou crée ton propre programme.</p><div class="toolbar"><button class="btn primary" onclick="newProgram()">+ Créer un programme</button><button class="btn" onclick="loadCoachPrograms()">+ Programme HS Coaching</button></div>
<div id="quickStats" class="quick-stats"></div><div id="programList" class="program-list"></div><div id="coachPrograms" class="program-list" style="margin-top:18px"></div></section>
<section id="editor" class="editor">
<div class="editor-head"><div><p class="eyebrow">CRÉATION</p><h2 id="editorTitle">Nouveau programme</h2></div><button class="btn" onclick="closeEditor()">× Fermer</button></div>
<div class="field"><label>Nom du programme</label><input id="programName" class="input" placeholder="Ex. Prise de masse"></div>
<div class="field"><label>Objectif</label><input id="programObjective" class="input" placeholder="Ex. Hypertrophie"></div>
<div class="field"><label>Description</label><input id="programDescription" class="input" placeholder="Quelques mots sur ton programme"></div>
<div id="sessions" class="sessions"></div>
<div class="toolbar" style="margin-top:16px"><button class="btn" onclick="addSession()">+ Ajouter une séance</button><button class="btn primary" onclick="saveProgram()">Enregistrer le programme</button></div>
</section>
</main>
<div id="picker" class="exercise-picker" hidden><div class="picker-panel"><div class="picker-head"><h3>Choisir un exercice</h3><input id="pickerSearch" class="input" placeholder="Rechercher…" style="max-width:260px"><button class="icon-btn" onclick="closePicker()">×</button></div><div id="pickerList" class="picker-list"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',STORE='hs_custom_programs_v1';
const authClient=supabase.createClient(SUPA,KEY);
let programs=[],exercises=[],editing=null,pickerSession=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p){const r=await fetch(SUPA+'/rest/v1/'+p,{headers:{apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}
function persist(){localStorage.setItem(STORE,JSON.stringify(programs))}
async function syncAccount(){
  const {data:{session}}=await authClient.auth.getSession();
  if(!session)return;
  const user=session.user;
  for(const p of programs){
    if(!p.local_id)p.local_id='program_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    if(p.cloud_id){
      await authClient.from('client_programs').update({name:p.name||'Programme',data:p,updated_at:new Date().toISOString()}).eq('id',p.cloud_id).eq('user_id',user.id);
    }else{
      const {data}=await authClient.from('client_programs').insert({user_id:user.id,source_program_id:p.source_program_id||null,name:p.name||'Programme',data:p}).select('id').single();
      if(data)p.cloud_id=data.id;
    }
  }
  const {data:cloud}=await authClient.from('client_programs').select('id,name,data').eq('user_id',user.id).order('updated_at',{ascending:false});
  const known=new Set(programs.map(p=>p.cloud_id).filter(Boolean));
  (cloud||[]).forEach(row=>{
    if(!known.has(row.id)){
      const p=row.data&&typeof row.data==='object'?{...row.data}:{};
      p.cloud_id=row.id;
      p.local_id=p.local_id||'program_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
      p.name=p.name||row.name||'Programme';
      programs.push(p);
    }
  });
  persist();
  renderList();
}
async function deleteCloud(id){
  if(!id)return;
  const {data:{session}}=await authClient.auth.getSession();
  if(session)await authClient.from('client_programs').delete().eq('id',id).eq('user_id',session.user.id);
}
function renderStats(){const el=document.getElementById('quickStats');const ex=programs.reduce((n,p)=>n+(p.sessions||[]).reduce((m,s)=>m+(s.exercises||[]).length,0),0);el.innerHTML='<div class="quick-stat"><b>'+programs.length+'</b><span>Programmes</span></div><div class="quick-stat"><b>'+programs.reduce((n,p)=>n+(p.sessions||[]).length,0)+'</b><span>Séances</span></div><div class="quick-stat"><b>'+ex+'</b><span>Exercices</span></div>'}
function renderList(){renderStats();const el=document.getElementById('programList');if(!programs.length){el.innerHTML='<div class="empty">Tu n’as encore aucun programme personnel.<br>Crée ton premier programme.</div>';return}el.innerHTML=programs.map((p,i)=>'<article class="program-card"><p class="eyebrow">PROGRAMME PERSONNEL</p><h3>'+esc(p.name||'Sans nom')+'</h3><p class="muted">'+esc(p.objective||'')+(p.sessions?.length?' · '+p.sessions.length+' séance'+(p.sessions.length>1?'s':''):'')+'</p><p class="muted">'+esc(p.description||'')+'</p><div class="program-actions"><button class="btn primary" onclick="openProgram('+i+')">Modifier</button><button class="btn" onclick="duplicateLocal('+i+')">Dupliquer</button><button class="btn" onclick="deleteLocal('+i+')">Supprimer</button></div>'+(p.sessions?.length?'<div style="display:grid;gap:6px;margin-top:10px">'+p.sessions.map((s,si)=>'<button class="btn" onclick="startCustom('+i+','+si+')">▶ '+esc(s.name||('Séance '+(si+1)))+'</button>').join('')+'</div>':'')+'</article>').join('')}
function blank(){return {id:'p_'+Date.now(),name:'',objective:'',description:'',sessions:[]}}
function newProgram(){editing=blank();editing.sessions.push({id:'s_'+Date.now(),name:'Séance 1',notes:'',exercises:[]});showEditor()}
function openProgram(i){editing=structuredClone(programs[i]);showEditor()}
function showEditor(){document.getElementById('listView').style.display='none';document.getElementById('editor').classList.add('show');document.getElementById('programName').value=editing.name||'';document.getElementById('programObjective').value=editing.objective||'';document.getElementById('programDescription').value=editing.description||'';renderSessions();window.scrollTo(0,0)}
function closeEditor(){document.getElementById('editor').classList.remove('show');document.getElementById('listView').style.display='block';renderList()}
function renderSessions(){const el=document.getElementById('sessions');el.innerHTML=editing.sessions.map((s,si)=>'<section class="session"><div class="session-head"><div class="session-title"><span class="num">'+String(si+1).padStart(2,'0')+'</span><input class="input" value="'+esc(s.name||('Séance '+(si+1)))+'" oninput="editing.sessions['+si+'].name=this.value" style="height:38px"></div><button class="icon-btn" onclick="removeSession('+si+')">×</button></div><div class="session-body">'+(s.exercises.length?s.exercises.map((e,ei)=>'<div class="exercise-row"><span class="num">'+String(ei+1).padStart(2,'0')+'</span><div class="ex-name">'+esc(e.name)+'</div><input class="mini" type="number" value="'+esc(e.sets||3)+'" onchange="setVal('+si+','+ei+',\'sets\',this.value)" title="Séries"><input class="mini" type="text" value="'+esc(e.reps||'8-12')+'" onchange="setVal('+si+','+ei+',\'reps\',this.value)" title="Répétitions"><input class="mini tempo" type="text" value="'+esc(e.rest||'90s')+'" onchange="setVal('+si+','+ei+',\'rest\',this.value)" title="Repos"><input class="mini" type="text" value="'+esc(e.load||'')+'" onchange="setVal('+si+','+ei+',\'load\',this.value)" title="Charge"><button class="icon-btn" onclick="removeExercise('+si+','+ei+')">×</button></div>').join(''):'<div class="empty">Aucun exercice dans cette séance.</div>')+'<div class="session-tools"><button class="btn" onclick="openPicker('+si+')">+ Ajouter un exercice</button><button class="btn" onclick="duplicateSession('+si+')">Dupliquer</button></div></div></section>').join('')}
function addSession(){editing.sessions.push({id:'s_'+Date.now(),name:'Séance '+(editing.sessions.length+1),notes:'',exercises:[]});renderSessions()}
function removeSession(i){if(editing.sessions.length===1)return;if(confirm('Supprimer cette séance ?')){editing.sessions.splice(i,1);renderSessions()}}
function duplicateSession(i){const s=structuredClone(editing.sessions[i]);s.id='s_'+Date.now();s.name=s.name+' (copie)';editing.sessions.splice(i+1,0,s);renderSessions()}
function setVal(si,ei,key,v){editing.sessions[si].exercises[ei][key]=v}
function removeExercise(si,ei){editing.sessions[si].exercises.splice(ei,1);renderSessions()}
async function openPicker(si){pickerSession=si;document.getElementById('picker').hidden=false;document.getElementById('picker').classList.add('show');document.getElementById('pickerSearch').value='';renderPicker();if(!exercises.length){try{exercises=await api('exercises?select=id,name_fr,equipment,muscles,slug&order=name_fr.asc')}catch{document.getElementById('pickerList').innerHTML='<div class="empty">Impossible de charger les exercices.</div>'}}renderPicker()}
function closePicker(){document.getElementById('picker').hidden=true;document.getElementById('picker').classList.remove('show');pickerSession=null}
function renderPicker(){const q=document.getElementById('pickerSearch').value.trim().toLowerCase();const list=exercises.filter(e=>String(e.name_fr||'').toLowerCase().includes(q)).slice(0,120);document.getElementById('pickerList').innerHTML=list.map(e=>'<div class="picker-item"><div><strong>'+esc(e.name_fr||'Exercice')+'</strong><small>'+esc(e.equipment||'Poids du corps')+'</small></div><div class="picker-actions"><a class="btn" href="fiche.html?id='+encodeURIComponent(e.id)+'" target="_blank">Fiche</a><button class="btn primary" onclick="addExercise('+JSON.stringify(e.id)+')">Ajouter</button></div></div>').join('')||'<div class="empty">Aucun exercice trouvé.</div>'}
function duplicateLocal(i){const p=structuredClone(programs[i]);p.id='p_'+Date.now();delete p.cloud_id;delete p.local_id;p.name=(p.name||'Mon programme')+' (copie)';p.updatedAt=new Date().toISOString();programs.unshift(p);persist();renderList()}
async function deleteLocal(i){if(!confirm('Supprimer ce programme personnel ?'))return;const p=programs[i];programs.splice(i,1);persist();if(p?.cloud_id)await deleteCloud(p.cloud_id);renderList()}
async function loadCoachPrograms(){const box=document.getElementById('coachPrograms');box.innerHTML='<div class="empty">Chargement des programmes HS Coaching…</div>';try{const ps=await api('programs?select=id,name,objective,description,is_published&is_published=eq.true&order=id.asc');if(!ps.length){box.innerHTML='<div class="empty">Aucun programme HS Coaching disponible.</div>';return}box.innerHTML=ps.map(p=>'<article class="program-card"><p class="eyebrow">HS COACHING</p><h3>'+esc(p.name||'Programme')+'</h3><p class="muted">'+esc(p.objective||'')+'</p><p class="muted">'+esc(p.description||'')+'</p><div class="program-actions"><button class="btn primary" onclick="cloneCoachProgram('+JSON.stringify(p.id)+')">Créer une copie</button></div></article>').join('')}catch(e){box.innerHTML='<div class="empty">Impossible de charger les programmes HS Coaching.</div>'}}
async function cloneCoachProgram(id){try{const p=(await api('programs?select=id,name,objective,description&id=eq.'+encodeURIComponent(id)))[0];if(!p)return;const ss=await api('program_sessions?select=id,name,notes,position&program_id=eq.'+id+'&order=position.asc');const ids=ss.map(s=>s.id);const rows=ids.length?await api('program_exercises?select=session_id,exercise_id,position,sets,reps,rest,tempo,load,duration,notes&session_id=in.('+ids.join(',')+')&order=position.asc'):[];const exids=[...new Set(rows.map(x=>x.exercise_id))];const names=exids.length?Object.fromEntries((await api('exercises?select=id,name_fr&id=in.('+exids.join(',')+')')).map(x=>[x.id,x.name_fr])):{};const custom={id:'p_'+Date.now(),name:(p.name||'Programme')+' (copie)',objective:p.objective||'',description:p.description||'',updatedAt:new Date().toISOString(),sessions:ss.map((s,si)=>({id:'s_'+Date.now()+'_'+si,name:s.name||('Séance '+(si+1)),notes:s.notes||'',exercises:rows.filter(r=>String(r.session_id)===String(s.id)).sort((a,b)=>(a.position||0)-(b.position||0)).map(r=>({exercise_id:r.exercise_id,name:names[r.exercise_id]||'Exercice',sets:r.sets||3,reps:r.reps||'8-12',rest:r.rest||'90s',tempo:r.tempo||'',load:r.load||'',duration:r.duration||'',notes:r.notes||''}))}))};programs.unshift(custom);persist();renderList();document.getElementById('coachPrograms').innerHTML='';window.scrollTo(0,0)}catch(e){alert('Impossible de copier ce programme pour le moment.')}} 
function addExercise(id){const e=exercises.find(x=>String(x.id)===String(id));if(!e)return;const s=editing.sessions[pickerSession];if(s.exercises.some(x=>String(x.exercise_id)===String(e.id)))return;s.exercises.push({exercise_id:e.id,name:e.name_fr||'Exercice',sets:3,reps:'8-12',rest:'90s',tempo:'',load:''});renderSessions();closePicker()}
document.getElementById('pickerSearch').addEventListener('input',renderPicker);
function saveProgram(){editing.name=document.getElementById('programName').value.trim()||'Mon programme';editing.objective=document.getElementById('programObjective').value.trim();editing.description=document.getElementById('programDescription').value.trim();editing.updatedAt=new Date().toISOString();const idx=programs.findIndex(p=>p.id===editing.id);if(idx>=0)programs[idx]=editing;else programs.unshift(editing);persist();closeEditor()}
function startCustom(i,si=0){const p=structuredClone(programs[i]);p.selectedSession=si;localStorage.setItem('hs_custom_active_program',JSON.stringify(p));window.location.href='seance.html?custom=1'}
programs=loadLocal();
renderList();
syncAccount();
authClient.auth.onAuthStateChange(()=>syncAccount());
</script>
<script>window.HS_SUPABASE_CONFIG={url:"https://hcjoagpkgpqxgzjdyfvd.supabase.co",key:"sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB"};</script><script src="client-ui.js"></script></body></html>
