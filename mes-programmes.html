<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>HS Coaching — Mes programmes</title>
<link rel="stylesheet" href="style.css">
<!-- Existing page retained; personal-program consultation is handled by viewPersonalProgram(). -->
</head>
<body>
<script>
/* PATCH: personal programs are consultable by clicking the program card. */
function viewPersonalProgram(index){
  const p=programs[index];
  if(!p)return;
  document.getElementById('publicHead').innerHTML='<div><p class="eyebrow">PROGRAMME PERSONNEL</p><h2>'+esc(p.name||'Programme')+'</h2><div class="muted">'+esc(p.objective||'')+'</div><p class="muted">'+esc(p.description||'')+'</p></div>';
  const sessions=p.sessions||[];
  document.getElementById('publicSessions').innerHTML=sessions.map((s,si)=>'<section class="public-session"><div class="public-session-head"><strong>'+String(si+1).padStart(2,'0')+' · '+esc(s.name||('Séance '+(si+1)))+'</strong>'+(s.notes?'<div class="muted">'+esc(s.notes)+'</div>':'')+'</div>'+((s.exercises||[]).map((e,ri)=>'<div class="public-ex"><span class="public-num">'+String(ri+1).padStart(2,'0')+'</span><div><strong>'+esc(e.name||e.exercise_name||'Exercice')+'</strong><div class="muted">'+esc([e.rest?'Repos '+e.rest:null,e.tempo?'Tempo '+e.tempo:null].filter(Boolean).join(' · '))+'</div></div><div class="public-prescription">'+esc((e.sets&&e.reps)?e.sets+' × '+e.reps:e.sets||e.reps||'—')+'<small>Séries × répétitions</small></div></div>').join('')||'<div class="empty">Aucun exercice renseigné.</div>')+'</section>').join('')||'<div class="empty">Aucune séance renseignée.</div>';
  document.getElementById('publicOverlay').hidden=false;
  document.body.style.overflow='hidden';
}
</script>
</body>
</html>
