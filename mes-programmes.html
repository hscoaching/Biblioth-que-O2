<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HS Coaching — Programmes</title><link rel="stylesheet" href="style.css"><style>body{background:#0b0b0b;color:#fff}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(38px,7vw,64px);margin:10px 0;letter-spacing:-3px}.hero p,.muted{color:#777;font-size:12px;line-height:1.5}.toolbar,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{min-height:42px;border:1px solid #333;border-radius:10px;background:#151515;color:#fff;padding:10px 13px;font-size:11px;font-weight:900;cursor:pointer}.btn.primary{background:#fff;color:#000;border-color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat,.card{background:#121212;border:1px solid #292929;border-radius:16px;padding:16px}.stat b{display:block;font-size:22px}.stat span{font-size:9px;color:#777;text-transform:uppercase;letter-spacing:1px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{min-height:190px;display:flex;flex-direction:column}.card h3{font-size:20px;margin:8px 0}.actions{margin-top:auto;padding-top:14px}.actions .btn{flex:1}.public-head{grid-column:1/-1;margin-top:25px}.badge{display:inline-flex;border:1px solid #333;border-radius:99px;padding:5px 8px;color:#aaa;font-size:8px;font-weight:900;letter-spacing:1px}.overlay{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.95);display:grid;place-items:center;padding:18px}.overlay[hidden]{display:none}.panel{width:min(850px,100%);max-height:calc(100vh - 36px);overflow:auto;background:#121212;border:1px solid #333;border-radius:20px;padding:22px}.panel-head{display:flex;justify-content:space-between;gap:12px}.close{width:40px;height:40px;border:1px solid #333;border-radius:50%;background:#222;color:#fff;font-size:22px}.session{margin-top:14px;border:1px solid #292929;border-radius:14px;overflow:hidden}.session-head{padding:13px;background:#171717;border-bottom:1px solid #292929}.exercise{display:grid;grid-template-columns:30px 1fr auto;gap:10px;padding:11px;border-bottom:1px solid #202020;align-items:center}.exercise:last-child{border:0}.num{width:28px;height:28px;border:1px solid #333;border-radius:8px;display:grid;place-items:center;color:#777;font-size:9px}.pres{text-align:right;font-size:11px;font-weight:900}.pres small{display:block;color:#777;font-size:8px}.editor{display:none}.editor.show{display:block}.field{margin:12px 0}.field label{display:block;color:#777;font-size:9px;text-transform:uppercase;margin-bottom:6px}.input{width:100%;height:44px;border:1px solid #303030;border-radius:10px;background:#111;color:#fff;padding:0 12px}.empty{text-align:center;color:#777;padding:30px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr 1fr}.grid{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}}</style></head><body><main class="container"><section id="list" class="hero"><h1>Programmes.</h1><p>Retrouve tes programmes, consulte-les, lance une séance ou crée ton propre programme.</p><div class="toolbar"><button class="btn primary" onclick="newProgram()">+ Créer un programme</button></div><div id="stats" class="stats"></div><div id="personal" class="grid"></div><div id="public" class="grid"></div></section><section id="editor" class="editor"><div class="toolbar" style="justify-content:space-between"><h2>Créer / modifier un programme</h2><button class="btn" onclick="closeEditor()">Fermer</button></div><div class="field"><label>Nom</label><input id="name" class="input"></div><div class="field"><label>Objectif</label><input id="objective" class="input"></div><div class="field"><label>Description</label><input id="description" class="input"></div><div class="toolbar"><button class="btn primary" onclick="saveProgram()">Enregistrer</button></div></section></main><div id="overlay" class="overlay" hidden onclick="if(event.target===this)closeView()"><section class="panel"><div class="panel-head"><div id="viewHead"></div><button class="close" onclick="closeView()">×</button></div><div id="viewBody"></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPA='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',STORE='hs_custom_programs_v1';const sb=supabase.createClient(SUPA,KEY);let programs=[],editing=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p){const r=await fetch(SUPA+'/rest/v1/'+p,{headers:{apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}function loadLocal(){try{const x=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function persist(){localStorage.setItem(STORE,JSON.stringify(programs))}function render(){document.getElementById('stats').innerHTML='<div class="stat"><b>'+programs.length+'</b><span>Programmes</span></div><div class="stat"><b>'+programs.reduce((n,p)=>n+(p.sessions||[]).length,0)+'</b><span>Séances</span></div><div class="stat"><b>'+programs.reduce((n,p)=>n+(p.sessions||[]).reduce((m,s)=>m+(s.exercises||[]).length,0),0)+'</b><span>Exercices</span></div>';const box=document.getElementById('personal');box.innerHTML=programs.length?programs.map((p,i)=>'<article class="card" onclick="viewPersonal('+i+')" style="cursor:pointer"><span class="badge">PROGRAMME PERSONNEL</span><h3>'+esc(p.name||'Sans nom')+'</h3><p class="muted">'+esc(p.objective||'')+(p.sessions?.length?' · '+p.sessions.length+' séance'+(p.sessions.length>1?'s':''):'')+'</p><p class="muted">'+esc(p.description||'')+'</p><div class="actions"><button class="btn primary" onclick="event.stopPropagation();start('+i+',0)">▶ Lancer</button><button class="btn" onclick="event.stopPropagation();edit('+i+')">Modifier</button><button class="btn" onclick="event.stopPropagation();remove('+i+');">Supprimer</button></div></article>').join(''):'<div class="empty">Aucun programme personnel.</div>'}async function loadPublic(){const box=document.getElementById('public');try{const ps=await api('programs?select=id,name,objective,description,duration_minutes,is_published&is_published=eq.true&order=id.asc');box.innerHTML='<div class="public-head"><span class="badge">HS COACHING</span><h2>Programmes disponibles pour tous</h2><p class="muted">Clique directement sur un programme pour le consulter.</p></div>'+ps.map(p=>'<article class="card" onclick="viewPublic('+JSON.stringify(p.id)+')" style="cursor:pointer"><span class="badge">HS COACHING</span><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.objective||'')+(p.duration_minutes?' · '+p.duration_minutes+' min':'')+'</p><p class="muted">'+esc(p.description||'')+'</p><div class="actions"><button class="btn primary" onclick="event.stopPropagation();clone('+JSON.stringify(p.id)+')">Créer une copie</button></div></article>').join('')}catch(e){box.innerHTML='<div class="empty">Impossible de charger les programmes publics.</div>'}}let viewedPersonalIndex=null;function viewPersonal(i){viewedPersonalIndex=i;const p=programs[i];showView(p,'PROGRAMME PERSONNEL',true)}function showView(p,label,personal){document.getElementById('viewHead').innerHTML='<span class="badge">'+label+'</span><h2>'+esc(p.name||'Programme')+'</h2><p class="muted">'+esc(p.objective||'')+'</p><p class="muted">'+esc(p.description||'')+'</p>';document.getElementById('viewBody').innerHTML=(p.sessions||[]).map((s,si)=>'<section class="session"><div class="session-head"><strong>'+String(si+1).padStart(2,'0')+' · '+esc(s.name||('Séance '+(si+1)))+'</strong>'+(personal?'<button class="btn primary" onclick="start(viewedPersonalIndex,'+si+')">▶ Lancer</button>':'')+'</div>'+((s.exercises||[]).map((e,ei)=>'<div class="exercise"><span class="num">'+String(ei+1).padStart(2,'0')+'</span><div><strong>'+esc(e.name||'Exercice')+'</strong><div class="muted">'+esc(e.rest?'Repos '+e.rest:'')+'</div></div><div class="pres">'+esc(e.sets&&e.reps?e.sets+' × '+e.reps:e.sets||e.reps||'—')+'<small>Séries × répétitions</small></div></div>').join('')||'<div class="empty">Aucun exercice renseigné.</div>')+'</section>').join('')||'<div class="empty">Aucune séance renseignée.</div>';document.getElementById('overlay').hidden=false;document.body.style.overflow='hidden'}function closeView(){document.getElementById('overlay').hidden=true;document.body.style.overflow=''}async function viewPublic(id){try{const p=(await api('programs?select=id,name,objective,description,duration_minutes&id=eq.'+id))[0];if(!p)return;const ss=await api('program_sessions?select=id,name,notes,position&program_id=eq.'+id+'&order=position.asc');const ids=ss.map(x=>x.id);const rows=ids.length?await api('program_exercises?select=session_id,exercise_id,position,sets,reps,rest,tempo&session_id=in.('+ids.join(',')+')&order=position.asc'):[];const exids=[...new Set(rows.map(x=>x.exercise_id))];const names=exids.length?Object.fromEntries((await api('exercises?select=id,name_fr&id=in.('+exids.join(',')+')')).map(x=>[x.id,x.name_fr])):{};p.sessions=ss.map(s=>({name:s.name,notes:s.notes,exercises:rows.filter(r=>String(r.session_id)===String(s.id)).map(r=>({name:names[r.exercise_id]||'Exercice',sets:r.sets,reps:r.reps,rest:r.rest,tempo:r.tempo}))}));showView(p,'HS COACHING',false)}catch(e){alert('Impossible de consulter ce programme.')}}async function clone(id){try{const p=(await api('programs?select=id,name,objective,description&id=eq.'+id))[0];const ss=await api('program_sessions?select=id,name,notes,position&program_id=eq.'+id+'&order=position.asc');const ids=ss.map(x=>x.id);const rows=ids.length?await api('program_exercises?select=session_id,exercise_id,position,sets,reps,rest,tempo&session_id=in.('+ids.join(',')+')&order=position.asc'):[];const exids=[...new Set(rows.map(x=>x.exercise_id))];const names=exids.length?Object.fromEntries((await api('exercises?select=id,name_fr&id=in.('+exids.join(',')+')')).map(x=>[x.id,x.name_fr])):{};programs.unshift({id:'p_'+Date.now(),name:(p.name||'Programme')+' (copie)',objective:p.objective||'',description:p.description||'',source_program_id:id,sessions:ss.map((s,i)=>({id:'s_'+Date.now()+'_'+i,name:s.name,notes:s.notes,exercises:rows.filter(r=>String(r.session_id)===String(s.id)).map(r=>({exercise_id:r.exercise_id,name:names[r.exercise_id]||'Exercice',sets:r.sets||3,reps:r.reps||'8-12',rest:r.rest||'90s',tempo:r.tempo||''}))}))});persist();render();alert('Programme copié dans tes programmes.')}catch(e){alert('Impossible de copier ce programme.')}}function newProgram(){editing={id:'p_'+Date.now(),name:'',objective:'',description:'',sessions:[]};document.getElementById('list').style.display='none';document.getElementById('editor').classList.add('show');document.getElementById('name').value='';document.getElementById('objective').value='';document.getElementById('description').value=''}function edit(i){editing=structuredClone(programs[i]);document.getElementById('list').style.display='none';document.getElementById('editor').classList.add('show');document.getElementById('name').value=editing.name||'';document.getElementById('objective').value=editing.objective||'';document.getElementById('description').value=editing.description||''}function closeEditor(){document.getElementById('editor').classList.remove('show');document.getElementById('list').style.display='block';render()}function saveProgram(){editing.name=document.getElementById('name').value.trim()||'Mon programme';editing.objective=document.getElementById('objective').value.trim();editing.description=document.getElementById('description').value.trim();const i=programs.findIndex(p=>p.id===editing.id);if(i>=0)programs[i]=editing;else programs.unshift(editing);persist();closeEditor()}function remove(i){if(confirm('Supprimer ce programme ?')){programs.splice(i,1);persist();render()}}function start(i,si){const p=structuredClone(programs[i]);p.selectedSession=si;localStorage.setItem('hs_custom_active_program',JSON.stringify(p));location.href='seance.html?custom=1'}programs=loadLocal();render();loadPublic();</script></body></html>
