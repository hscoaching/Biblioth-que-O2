<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HS Coaching — Fiche admin</title><link rel="stylesheet" href="style.css"><style>
.wrap{max-width:900px;margin:auto;padding:28px 0 90px}.back{display:inline-flex;color:#aaa;text-decoration:none;margin-bottom:18px}.fiche{background:#111;border:1px solid #292929;border-radius:20px;overflow:hidden}.hero-media{background:#090909;min-height:300px;display:flex;align-items:center;justify-content:center}.hero-media img,.hero-media video{width:100%;height:360px;object-fit:contain}.content{padding:24px}.eyebrow{margin-bottom:8px}.title{font-size:clamp(34px,7vw,58px);letter-spacing:-2px;margin:0 0 12px;overflow-wrap:anywhere}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{background:#1b1b1b;border:1px solid #303030;border-radius:999px;padding:7px 10px;color:#bbb;font-size:12px}.section{border-top:1px solid #292929;padding:22px 0}.section h2{margin:0 0 12px}.steps{display:grid;gap:9px;counter-reset:step}.step{display:flex;gap:12px;align-items:flex-start;overflow-wrap:anywhere}.step:before{counter-increment:step;content:counter(step);width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}.tip{background:#181818;border:1px solid #303030;border-radius:14px;padding:16px;color:#ddd;overflow-wrap:anywhere}.edit{margin-top:18px;background:#141414;border:1px solid #303030;border-radius:16px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea{width:100%;box-sizing:border-box;background:#0d0d0d;border:1px solid #303030;color:#fff;border-radius:10px;padding:12px;font:inherit;min-width:0}.field textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;max-width:100%}.primary{background:#fff;color:#000}.status{margin-top:10px;color:#aaa;overflow-wrap:anywhere}.ok{color:#a9efba}.err{color:#ffb0b0}@media(max-width:650px){.wrap{padding:20px 0 70px}.hero-media{min-height:0}.hero-media img,.hero-media video{height:auto;aspect-ratio:1/1;object-fit:contain}.content{padding:18px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.edit{padding:14px}.edit .btn{width:100%;min-height:46px}.section{padding:18px 0}.title{font-size:clamp(30px,10vw,42px)}}
</style></head><body><header class="topbar"><div class="brand"><span class="brand-mark">HS</span><div><strong>HS COACHING</strong><small>Fiche exercice — Admin</small></div></header><main class="container wrap"><a class="back" href="admin.html">← Retour à l’administration</a><div id="app">Chargement…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="ergonomie.js"></script><script>
const URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',sb=supabase.createClient(URL,KEY),app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));const id=new URLSearchParams(location.search).get('id');let e;
async function main(){const {data:{user}}=await sb.auth.getUser();if(!user){app.innerHTML='<div class="fiche content">Connexion admin requise.</div>';return}const a=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(!a.data){app.innerHTML='<div class="fiche content">Accès refusé.</div>';return}if(!id){app.innerHTML='<div class="fiche content">Aucun exercice sélectionné.</div>';return}const r=await sb.from('exercises').select('*').eq('id',id).maybeSingle();if(r.error||!r.data){app.innerHTML='<div class="fiche content">Exercice introuvable.</div>';return}e=r.data;render()}
function media(){if(!e.media_url)return '';const u=esc(e.media_url);return /\.(mp4|webm|mov)(\?|$)/i.test(e.media_url)?`<video src="${u}" controls muted playsinline></video>`:`<img src="${u}" alt="${esc(e.name)}">`}
function render(){const muscles=(e.muscles||[]).map(m=>`<span class="pill">${esc(m)}</span>`).join('');const steps=(e.instructions||[]).map(x=>`<div class="step">${esc(x)}</div>`).join('');const tips=(e.tips||[]).map(x=>`<div class="tip">${esc(x)}</div>`).join('');app.innerHTML=`<article class="fiche"><div class="hero-media">${media()}</div><div class="content"><p class="eyebrow">${e.is_published?'EXERCICE PUBLIÉ':'BROUILLON'}</p><h1 class="title">${esc(e.name)}</h1><div class="meta"><span class="pill">${esc(e.equipment||'Sans matériel')}</span>${muscles}</div>${e.description?`<div class="section"><h2>Le mouvement</h2><p>${esc(e.description)}</p></div>`:''}${steps?`<div class="section"><h2>Exécution</h2><div class="steps">${steps}</div></div>`:''}${tips?`<div class="section"><h2>Conseil du coach</h2>${tips}</div>`:''}</div></article><section class="edit"><p class="eyebrow">MODIFICATION</p><h2>Modifier cet exercice</h2><div class="grid"><div class="field"><label>Nom</label><input id="name" value="${esc(e.name)}"></div><div class="field"><label>Équipement</label><input id="equipment" value="${esc(e.equipment||'')}"></div><div class="field full"><label>Description</label><textarea id="description">${esc(e.description||'')}</textarea></div><div class="field"><label>Muscles — un par ligne</label><textarea id="muscles">${esc((e.muscles||[]).join('\n'))}</textarea></div><div class="field"><label>Instructions — une par ligne</label><textarea id="instructions">${esc((e.instructions||[]).join('\n'))}</textarea></div><div class="field full"><label>Conseils — un par ligne</label><textarea id="tips">${esc((e.tips||[]).join('\n'))}</textarea></div></div><button class="btn primary" style="margin-top:14px" onclick="save()">Enregistrer les modifications</button><div id="status" class="status"></div></section>`}
async function save(){const payload={name:name.value.trim(),equipment:equipment.value.trim()||null,description:description.value.trim()||null,muscles:muscles.value.split('\n').map(x=>x.trim()).filter(Boolean),instructions:instructions.value.split('\n').map(x=>x.trim()).filter(Boolean),tips:tips.value.split('\n').map(x=>x.trim()).filter(Boolean)};if(!payload.name){status.textContent='Le nom est obligatoire.';status.className='status err';return}status.textContent='Enregistrement…';status.className='status';const r=await sb.from('exercises').update(payload).eq('id',e.id);if(r.error){status.textContent=r.error.message;status.className='status err';return}e={...e,...payload};status.textContent='Enregistré. Le client verra cette version automatiquement.';status.className='status ok';render()}
main();
</script></body></html>
