<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HS Coaching — Fiche admin</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:900px;margin:auto;padding:28px 0 90px}.back{display:inline-flex;color:#aaa;text-decoration:none;margin-bottom:18px}.fiche{background:#111;border:1px solid #292929;border-radius:20px;overflow:hidden}.hero-media{background:#090909;min-height:300px;display:flex;align-items:center;justify-content:center}.hero-media img,.hero-media video{width:100%;height:360px;object-fit:contain}.content{padding:24px}.title{font-size:clamp(34px,7vw,58px);letter-spacing:-2px;margin:0 0 12px;overflow-wrap:anywhere}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.pill{background:#1b1b1b;border:1px solid #303030;border-radius:999px;padding:7px 10px;color:#bbb;font-size:12px}.section{border-top:1px solid #292929;padding:22px 0}.section h2{margin:0 0 12px}.steps{display:grid;gap:9px;counter-reset:step}.step{display:flex;gap:12px;align-items:flex-start;overflow-wrap:anywhere}.step:before{counter-increment:step;content:counter(step);width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}.tip{background:#181818;border:1px solid #303030;border-radius:14px;padding:16px;color:#ddd;overflow-wrap:anywhere}.edit{margin-top:18px;background:#141414;border:1px solid #303030;border-radius:16px;padding:18px}.status{margin-top:10px;color:#aaa;overflow-wrap:anywhere}.client-preview{margin-top:18px;background:#101010;border:1px solid #303030;border-radius:16px;padding:14px}.client-preview-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.client-preview-head a{color:#aaa;text-decoration:none;font-size:12px}.client-preview iframe{display:block;width:100%;height:760px;border:1px solid #292929;border-radius:14px;background:#111}@media(max-width:650px){.wrap{padding:20px 0 70px}.hero-media{min-height:0}.hero-media img,.hero-media video{height:auto;aspect-ratio:1/1;object-fit:contain}.content{padding:18px}.edit{padding:14px}.section{padding:18px 0}.title{font-size:clamp(30px,10vw,42px)}.client-preview{padding:10px}.client-preview iframe{height:700px}}</style></head><body><header class="topbar"><div class="brand"><span class="brand-mark">HS</span><div><strong>HS COACHING</strong><small>Fiche exercice — Admin</small></div></div></header><main class="container wrap"><a class="back" href="admin.html">← Retour à l’administration</a><div id="app">Chargement…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="ergonomie.js"></script><script>
const URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',sb=supabase.createClient(URL,KEY),app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));const id=new URLSearchParams(location.search).get('id');let e;
async function main(){const {data:{user}}=await sb.auth.getUser();if(!user){app.innerHTML='<div class="fiche content">Connexion admin requise.</div>';return}const a=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(!a.data){app.innerHTML='<div class="fiche content">Accès refusé.</div>';return}if(!id){app.innerHTML='<div class="fiche content">Aucun exercice sélectionné.</div>';return}const r=await sb.from('exercises').select('*').eq('id',id).maybeSingle();if(r.error||!r.data){app.innerHTML='<div class="fiche content">Exercice introuvable.</div>';return}e=r.data;render()}

function render(){const name=e.name_fr||e.name||'Exercice sans nom',description=e.description_fr||e.description||'',instructions=e.instructions_fr?.length?e.instructions_fr:(e.instructions||[]),tips=e.tips_fr?.length?e.tips_fr:(e.tips||[]),muscles=(e.muscles||[]).map(m=>`<span class="pill">${esc(m)}</span>`).join(''),steps=instructions.map(x=>`<div class="step">${esc(x)}</div>`).join(''),tipsHtml=tips.map(x=>`<div class="tip">${esc(x)}</div>`).join('');const clientUrl=`index.html?exercice=${encodeURIComponent(e.slug||e.id)}`;app.innerHTML=`<article class="fiche"><div class="hero-media">${media()}</div><div class="content"><p class="eyebrow">${e.is_published?'EXERCICE PUBLIÉ':'BROUILLON'}</p><h1 class="title">${esc(name)}</h1><div class="meta"><span class="pill">${esc(e.equipment||'Sans matériel')}</span>${muscles}</div>${description?`<div class="section"><h2>Le mouvement</h2><p>${esc(description)}</p></div>`:''}${steps?`<div class="section"><h2>Exécution</h2><div class="steps">${steps}</div></div>`:''}${tipsHtml?`<div class="section"><h2>Conseil du coach</h2>${tipsHtml}</div>`:''}</div></article><section class="client-preview"><div class="client-preview-head"><strong>APERÇU CÔTÉ CLIENT</strong><a href="${clientUrl}" target="_blank" rel="noopener">Ouvrir dans un nouvel onglet ↗</a></div><iframe src="${clientUrl}" title="Aperçu exact de la fiche client"></iframe></section><section class="edit"><p class="eyebrow">ADMIN</p><h2>Cette fiche utilise les champs français</h2><p class="status">La bibliothèque client utilise automatiquement les contenus français enregistrés ici.</p></section>`}
main();
</script></body></html>
