<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HS Coaching — Fiche exercice</title><style>*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.wrap{width:min(900px,100%);margin:auto;padding:18px 22px 35px}.top{display:flex;justify-content:flex-end;margin-bottom:8px}.close{width:40px;height:40px;border-radius:50%;border:1px solid #303030;background:#1b1b1b;color:#fff;font-size:25px;cursor:pointer}.kicker{font-size:9px;font-weight:900;letter-spacing:2px;color:#666;margin-top:4px}.back{display:inline-flex;margin:10px 0 16px;padding:8px 11px;border:1px solid #292929;border-radius:9px;background:#161616;color:#aaa;font-size:10px;font-weight:800;cursor:pointer}.divider{height:1px;background:#242424;margin-bottom:14px}h1{font-size:clamp(27px,5vw,40px);line-height:1.05;letter-spacing:-1px;margin:0 0 16px;max-width:750px}.media{min-height:330px;border:1px solid #252525;border-radius:16px;background:#eee;overflow:hidden;margin-bottom:18px;padding:12px;display:grid;place-items:center;position:relative}.media-pair{display:block!important;position:relative!important;width:100%!important;height:100%!important;min-height:306px!important;overflow:visible!important}.media-pair img{position:absolute;left:50%;top:50%;width:auto;height:auto;max-width:78%;max-height:78%;display:block;object-fit:contain;transform:translate(-50%,-50%)}.media-pair .media-a{animation:exercisePoseA 1.7s ease-in-out infinite}.media-pair .media-b{animation:exercisePose 1.7s ease-in-out infinite}.media>img{display:block;width:auto;height:auto;max-width:88%;max-height:430px;object-fit:contain}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px}.meta-item{background:#0d0d0d;border:1px solid #202020;border-radius:11px;padding:11px 13px;min-height:62px}.meta-item small{font-size:8px;color:#666;text-transform:uppercase}.meta-item strong{display:block;font-size:12px;margin-top:5px;line-height:1.35}.label{font-size:9px;font-weight:900;letter-spacing:1.8px;color:#666;text-transform:uppercase;margin:18px 0 8px}.primary{padding:14px 0 17px;border-top:1px solid #242424;border-bottom:1px solid #242424}.steps{display:grid;gap:8px}.step{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;background:#0d0d0d;border:1px solid #202020;border-radius:11px}.num{flex:0 0 25px;height:25px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:11px;font-weight:900}.text{font-size:13px;line-height:1.55;color:#bbb;padding-top:2px}.coach{border:1px solid #303030;box-shadow:inset 3px 0 0 #fff;background:#0d0d0d;border-radius:11px;padding:15px 16px;color:#bbb;font-size:13px;line-height:1.6}.error{text-align:center;color:#ff8b8b;padding:45px 10px}.loading{text-align:center;color:#777;padding:60px 10px}@keyframes exercisePose{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@keyframes exercisePoseA{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@media(max-width:600px){.wrap{padding:10px 13px 25px}.media{min-height:275px;margin-bottom:14px;padding:8px}.media-pair{min-height:251px!important}.media-pair img{max-width:72%;max-height:72%}.media>img{max-height:300px;max-width:88%}.meta{grid-template-columns:1fr 1fr}.step{gap:9px;padding:9px 10px}.text{font-size:12px;line-height:1.48}}@media(max-width:380px){.meta{grid-template-columns:1fr}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){.media-pair .media-a,.media-pair .media-b{animation:none}.media-pair .media-b{display:none}.media-pair .media-a{opacity:1}}</style></head><body><main class="wrap"><div class="top"><button class="close" id="close" aria-label="Fermer">×</button></div><div id="app" class="loading">Chargement de la fiche…</div></main><script>const SUPA='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB';const DATA_URL='https://exercise-dataset.com/exercises.json';const params=new URLSearchParams(location.search);const id=params.get('id');const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function api(path){const r=await fetch(SUPA+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function close(){if(window.parent!==window)window.parent.postMessage({type:'hs-close-fiche'},'*');else history.back()}document.getElementById('close').onclick=close;function animationUrl(media){return media&&/-start\.webp(?:\?.*)?$/i.test(media)?media.replace(/-start\.webp/i,'-peak.webp'):''}function mediaHtml(media,name){if(!media)return '';const peak=animationUrl(media);if(peak)return '<div class="media media-pair"><img class="media-a" src="'+esc(media)+'" alt="Position de départ — '+esc(name)+'"><img class="media-b" src="'+esc(peak)+'" alt="Position finale — '+esc(name)+'" onerror="this.remove();this.closest(\'.media-pair\').classList.remove(\'media-pair\');this.classList.remove(\'media-b\');this.closest(\'.media-pair\')?.querySelector(\'.media-a\')?.style.setProperty(\'animation\',\'none\')"></div>';return '<div class="media"><img src="'+esc(media)+'" alt="Illustration — '+esc(name)+'"></div>'}async function load(){try{if(!id)throw Error('Exercice introuvable');let rows=[];const uuidLike=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id);const numericLike=/^\d+$/.test(id);const fields='id,name,name_fr,description,description_fr,instructions_fr,instructions,tips_fr,tips,muscles,equipment,media_url';if(uuidLike){rows=await api('exercises?select='+fields+'&id=eq.'+encodeURIComponent(id)+'&limit=1')}else if(numericLike){rows=await api('exercises?select='+fields+'&id=eq.'+encodeURIComponent(id)+'&limit=1')}else{rows=await api('exercises?select='+fields+'&slug=eq.'+encodeURIComponent(id)+'&limit=1')}if(!rows.length)throw Error('Exercice introuvable');const e=rows[0],name=e.name_fr||e.name,desc=e.description_fr||e.description,ins=Array.isArray(e.instructions_fr)&&e.instructions_fr.length?e.instructions_fr:(e.instructions||[]),tips=Array.isArray(e.tips_fr)&&e.tips_fr.length?e.tips_fr:(e.tips||[]);const muscles=(Array.isArray(e.muscles)?e.muscles:[]).slice(0,6).map(esc).join(', ')||'—';app.className='';app.innerHTML='<div class="kicker">FICHE EXERCICE</div><div class="divider"></div><button class="back" onclick="close()">← Retour au programme</button><h1>'+esc(name)+'</h1>'+mediaHtml(e.media_url,name)+'<div class="meta"><div class="meta-item"><small>Matériel</small><strong>'+esc(e.equipment||'Poids du corps')+'</strong></div><div class="meta-item"><small>Muscles sollicités</small><strong>'+muscles+'</strong></div></div>'+(desc?'<div class="label">À retenir</div><div class="primary"><div class="text">'+esc(desc)+'</div></div>':'')+(ins.length?'<div class="label">Exécution</div><div class="steps">'+ins.map((x,i)=>'<div class="step"><span class="num">'+(i+1)+'</span><span class="text">'+esc(x)+'</span></div>').join('')+'</div>':'')+(tips.length?'<div class="label">Conseil du coach</div><div class="coach">'+esc(tips[0])+'</div>':'')}catch(err){console.error(err);app.className='error';app.textContent='Impossible de charger la fiche : '+err.message}}load();</script></body></html>
