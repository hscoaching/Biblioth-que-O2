<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>HS Coaching — Fiche exercice</title><style>*{box-sizing:border-box}html,body{margin:0;background:#111;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.wrap{width:min(900px,100%);margin:auto;padding:12px 22px 35px}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px;background:linear-gradient(#111 75%,transparent);margin-bottom:2px}.context{font-size:9px;font-weight:900;letter-spacing:1.4px;color:#666;text-transform:uppercase}.close{width:40px;height:40px;border-radius:50%;border:1px solid #303030;background:#1b1b1b;color:#fff;font-size:25px;cursor:pointer}.back{position:sticky;top:49px;z-index:15;display:inline-flex;align-items:center;gap:7px;margin:2px 0 16px;padding:9px 12px;border:1px solid #333;border-radius:10px;background:#171717;color:#ddd;font-size:10px;font-weight:900;cursor:pointer;box-shadow:0 8px 24px #0006}.kicker{font-size:9px;font-weight:900;letter-spacing:2px;color:#666;margin-top:4px}.divider{height:1px;background:#242424;margin-bottom:14px}h1{font-size:clamp(27px,5vw,40px);line-height:1.05;letter-spacing:-1px;margin:0 0 16px}.media{min-height:330px;border:1px solid #252525;border-radius:16px;background:#eee;overflow:hidden;margin-bottom:18px;padding:12px;display:grid;place-items:center}.media>img{display:block;width:100%;height:300px;object-fit:contain}.media-pair{display:block!important;position:relative!important;width:100%!important;height:300px!important;overflow:hidden!important}.media-pair img{position:absolute;inset:0;width:100%;height:300px;display:block;object-fit:contain}.media-pair .media-a{animation:a 1.7s ease-in-out infinite}.media-pair .media-b{animation:b 1.7s ease-in-out infinite}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px}.meta-item{background:#0d0d0d;border:1px solid #202020;border-radius:11px;padding:11px 13px}.meta-item small{font-size:8px;color:#666;text-transform:uppercase}.meta-item strong{display:block;font-size:12px;margin-top:5px}.label{font-size:9px;font-weight:900;letter-spacing:1.8px;color:#666;text-transform:uppercase;margin:18px 0 8px}.primary{padding:14px 0 17px;border-top:1px solid #242424;border-bottom:1px solid #242424}.steps{display:grid;gap:8px}.step{display:flex;gap:12px;padding:11px 12px;background:#0d0d0d;border:1px solid #202020;border-radius:11px}.num{flex:0 0 25px;height:25px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:11px;font-weight:900}.text{font-size:13px;line-height:1.55;color:#bbb;padding-top:2px}.coach{border:1px solid #303030;box-shadow:inset 3px 0 0 #fff;background:#0d0d0d;border-radius:11px;padding:15px 16px;color:#bbb;font-size:13px;line-height:1.6}.loading{text-align:center;color:#777;padding:60px 10px}.error{text-align:center;color:#ff8b8b;padding:45px 10px}@keyframes a{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}@keyframes b{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}@media(max-width:600px){.wrap{padding:7px 13px calc(25px + env(safe-area-inset-bottom))}.media{min-height:275px;padding:8px}.media>img,.media-pair,.media-pair img{height:250px}.meta{grid-template-columns:1fr 1fr}.text{font-size:12px}}@media(max-width:380px){.meta{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.media-pair .media-a,.media-pair .media-b{animation:none}.media-pair .media-b{display:none}.media-pair .media-a{opacity:1}}</style></head><body><main class="wrap"><div class="top"><div class="context">HS Coaching · Bibliothèque O2</div><button class="close" type="button" aria-label="Fermer" onclick="closeFichePage()">×</button></div><div id="app" class="loading">Chargement de la fiche…</div></main><script>const SUPA='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB';const id=new URLSearchParams(location.search).get('id'),app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p){const r=await fetch(SUPA+'/rest/v1/'+p,{headers:{apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}function closeFichePage(){if(window.parent!==window&&typeof window.parent.closeFiche==='function'){window.parent.closeFiche();return}if(window.parent!==window){window.parent.postMessage('close-fiche','*');return}history.back()}function animationUrl(m){return m&&/-start\.webp(?:\?.*)?$/i.test(m)?m.replace(/-start\.webp/i,'-peak.webp'):''}function mediaHtml(m,n){if(!m)return '';const p=animationUrl(m);if(p)return '<div class="media media-pair"><img class="media-a" src="'+esc(m)+'" alt="Position de départ — '+esc(n)+'"><img class="media-b" src="'+esc(p)+'" alt="Position finale — '+esc(n)+'" onerror="this.remove()"></div>';return '<div class="media"><img src="'+esc(m)+'" alt="Illustration — '+esc(n)+'"></div>'}async function load(){try{if(!id)throw Error('Exercice introuvable');const numeric=/^\d+$/.test(id),uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id),fields='id,name,name_fr,description,description_fr,instructions_fr,instructions,tips_fr,tips,muscles,equipment,media_url';const rows=await api('exercises?select='+fields+'&'+((numeric||uuid)?'id=eq.':'slug=eq.')+encodeURIComponent(id)+'&limit=1');if(!rows.length)throw Error('Exercice introuvable');const e=rows[0],n=e.name_fr||e.name,d=e.description_fr||e.description,ins=Array.isArray(e.instructions_fr)&&e.instructions_fr.length?e.instructions_fr:(e.instructions||[]),tips=Array.isArray(e.tips_fr)&&e.tips_fr.length?e.tips_fr:(e.tips||[]),muscles=(Array.isArray(e.muscles)?e.muscles:[]).slice(0,6).map(esc).join(', ')||'—';app.className='';app.innerHTML='<div class="kicker">FICHE EXERCICE</div><div class="divider"></div><button class="back" type="button" onclick="closeFichePage()">← Retour au programme</button><h1>'+esc(n)+'</h1>'+mediaHtml(e.media_url,n)+'<div class="meta"><div class="meta-item"><small>Matériel</small><strong>'+esc(e.equipment||'Poids du corps')+'</strong></div><div class="meta-item"><small>Muscles sollicités</small><strong>'+muscles+'</strong></div></div>'+(d?'<div class="label">À retenir</div><div class="primary"><div class="text">'+esc(d)+'</div></div>':'')+(ins.length?'<div class="label">Exécution</div><div class="steps">'+ins.map((x,i)=>'<div class="step"><span class="num">'+(i+1)+'</span><span class="text">'+esc(x)+'</span></div>').join('')+'</div>':'')+(tips.length?'<div class="label">Conseil du coach</div><div class="coach">'+esc(tips[0])+'</div>':'')}catch(err){app.className='error';app.textContent='Impossible de charger la fiche : '+err.message}}load();</script></body></html>
