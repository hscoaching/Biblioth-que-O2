<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>HS Coaching — Hugo Santos</title>
  <style>
    :root{
      --bg:#000;
      --text:#f7f7f7;
      --muted:#bfbfbf;
      --line:#ececec;
      --card:#050505;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    body{min-height:100vh}
    .wrap{
      width:min(100%, 760px);
      margin:0 auto;
      padding:42px 24px 56px;
      text-align:center;
    }
    .barbell{
      width:min(82vw,520px);
      margin:0 auto 12px;
      display:block;
    }
    .brand{
      font-size:clamp(34px,8vw,58px);
      line-height:.9;
      font-weight:900;
      letter-spacing:-1px;
      -webkit-text-stroke:1px #fff;
      color:transparent;
      margin-top:-10px;
    }
    .brand span{
      display:block;
      font-size:.55em;
      margin-top:7px;
      letter-spacing:-1px;
    }
    .tagline{
      margin:28px auto 26px;
      max-width:520px;
      font-size:clamp(14px,2.6vw,20px);
      letter-spacing:.34em;
      line-height:1.35;
      color:#f4f4f4;
    }
    .divider{
      width:78px;
      height:2px;
      background:var(--line);
      margin:24px auto 28px;
      opacity:.95;
    }
    h1{
      margin:0;
      font-size:clamp(40px,8vw,66px);
      font-weight:300;
      letter-spacing:.16em;
      line-height:1.04;
    }
    .role{
      margin-top:14px;
      font-size:clamp(17px,3.2vw,25px);
      letter-spacing:.24em;
      color:#d8d8d8;
      font-weight:300;
    }
    .location{
      margin-top:22px;
      font-size:clamp(17px,3.2vw,24px);
      letter-spacing:.19em;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;
      color:#f0f0f0;
    }
    .pin{
      width:22px;height:28px;display:inline-block;position:relative;flex:0 0 auto
    }
    .pin:before{
      content:"";
      position:absolute;left:3px;top:0;
      width:16px;height:16px;border:3px solid #fff;border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
    }
    .pin:after{
      content:"";
      position:absolute;left:9px;top:7px;width:5px;height:5px;background:#fff;border-radius:50%
    }
    .services{
      width:min(100%, 560px);
      margin:0 auto 28px;
      text-align:left;
      display:grid;
      gap:24px;
    }
    .service{
      display:grid;
      grid-template-columns:56px 1fr;
      align-items:center;
      gap:14px;
      font-size:clamp(17px,3vw,23px);
      letter-spacing:.08em;
      color:#e9e9e9;
    }
    .ico{
      width:42px;height:42px;
      display:grid;place-items:center;
      font-size:30px;
      filter:grayscale(1) brightness(4);
    }
    .actions{
      width:min(100%, 650px);
      margin:0 auto;
      display:grid;
      gap:14px;
    }
    .btn{
      min-height:82px;
      border:2px solid #fff;
      border-radius:999px;
      color:#fff;
      text-decoration:none;
      display:grid;
      grid-template-columns:64px 1fr 28px;
      align-items:center;
      padding:0 20px;
      font-size:clamp(18px,3.4vw,25px);
      font-weight:700;
      letter-spacing:.12em;
      transition:.18s ease;
      background:#020202;
    }
    .btn:hover,.btn:focus{
      background:#fff;color:#000;
      outline:none;
    }
    .circle{
      width:54px;height:54px;border-radius:50%;
      background:#fff;color:#000;
      display:grid;place-items:center;
      font-size:27px;
      line-height:1;
    }
    .arrow{font-size:38px;font-weight:200;line-height:1}
    .footer{
      margin-top:36px;
      font-size:clamp(13px,2.5vw,18px);
      letter-spacing:.28em;
      color:#e8e8e8;
    }
    @media (max-width:520px){
      .wrap{padding:30px 16px 42px}
      h1{letter-spacing:.10em}
      .role{letter-spacing:.15em}
      .location{letter-spacing:.11em}
      .service{grid-template-columns:46px 1fr}
      .btn{grid-template-columns:58px 1fr 24px;min-height:72px;padding:0 15px}
      .circle{width:46px;height:46px;font-size:23px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <svg class="barbell" viewBox="0 0 700 220" aria-label="Logo haltère HS Coaching">
      <g fill="#fff">
        <rect x="180" y="93" width="340" height="24" rx="2"/>
        <rect x="112" y="36" width="28" height="138"/>
        <rect x="145" y="55" width="26" height="100"/>
        <rect x="80" y="70" width="23" height="70"/>
        <rect x="60" y="95" width="15" height="20"/>
        <rect x="560" y="36" width="28" height="138"/>
        <rect x="529" y="55" width="26" height="100"/>
        <rect x="597" y="70" width="23" height="70"/>
        <rect x="626" y="95" width="15" height="20"/>
      </g>
    </svg>

    <div class="brand">HS<span>COACHING</span></div>
    <div class="tagline">VOTRE TRANSFORMATION<br>COMMENCE MAINTENANT</div>

    <div class="divider"></div>

    <h1>HUGO SANTOS</h1>
    <div class="role">COACH SPORTIF CERTIFIÉ</div>
    <div class="location"><span class="pin" aria-hidden="true"></span><span>SAINT-GERMAIN-EN-LAYE</span></div>

    <div class="divider"></div>

    <section class="services" aria-label="Services">
      <div class="service"><span class="ico">🏃</span><span>PRÉPARATION PHYSIQUE</span></div>
      <div class="service"><span class="ico">↘</span><span>PERTE DE POIDS</span></div>
      <div class="service"><span class="ico">♡</span><span>REMISE EN FORME</span></div>
      <div class="service"><span class="ico">▤</span><span>PROGRAMMES PERSONNALISÉS</span></div>
    </section>

    <div class="divider"></div>

    <section class="actions" aria-label="Contact">
      <a class="btn" href="tel:+33687612469" aria-label="Appeler Hugo au +33 6 87 61 24 69">
        <span class="circle">☎</span><span>APPELER HUGO</span><span class="arrow">›</span>
      </a>
      <a class="btn" href="mailto:hscoach78@gmail.com" aria-label="Envoyer un e-mail à Hugo">
        <span class="circle">✉</span><span>ENVOYER UN E-MAIL</span><span class="arrow">›</span>
      </a>
    </section>

    <div class="divider"></div>
    <div class="footer">DISCIPLINE &nbsp; | &nbsp; PROGRÈS &nbsp; | &nbsp; RÉSULTATS</div>
  </main>
</body>
</html>
