d:#111;border:1px solid #333;border-radius:16px;overflow:hidden;box-shadow:0 20px 70px #000}.fiche{width:100%;height:100%;border:0;background:#111;display:block}.fiche-close{position:absolute;right:10px;top:10px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid #555;background:#151515;color:#fff;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 6px 20px #0009}.fiche-close:active{transform:scale(.94)}@media(min-width:651px){body{padding-top:18px}.wrap{padding-bottom:50px}.top{border:1px solid #292929;border-radius:14px;margin:0 0 14px;padding:13px 15px}}@media(max-width:600px){.fiche-wrap{padding:0}.fiche-panel{width:100%;height:100%;border-radius:0;border:0}.fiche-close{right:10px;top:10px}}@media(prefers-reduced-motion:reduce){.fiche-close{transition:none}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.progress i{transition:none}.fiche-close{transition:none}}button,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}</style></head><body><main class="wrap"><header class="top"><div><div class="k">SÉANCE EN COURS</div><h1 id="programName">Chargement…</h1><div id="sessionName" class="session-name"></div></div><div style="display:flex;align-items:center;gap:10px"><a id="backLink" href="mes-programmes.html" style="color:#fff;text-decoration:none;font-size:10px;font-weight:900;border:1px solid #333;border-radius:9px;padding:8px 9px">← Retour</a><div id="timer" class="timer">00:00</div></div></header><div class="progress"><i id="progressBar"></i></div><div id="exerciseNav" class="exercise-nav"></div><section id="app"></section><section id="summary" class="exercise-card summary"></section></main><script>const SUPA='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',HISTORY_KEY='hs_workout_history_v1',ACTIVE_KEY='hs_active_workout';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p){const r=await fetch(SUPA+'/rest/v1/'+p,{headers:{apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}const q=new URLSearchParams(location.search),programId=q.get('program'),sessionId=q.get('session'),customMode=q.get('custom')==='1';let program,session,items=[],current=0,startedAt,workoutSets=[],restId=null,restUntil=0;function active(){try{return JSON.parse(localStorage.getItem(ACTIVE_KEY)||'null')}catch{return null}}function save(){localStorage.setItem(ACTIVE_KEY,JSON.stringify({program_id:customMode?'custom':programId,session_id:customMode?(session?.id||'custom'):sessionId,program_name:program?.name||'',session_name:session?.name||'',startedAt,exercise_index:current,sets:workoutSets}))}function fmt(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}let timerId=null;function timer(){if(timerId)clearInterval(timerId);const tick=()=>{if(startedAt)document.getElementById('timer').textContent=fmt(Math.floor((Date.now()-new Date(startedAt))/1000))};tick();timerId=setInterval(tick,1000)}function renderNav(){const n=document.getElementById('exerciseNav');n.innerHTML=items.map((e,i)=>{const sets=workoutSets[i]?.sets||[],done=sets.length>0&&sets.every(s=>s?.done);return '<button class="'+(i===current?'active ':'')+(done?'done':'')+'" onclick="goToExercise('+i+')">'+String(i+1).padStart(2,'0')+'</button>'}).join('')}function startRest(seconds){if(restId)clearInterval(restId);restUntil=Date.now()+seconds*1000;const tick=()=>{const left=Math.max(0,Math.ceil((restUntil-Date.now())/1000));const el=document.getElementById("restTime");if(el)el.textContent=fmt(left);if(!left){clearInterval(restId);restId=null;}};tick();restId=setInterval(tick,250)}function render(){if(!items.length)return;const e=items[current],s=workoutSets[current]||{sets:[]},total=Number(e.sets)||1,first=s.sets[0]||{load:e.load||'',reps:e.reps||''};document.getElementById('progressBar').style.width=((current+1)/items.length*100)+'%';renderNav();document.getElementById('app').innerHTML='<section class="exercise-card"><div class="exercise-num">EXERCICE '+String(current+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0')+'</div><div class="exercise-name">'+esc(e.name)+'</div><div class="prescription">'+esc(e.sets&&e.reps?e.sets+' × '+e.reps:'')+(e.rest?' · Repos '+esc(e.rest):'')+(e.tempo?' · Tempo '+esc(e.tempo):'')+(e.load?' · Charge prévue '+esc(e.load):'')+'</div><div class="set-list">'+Array.from({length:total},(_,i)=>{const v=s.sets[i]||{load:first.load||'',reps:first.reps||''},done=!!s.sets[i]?.done;return '<div class="set '+(done?'done':'')+'"><div class="set-label">S'+(i+1)+'</div><input class="input load" type="number" inputmode="decimal" placeholder="kg" value="'+esc(v.load)+'"><input class="input reps" type="number" inputmode="numeric" placeholder="reps" value="'+esc(v.reps)+'"><button class="done-mark" onclick="validateSet('+i+')">'+(done?'✓':'○')+'</button></div>'}).join('')+'</div><div class="rest-box"><div><small>REPOS</small><div id="restTime" class="rest-time">'+esc(e.rest||'—')+'</div></div><div class="rest-controls"><button onclick="startRest(30)">30s</button><button onclick="startRest(60)">60s</button><button onclick="startRest(90)">90s</button></div></div><div class="actions"><button class="btn" onclick="openFiche(' + JSON.stringify(e.exercise_id) + ')">Fiche exercice</button></div>'+(current<items.length-1?'<button class="btn next-btn" onclick="goToExercise('+(current+1)+')">Exercice suivant →</button>':'')+'</section><div class="bottom"><button class="finish" onclick="finishWorkout()">Terminer la séance</button></div>';document.querySelectorAll('.load,.reps').forEach(input=>input.addEventListener('input',()=>{workoutSets[current]??={sets:[]};const row=input.closest('.set'),idx=Array.from(document.querySelectorAll('.set')).indexOf(row);if(idx<0)return;workoutSets[current].sets[idx]={load:row.querySelector('.load').value,reps:row.querySelector('.reps').value,done:!!workoutSets[current].sets[idx]?.done};save()}))}function goToExercise(i){if(i<0||i>=items.length)return;current=i;closeFiche();save();render();window.scrollTo({top:0,behavior:'smooth'})}function readRow(i){const row=document.querySelectorAll('.set')[i];return {load:row.querySelector('.load').value,reps:row.querySelector('.reps').value}}function validateSet(i){const row=document.querySelectorAll('.set')[i];if(!row)return;const v=readRow(i);if(v.load===''&&v.reps===''){row.querySelector('.load').focus();return}workoutSets[current]??={sets:[]};workoutSets[current].sets[i]={...v,done:true};const exerciseDone=workoutSets[current].sets.length===Number(items[current]?.sets||1)&&workoutSets[current].sets.every(s=>s?.done);save();if(exerciseDone&&current<items.length-1){current+=1;save();render();window.scrollTo({top:0,behavior:'smooth'});return}render()}function openFiche(id){closeFiche();const wrap=document.createElement('div');wrap.id='ficheWrap';wrap.className='fiche-wrap show';wrap.innerHTML='<div class="fiche-panel" onclick="event.stopPropagation()"><button class="fiche-close" type="button" aria-label="Fermer la fiche" onclick="closeFiche()">×</button><iframe id="fiche" class="fiche" title="Fiche exercice"></iframe></div>';wrap.addEventListener('click',closeFiche);document.body.appendChild(wrap);const f=document.getElementById('fiche');f.src='fiche.html?id='+encodeURIComponent(id)}function closeFiche(){const wrap=document.getElementById('ficheWrap');if(wrap){const f=wrap.querySelector('iframe');if(f)f.src='about:blank';wrap.remove()}window.scrollTo({top:0,behavior:'smooth'})}function resumeFinishedWorkout(){document.getElementById('summary').classList.remove('show');document.getElementById('summary').innerHTML='';document.getElementById('app').style.display='block';document.getElementById('exerciseNav').style.display='flex';render();timer()}function previousSetsForItems(list){let h=[];try{h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch{};const last={};for(const w of h){for(const ex of (w.exercises||[])){if(!last[ex.exercise_id]&&Array.isArray(ex.sets)&&ex.sets.length)last[ex.exercise_id]=ex.sets.map(s=>({load:s.load??'',reps:s.reps??'',done:false}))}}return list.map(e=>({sets:last[e.exercise_id]||[]}))}function finishWorkout(){closeFiche();if(restId){clearInterval(restId);restId=null};if(timerId){clearInterval(timerId);timerId=null}if(!workoutSets.some(e=>(e.sets||[]).some(s=>s?.done)))return;const duration=Math.max(1,Math.round((Date.now()-new Date(startedAt))/60000));let h=[];try{h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch{}h.unshift({date:new Date().toISOString(),program_name:program?.name||'',session_name:session?.name||'',duration_minutes:duration,exercises:items.map((e,i)=>({exercise_id:e.exercise_id,name:e.name,sets:(workoutSets[i]?.sets||[]).filter(s=>s?.done).map(s=>({load:Number(s.load)||0,reps:Number(s.reps)||0}))}))});localStorage.setItem(HISTORY_KEY,JSON.stringify(h));save();document.getElementById('app').style.display='none';document.getElementById('exerciseNav').style.display='none';const x=document.getElementById('summary');x.classList.add('show');x.innerHTML='<div class="k">SÉANCE TERMINÉE</div><div class="big">Bien joué 💪</div><div class="prescription">'+duration+' min · '+esc(session?.name||'Séance')+'</div><div style="margin-top:14px">'+items.map((e,i)=>{const done=(workoutSets[i]?.sets||[]).filter(s=>s?.done);if(!done.length)return '';return '<div style="padding:11px 0;border-top:1px solid #292929"><div style="font-size:12px;font-weight:900">'+esc(e.name)+'</div><div style="margin-top:6px;color:#aaa;font-size:10px;line-height:1.7">'+done.map((s,j)=>'S'+(j+1)+' : '+esc(s.load||'—')+' kg × '+esc(s.reps||'—')).join(' · ')+'</div></div>'}).join('')+'</div><div class="summary-actions" style="margin-top:16px"><a class="progress-link" href="progression-simple.html?program='+encodeURIComponent(program?.name||'')+'&program_id='+encodeURIComponent(programId||'')+'">Voir ma progression →</a><a class="back" href="'+(customMode?'mes-programmes.html':'programmes.html')+'">← Retour au programme</a></div><div style="margin-top:8px"><button class="finish" onclick="resumeFinishedWorkout()">Reprendre la séance</button></div>'}async function loadCustom(){const p=JSON.parse(localStorage.getItem('hs_custom_active_program')||'null');if(!p||!p.sessions?.length)throw Error('Programme personnel introuvable');program=p;session=p.sessions[Math.min(Number(p.selectedSession||0),p.sessions.length-1)];items=(session.exercises||[]).map(e=>({...e,name:e.name||'Exercice'}));const a=active();const same=a&&a.program_id==='custom'&&a.session_id===(session.id||'custom')&&Array.isArray(a.sets);startedAt=same&&a.startedAt?a.startedAt:new Date().toISOString();workoutSets=same?a.sets:previousSetsForItems(items);current=same?Math.min(Number(a.exercise_index||0),Math.max(0,items.length-1)):0;document.getElementById('programName').textContent=program.name||'Mon programme';document.getElementById('sessionName').textContent=session.name||'Séance';save();render();timer()}async function load(){try{if(customMode){document.getElementById('backLink').href='mes-programmes.html';await loadCustom();return}if(!programId||!sessionId)throw Error('missing');document.getElementById('backLink').href='programmes.html';[program]=await api('programs?select=id,name,objective,description&id=eq.'+encodeURIComponent(programId));[session]=await api('program_sessions?select=id,name,notes,position&id=eq.'+encodeURIComponent(sessionId));const rows=await api('program_exercises?select=exercise_id,position,sets,reps,rest,tempo,load,duration,notes&session_id=eq.'+encodeURIComponent(sessionId)+'&order=position.asc');const ids=[...new Set(rows.map(r=>r.exercise_id))],names=ids.length?Object.fromEntries((await api('exercises?select=id,name_fr&id=in.('+ids.join(',')+')')).map(x=>[x.id,x.name_fr])):{};items=rows.map(r=>({...r,name:names[r.exercise_id]||'Exercice'}));const a=active();startedAt=a&&a.program_id==programId&&a.session_id==sessionId?a.startedAt:new Date().toISOString();workoutSets=a&&a.program_id==programId&&a.session_id==sessionId&&Array.isArray(a.sets)?a.sets:previousSetsForItems(items);current=Math.min(Number(a?.exercise_index||0),Math.max(0,items.length-1));document.getElementById('programName').textContent=program?.name||'Programme';document.getElementById('sessionName').textContent=session?.name||'Séance';save();render();timer()}catch(e){document.getElementById('app').innerHTML='<section class="exercise-card">Impossible de charger cette séance.</section>'}}window.addEventListener('keydown',e=>{if(e.key==='Escape')closeFiche()});load();</script><script>window.HS_SUPABASE_CONFIG={url:"https://hcjoagpkgpqxgzjdyfvd.supabase.co",key:"sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB"};</script><script src="client-ui.js"></script></body></html>
