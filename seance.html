<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><title>HS Coaching — Séance</title><style>:root{--bg:#0b0b0b;--card:#141414;--line:#292929;--muted:#777;--soft:#1b1b1b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.wrap{max-width:620px;margin:auto;padding:0 14px 28px}.top{position:sticky;top:0;z-index:20;margin:0 -14px;padding:12px 14px;background:rgba(11,11,11,.96);backdrop-filter:blur(12px);border-bottom:1px solid #202020;display:flex;align-items:center;justify-content:space-between;gap:12px}.k{font-size:9px;letter-spacing:1.6px;color:#666;font-weight:900}.top h1{font-size:16px;margin:4px 0 0}.session-name{font-size:10px;color:#888;margin-top:3px}.timer{font-size:12px;font-weight:900;color:#fff}.progress{height:4px;background:#1d1d1d;border-radius:99px;overflow:hidden;margin:14px 0 16px}.progress i{display:block;height:100%;width:0;background:#fff;transition:.25s}.exercise-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:10px}.exercise-top{display:flex;justify-content:space-between;gap:12px}.exercise-num{color:#777;font-size:10px;font-weight:900}.exercise-name{font-size:22px;font-weight:900;margin-top:5px;letter-spacing:-.5px}.prescription{margin-top:8px;color:#999;font-size:11px;line-height:1.55}.set-list{margin-top:16px}.set{display:grid;grid-template-columns:42px 1fr 1fr 42px;gap:7px;align-items:center;margin-top:7px}.set-label{font-size:10px;color:#777;font-weight:900;text-align:center}.input{width:100%;height:42px;border:1px solid #303030;border-radius:10px;background:#0e0e0e;color:#fff;text-align:center;font-size:14px;font-weight:900;outline:none}.input:focus{border-color:#777}.set.done .input{background:#202020;border-color:#555;color:#bbb}.done-mark{height:42px;border:1px solid #303030;border-radius:10px;background:#171717;color:#777;font-size:16px}.set.done .done-mark{background:#fff;color:#000;border-color:#fff}.actions{display:flex;gap:8px;margin-top:15px}.btn{flex:1;min-height:46px;border-radius:11px;border:1px solid #333;background:#191919;color:#fff;font-size:11px;font-weight:900}.btn.primary{background:#fff;color:#000;border-color:#fff}.btn:disabled{opacity:.35}.rest{display:none;text-align:center;padding:15px 10px;border:1px solid #292929;border-radius:12px;background:#101010;margin-top:10px}.rest.show{display:block}.rest strong{font-size:22px}.rest small{display:block;color:#777;font-size:9px;margin-top:3px}.bottom{margin-top:14px}.finish{width:100%;min-height:46px;border:1px solid #333;border-radius:11px;background:#151515;color:#fff;font-size:11px;font-weight:900}.summary{display:none}.summary.show{display:block}.summary .big{font-size:32px;font-weight:900;margin:5px 0 16px}.summary-actions{display:flex;gap:8px}.summary-actions a{flex:1;text-align:center;text-decoration:none;padding:13px 10px;border-radius:11px;font-size:11px;font-weight:900}.back{background:#191919;color:#fff;border:1px solid #333}.progress-link{background:#fff;color:#000}.fiche{margin-top:10px;width:100%;height:74vh;border:1px solid #333;border-radius:16px;background:#111;display:none}@media(min-width:651px){body{padding-top:18px}.wrap{padding-bottom:50px}.top{border:1px solid #292929;border-radius:14px;margin:0 0 14px;padding:13px 15px}.fiche{height:650px}}</style></head><body><main class="wrap"><header class="top"><div><div class="k">SÉANCE EN COURS</div><h1 id="programName">Chargement…</h1><div id="sessionName" class="session-name"></div></div><div id="timer" class="timer">00:00</div></header><div class="progress"><i id="progressBar"></i></div><section id="app"></section><section id="summary" class="exercise-card summary"></section></main><script>const SUPA='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB';const HISTORY_KEY='hs_workout_history_v1',ACTIVE_KEY='hs_active_workout';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p){const r=await fetch(SUPA+'/rest/v1/'+p,{headers:{apikey:KEY,Authorization:'Bearer '+KEY,Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}const params=new URLSearchParams(location.search);const programId=params.get('program'),sessionId=params.get('session');let program=null,session=null,items=[],current=0,startedAt=null,workoutSets=[];function readActive(){try{return JSON.parse(localStorage.getItem(ACTIVE_KEY)||'null')}catch{return null}}function saveActive(){localStorage.setItem(ACTIVE_KEY,JSON.stringify({program_id:programId,session_id:sessionId,program_name:program?.name||'',session_name:session?.name||'',startedAt,exercise_index:current,sets:workoutSets}))}function formatTime(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function startTimer(){setInterval(()=>{if(!startedAt)return;document.getElementById('timer').textContent=formatTime(Math.max(0,Math.floor((Date.now()-new Date(startedAt).getTime())/1000)))},1000)}function firstValue(item){const done=workoutSets[current]?.sets||[];return done[0]||{load:item.load||'',reps:item.reps||''}}function render(){if(!items.length)return;const item=items[current],state=workoutSets[current]||{sets:[]},first=firstValue(item),total=Number(item.sets)||1;document.getElementById('progressBar').style.width=((current+1)/items.length*100)+'%';document.getElementById('app').innerHTML='<section class="exercise-card"><div class="exercise-top"><div><div class="exercise-num">EXERCICE '+String(current+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0')+'</div><div class="exercise-name">'+esc(item.name)+'</div><div class="prescription">'+esc((item.sets&&item.reps)?item.sets+' × '+item.reps:'')+(item.rest?' · Repos '+esc(item.rest):'')+(item.tempo?' · Tempo '+esc(item.tempo):'')+(item.load?' · Charge prévue '+esc(item.load):'')+'</div></div></div><div class="set-list">'+Array.from({length:total},(_,i)=>{const v=state.sets[i]||{load:first.load||'',reps:first.reps||''},done=!!state.sets[i]?.done;return '<div class="set '+(done?'done':'')+'" data-set="'+i+'"><div class="set-label">S'+(i+1)+'</div><input class="input load" type="number" inputmode="decimal" placeholder="kg" value="'+esc(v.load)+'" '+(done?'disabled':'')+'><input class="input reps" type="number" inputmode="numeric" placeholder="reps" value="'+esc(v.reps)+'" '+(done?'disabled':'')+'><button class="done-mark" onclick="validateSet('+i+')">'+(done?'✓':'○')+'</button></div>'}).join('')+'</div><div class="actions"><button class="btn" onclick="openFiche('+JSON.stringify(item.exercise_id)+')">Fiche exercice</button><button class="btn primary" onclick="validateCurrent()">Valider ma série</button></div><div id="rest" class="rest"><strong id="restTime">'+esc(item.rest||'')+'</strong><small>Repos conseillé</small></div></section><div class="bottom"><button class="finish" onclick="finishWorkout()">Terminer la séance</button></div><iframe id="fiche" class="fiche" title="Fiche exercice"></iframe>';applyDefaults();}function applyDefaults(){const state=workoutSets[current]||{sets:[]};const first=state.sets[0];if(!first)return;document.querySelectorAll('.set').forEach((row,i)=>{if(state.sets[i])return;row.querySelector('.load').value=first.load??'';row.querySelector('.reps').value=first.reps??''})}function validateSet(i){const rows=[...document.querySelectorAll('.set')],row=rows[i];if(!row)return;const load=row.querySelector('.load').value,reps=row.querySelector('.reps').value;if(!load&&!reps){row.querySelector('.load').focus();return}workoutSets[current]??={sets:[]};workoutSets[current].sets[i]={load:load,reps:reps,done:true};if(i===0){rows.forEach((r,n)=>{if(n>0&&!workoutSets[current].sets[n]){r.querySelector('.load').value=load;r.querySelector('.reps').value=reps}})}saveActive();render();}function validateCurrent(){const rows=[...document.querySelectorAll('.set')],next=workoutSets[current]?.sets?.findIndex(x=>!x?.done);validateSet(next>=0?next:0)}function nextExercise(){if(current<items.length-1){current++;saveActive();render();window.scrollTo({top:0,behavior:'smooth'})}else finishWorkout()}function openFiche(id){const f=document.getElementById('fiche');f.src='fiche.html?id='+encodeURIComponent(id);f.style.display='block';f.scrollIntoView({behavior:'smooth',block:'start'})}function finishWorkout(){const valid=workoutSets.some(e=>(e.sets||[]).some(s=>s&&s.done));if(!valid)return;const duration=Math.max(1,Math.round((Date.now()-new Date(startedAt).getTime())/60000));let history=[];try{history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch{};history.unshift({date:new Date().toISOString(),program_name:program?.name||'',session_name:session?.name||'',duration_minutes:duration,exercises:items.map((e,i)=>({exercise_id:e.exercise_id,name:e.name,sets:(workoutSets[i]?.sets||[]).filter(s=>s?.done).map(s=>({load:Number(s.load)||0,reps:Number(s.reps)||0}))}))});localStorage.setItem(HISTORY_KEY,JSON.stringify(history));localStorage.removeItem(ACTIVE_KEY);document.getElementById('app').style.display='none';const sum=document.getElementById('summary');sum.classList.add('show');sum.innerHTML='<div class="k">SÉANCE TERMINÉE</div><div class="big">Bien joué 💪</div><div class="prescription">'+duration+' min · '+esc(session?.name||'Séance')+'</div><div class="summary-actions" style="margin-top:16px"><a class="progress-link" href="progression-simple.html?program='+encodeURIComponent(program?.name||'')+'">Voir ma progression →</a><a class="back" href="programmes.html">Retour au programme</a></div>'}async function load(){try{if(!programId||!sessionId)throw Error('missing');[program]=await api('programs?select=id,name,objective,description&id=eq.'+encodeURIComponent(programId));[session]=await api('program_sessions?select=id,name,notes,position&id=eq.'+encodeURIComponent(sessionId));const rows=await api('program_exercises?select=exercise_id,position,sets,reps,rest,tempo,load,duration,notes&session_id=eq.'+encodeURIComponent(sessionId)+'&order=position.asc');const ids=[...new Set(rows.map(r=>r.exercise_id))],names=ids.length?Object.fromEntries((await api('exercises?select=id,name_fr&id=in.('+ids.join(',')+')')).map(x=>[x.id,x.name_fr])):{};items=rows.map(r=>({...r,name:names[r.exercise_id]||'Exercice'}));const active=readActive();startedAt=active&&active.program_id==programId&&active.session_id==sessionId?active.startedAt:new Date().toISOString();workoutSets=active?.sets||items.map(()=>({sets:[]}));current=Math.min(Number(active?.exercise_index||0),Math.max(0,items.length-1));document.getElementById('programName').textContent=program?.name||'Programme';document.getElementById('sessionName').textContent=session?.name||'Séance';saveActive();render();startTimer()}catch(e){document.getElementById('app').innerHTML='<section class="exercise-card">Impossible de charger cette séance.</section>'}}load();</script></body></html>
