name: Level 2 premium history
on:
  push:
    paths:
      - '.github/workflows/level2-premium.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add premium history view
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('programmes.html')
          s=p.read_text()
          fn=r'''\nfunction renderHistoryPremium(filter='all'){
  const h=readWorkoutHistory(),el=document.getElementById('historyContent');
  if(!h.length){el.innerHTML='<div class="history-empty"><strong>Pas encore de progression</strong>Termine ta première séance pour commencer à suivre tes performances.</div>';return}
  const visible=filter==='program'?h.filter(s=>String(s.program_id)===String(activeProgram?.id)):h;
  const latest={},prev={};
  h.forEach(s=>(s.exercises||[]).forEach(e=>{const u=(e.sets||[]).filter(x=>x.load!==''||x.reps!=='');if(!u.length)return;if(!latest[e.exercise_id])latest[e.exercise_id]={...e};else if(!prev[e.exercise_id])prev[e.exercise_id]={...e}}));
  const top=e=>{const a=(e.sets||[]).map(x=>Number(x.load)).filter(Boolean);return a.length?Math.max(...a):0};
  const perf=e=>(e.sets||[]).filter(x=>x.load!==''||x.reps!=='').map(x=>esc((x.load||'—')+' kg × '+(x.reps||'—'))).join(' · ');
  const cards=visible.slice(0,8).map(s=>'<article class="history-card"><div class="history-card-head"><div><div class="history-date">'+new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})+'</div><div class="history-program">'+esc(s.program_name)+'</div></div><div class="history-duration">'+s.duration_minutes+' min</div></div><div class="history-meta">'+esc(s.session_name)+' · '+(s.exercises||[]).length+' exercices</div>'+(s.exercises||[]).filter(e=>(e.sets||[]).length).slice(0,5).map(e=>'<div class="history-exercise"><span><strong>'+esc(e.name)+'</strong></span><span>'+perf(e)+'</span></div>').join('')+'</article>').join('');
  const best=Object.values(latest).slice(0,8).map(e=>{const d=top(e)-(prev[e.exercise_id]?top(prev[e.exercise_id]):0);const c=d>0?'up':d<0?'down':'';const t=d>0?'↑ +'+d+' kg depuis la dernière séance':d<0?'↓ '+Math.abs(d)+' kg depuis la dernière séance':'Première performance enregistrée';return '<div class="history-best"><strong>'+esc(e.name)+'</strong><span>'+perf(e)+'</span><small class="history-compare '+c+'">'+t+'</small></div>'}).join('');
  el.innerHTML='<div class="history-toolbar"><button class="history-filter '+(filter==='all'?'active':'')+'" onclick="renderHistoryPremium(\'all\')">Toutes</button><button class="history-filter '+(filter==='program'?'active':'')+'" onclick="renderHistoryPremium(\'program\')">Ce programme</button></div><div class="history-section-title">Séances récentes</div>'+(cards||'<div class="history-empty">Aucune séance pour ce programme.</div>')+(best?'<div class="history-section-title">Progression</div>'+best:'')+'<div class="history-note">Historique conservé sur cet appareil. Les prescriptions du coach restent distinctes de tes performances réelles.</div>';
}
'''
          if 'function renderHistoryPremium' not in s:
            i=s.rfind('</script>')
            if i<0: raise SystemExit('script tag not found')
            s=s[:i]+fn+s[i:]
          s=s.replace("function openHistory(){\n  renderHistory();","function openHistory(){\n  renderHistoryPremium();")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programmes.html
          git diff --cached --quiet && exit 0
          git commit -m 'Polish Level 2 history experience'
          git push
