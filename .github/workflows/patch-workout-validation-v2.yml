name: patch-workout-validation-v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply workout validation behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('programmes.html')
          s=p.read_text()
          old="function validateSet(i){const v=workoutState.values[workoutState.exerciseIndex][i];v.done=true;renderWorkout();if(workoutState.session.items[workoutState.exerciseIndex].rest)startRest(workoutState.session.items[workoutState.exerciseIndex].rest)}"
          new="function validateSet(i){const st=workoutState;if(!st)return;const key=st.exerciseIndex;const rows=st.values[key]||[];const v=rows[i];if(!v)return;if(i===0){rows.forEach((r,idx)=>{if(idx>0){r.load=v.load;r.reps=v.reps}})}v.done=true;renderWorkout();if(st.session.items[st.exerciseIndex].rest)startRest(st.session.items[st.exerciseIndex].rest)}"
          if old not in s: raise SystemExit('validateSet not found')
          s=s.replace(old,new,1)
          old2="function validateAllSets(){workoutState.values[workoutState.exerciseIndex].forEach(v=>v.done=true);renderWorkout()}"
          new2="function validateAllSets(){const st=workoutState;if(!st)return;const rows=st.values[st.exerciseIndex]||[];const first=rows[0]||{};if(first.load!==''||first.reps!==''){rows.forEach(v=>{v.load=first.load;v.reps=first.reps;v.done=true})}else{rows.forEach(v=>v.done=true)}renderWorkout();const rest=st.session.items[st.exerciseIndex].rest;if(rest)startRest(rest)}"
          if old2 not in s: raise SystemExit('validateAllSets not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programmes.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: use first set for workout exercise"
          git push