name: Fix workout summary
on:
  push:
    paths:
      - '.github/workflows/fix-summary.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch programmes.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('programmes.html')
          s=p.read_text()
          old="function finishWorkout(){workoutState=null;clearInterval(restTimer);document.getElementById('workoutOverlay').hidden=true;document.body.style.overflow='hidden';showWorkoutSummary()}"
          new="function finishWorkout(){clearInterval(restTimer);document.getElementById('workoutOverlay').hidden=true;document.body.style.overflow='hidden';showWorkoutSummary()}"
          if old not in s:
              raise SystemExit('target finishWorkout not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programmes.html
          git commit -m 'Fix workout summary display'
          git push
