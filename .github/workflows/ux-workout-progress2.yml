name: UX workout progression 2
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('programmes.html')
          s=p.read_text()
          old='.workout-progress{height:4px;background:#202020;border-radius:99px;overflow:hidden;margin-bottom:10px}.workout-progress span{display:block;height:100%;background:#fff;width:0;transition:width .3s}.workout-feedback{height:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900;letter-spacing:.5px;opacity:0;transform:translateY(-3px);transition:opacity .2s,transform .2s;margin-bottom:8px}'
          new='.workout-progress{height:4px;background:#202020;border-radius:99px;overflow:hidden;margin-bottom:6px}.workout-progress span{display:block;height:100%;background:#fff;width:0;transition:width .3s}.workout-progress-label{display:flex;justify-content:space-between;color:#666;font-size:9px;font-weight:800;margin-bottom:10px}.workout-progress-label strong{color:#aaa}.workout-feedback{height:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900;letter-spacing:.5px;opacity:0;transform:translateY(-3px);transition:opacity .2s,transform .2s;margin-bottom:8px}'
          if old not in s: raise SystemExit('css target missing')
          s=s.replace(old,new,1)
          old='<div class="workout-progress"><span id="workoutProgress"></span></div><div id="workoutFeedback" class="workout-feedback" aria-live="polite"></div><div id="workoutContent"></div>'
          new='<div class="workout-progress"><span id="workoutProgress"></span></div><div class="workout-progress-label"><span>PROGRESSION</span><strong id="workoutProgressLabel">Exercice 1 / 1</strong></div><div id="workoutFeedback" class="workout-feedback" aria-live="polite"></div><div id="workoutContent"></div>'
          if old not in s: raise SystemExit('markup target missing')
          s=s.replace(old,new,1)
          old="const validated=st.session.items.reduce((n,_,i)=>n+(i<st.exerciseIndex?1:0),0);const progress=Math.min(100,(validated/Math.max(total,1))*100);document.getElementById('workoutProgress').style.width=progress+'%';"
          new="const validated=st.exerciseIndex;const progress=Math.min(100,(validated/Math.max(total,1))*100);document.getElementById('workoutProgress').style.width=progress+'%';const progressLabel=document.getElementById('workoutProgressLabel');if(progressLabel)progressLabel.textContent='Exercice '+Math.min(st.exerciseIndex+1,total)+' / '+total;"
          if old not in s: raise SystemExit('render target missing')
          s=s.replace(old,new,1)
          old="if(st.exerciseIndex<st.session.items.length-1){nextExercise(true)}else{document.getElementById('workoutProgress').style.width='100%';finishWorkout()}"
          new="if(st.exerciseIndex<st.session.items.length-1){nextExercise(true)}else{document.getElementById('workoutProgress').style.width='100%';const progressLabel=document.getElementById('workoutProgressLabel');if(progressLabel)progressLabel.textContent='Séance terminée ✓';finishWorkout()}"
          if old not in s: raise SystemExit('advance target missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add programmes.html
          git diff --cached --quiet || git commit -m "Clarify workout progression"
          git push
