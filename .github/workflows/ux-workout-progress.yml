name: UX workout progress
on:
  push:
    paths:
      - '.github/workflows/ux-workout-progress.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch programmes page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('programmes.html')
          s=p.read_text()
          old='''.workout-progress{height:4px;background:#202020;border-radius:99px;overflow:hidden;margin-bottom:18px}.workout-progress span{display:block;height:100%;background:#fff;width:0;transition:width .25s}'''
          new='''.workout-progress{height:4px;background:#202020;border-radius:99px;overflow:hidden;margin-bottom:10px}.workout-progress span{display:block;height:100%;background:#fff;width:0;transition:width .3s}.workout-feedback{height:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900;letter-spacing:.5px;opacity:0;transform:translateY(-3px);transition:opacity .2s,transform .2s;margin-bottom:8px}.workout-feedback.show{opacity:1;transform:translateY(0)}'''
          if old not in s: raise SystemExit('CSS target not found')
          s=s.replace(old,new,1)
          old='<div class="workout-progress"><span id="workoutProgress"></span></div><div id="workoutContent"></div>'
          new='<div class="workout-progress"><span id="workoutProgress"></span></div><div id="workoutFeedback" class="workout-feedback" aria-live="polite"></div><div id="workoutContent"></div>'
          if old not in s: raise SystemExit('markup target not found')
          s=s.replace(old,new,1)
          old='''function renderWorkout(){
  const st=workoutState;
  if(!st)return;
  const r=st.session.items[st.exerciseIndex],
        total=st.session.items.length,
        id=r.exercise_id,
        name=st.session.names[id]||'Exercice';
  document.getElementById('workoutTitle').textContent=name;
  document.getElementById('workoutProgress').style.width=((st.exerciseIndex+1)/Math.max(total,1)*100)+'%';'''
          new='''function renderWorkout(){
  const st=workoutState;
  if(!st)return;
  const r=st.session.items[st.exerciseIndex],
        total=st.session.items.length,
        id=r.exercise_id,
        name=st.session.names[id]||'Exercice';
  document.getElementById('workoutTitle').textContent=name;
  const validated=st.session.items.reduce((n,_,i)=>n+(i<st.exerciseIndex?1:0),0);
  const progress=Math.min(100,(validated/Math.max(total,1))*100);
  document.getElementById('workoutProgress').style.width=progress+'%';'''
          if old not in s: raise SystemExit('render target not found')
          s=s.replace(old,new,1)
          old='''  setTimeout(()=>{
    if(!workoutState||workoutState!==st)return;
    if(st.exerciseIndex<st.session.items.length-1){
      nextExercise(true)
    }else{
      finishWorkout()
    }
  },450)'''
          new='''  const feedback=document.getElementById('workoutFeedback');
  if(feedback){
    feedback.textContent='✓ Exercice validé';
    feedback.classList.add('show');
  }
  setTimeout(()=>{
    if(!workoutState||workoutState!==st)return;
    if(feedback)feedback.classList.remove('show');
    if(st.exerciseIndex<st.session.items.length-1){
      nextExercise(true)
    }else{
      document.getElementById('workoutProgress').style.width='100%';
      finishWorkout()
    }
  },700)'''
          if old not in s: raise SystemExit('advance target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programmes.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve workout progress feedback"
          git push
