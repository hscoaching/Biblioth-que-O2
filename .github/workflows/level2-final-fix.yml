name: Final Level 2 fix
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair evolution JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('programmes.html'); s=p.read_text()
          good="const delta=first?Math.round(((last-first)/first)*100):0; const previous=rows.length>1?rows[rows.length-2].load:null; const vsPrevious=previous!==null?last-previous:null;"
          s,n=re.subn(r"const delta=first\?Math\.round\(\(\(last-first\)/first\)\*100\):0;.*?const previous=rows\.length>1\?rows\[rows\.length-2\]\.load:null;",good,s,count=1)
          old=re.compile(r"el\.innerHTML='<div class=\\\"history-evolution-head\\\">.*?</div>'\+'<div class=\\\"history-evolution-stats\\\">.*?</div>'",re.S)
          new="el.innerHTML='<div class=\\\"history-evolution-head\\\"><div><div class=\\\"history-evolution-title\\\">Évolution de ta charge</div><div class=\\\"history-evolution-sub\\\">'+esc(name)+' · suivi séance après séance</div></div><div class=\\\"history-evolution-value\\\">'+last+' kg</div></div>'+'<div class=\\\"history-evolution-stats\\\"><div class=\\\"history-evolution-stat\\\"><span>Dernière charge</span><strong>'+last+' kg</strong></div><div class=\\\"history-evolution-stat\\\"><span>Vs séance précédente</span><strong>'+(vsPrevious===null?'—':(vsPrevious>0?'+':'')+vsPrevious+' kg')+'</strong></div></div>'"
          s,m=old.subn(new,s,count=1)
          if '.history-evolution-stats{' not in s:
            css='''<style>.history-evolution-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.history-evolution-stat{background:#151515;border:1px solid #292929;border-radius:10px;padding:9px}.history-evolution-stat span{display:block;color:#666;font-size:8px;text-transform:uppercase;letter-spacing:.8px}.history-evolution-stat strong{display:block;margin-top:4px;font-size:12px}@media(max-width:650px){.history-evolution-stat strong{font-size:11px}}</style>'''
            s=s.replace('</style>',css+'</style>',1)
          p.write_text(s)
          print('delta replacement',n,'stats replacement',m)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programmes.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize Level 2 evolution UI'
          git push origin main
