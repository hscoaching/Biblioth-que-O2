name: Optimize Level 2 progression UX
on:
  push:
    paths:
      - '.github/workflows/optimize-level2.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('programmes.html')
          s=p.read_text()
          css='''\n.history-toolbar{display:flex;gap:8px;margin:0 0 14px}.history-filter{border:1px solid #292929;background:#101010;color:#999;border-radius:10px;padding:9px 11px;font-size:10px;font-weight:800}.history-filter.active{background:#fff;color:#000}.history-card{transition:border-color .18s,transform .18s}.history-card:active{transform:scale(.995)}.history-card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.history-duration{font-size:9px;color:#777;white-space:nowrap}.history-compare{font-size:9px;margin-top:7px;color:#777}.history-compare.up{color:#fff}.history-compare.down{color:#aaa}.history-best{position:relative}.history-best small{display:block;color:#666;font-size:8px;margin-top:3px}.history-empty strong{display:block;color:#aaa;font-size:13px;margin-bottom:6px}.history-note{border-top:1px solid #222;padding-top:12px}\n@media(max-width:650px){.history-toolbar{position:sticky;top:-19px;z-index:2;padding:4px 0 8px;background:#151515}.history-filter{flex:1}.history-card{padding:12px}.history-exercise{gap:8px}.history-exercise span:last-child{max-width:58%;line-height:1.35}}\n'''
          i=s.find('</style>')
          if i>=0 and '.history-toolbar{' not in s:
              s=s[:i]+css+s[i:]
          old="function finishWorkout(){\n  clearInterval(restTimer);\n  saveWorkoutHistory();"
          new="function finishWorkout(){\n  clearInterval(restTimer);\n  if(!workoutState) return;\n  saveWorkoutHistory();"
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programmes.html
          git diff --cached --quiet && exit 0
          git commit -m 'Polish Level 2 progression UX'
          git push
