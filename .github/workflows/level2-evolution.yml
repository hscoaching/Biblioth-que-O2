name: Level 2 evolution view
on:
  push:
    paths:
      - '.github/workflows/level2-evolution.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch programmes.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('programmes.html')
          s=p.read_text()
          css='''<style>
          .history-evolution{margin-top:12px;background:#101010;border:1px solid #292929;border-radius:14px;padding:14px}
          .history-evolution-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
          .history-evolution-title{font-size:12px;font-weight:900}
          .history-evolution-sub{font-size:9px;color:#666;margin-top:3px}
          .history-evolution-value{font-size:16px;font-weight:900}
          .history-evolution-chart{display:flex;align-items:flex-end;gap:5px;height:92px;margin-top:16px;padding-top:8px;border-bottom:1px solid #252525}
          .history-bar{flex:1;min-width:8px;background:#777;border-radius:4px 4px 0 0;position:relative;opacity:.8}
          .history-bar:last-child{background:#fff;opacity:1}
          .history-bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:8px;color:#888;white-space:nowrap;margin-bottom:4px}
          .history-evolution-legend{display:flex;justify-content:space-between;margin-top:7px;font-size:8px;color:#666}
          .history-progress-up{font-size:9px;color:#aaa;margin-top:9px}
          .history-progress-up strong{color:#fff}
          .history-select{width:100%;margin-top:10px;border:1px solid #292929;background:#171717;color:#fff;border-radius:9px;padding:9px;font-size:10px}
          </style>'''
          if '.history-evolution{' not in s:
            s=s.replace('</style>',css+'</style>',1)
          fn=r'''function renderExerciseEvolution(){
            const h=readWorkoutHistory(),el=document.getElementById('historyEvolution');
            if(!el)return;
            const all=[];
            h.forEach(session=>(session.exercises||[]).forEach(e=>(e.sets||[]).forEach(x=>{const load=Number(x.load);if(load>0)all.push({id:String(e.exercise_id),name:e.name||'Exercice',load,date:session.date})})));
            const ids=[...new Set(all.map(x=>x.id))];
            if(!ids.length){el.innerHTML='';return}
            const id=el.dataset.exercise||ids[0];
            const rows=all.filter(x=>x.id===id).slice(0,8).reverse();
            const name=rows[0]?.name||'Exercice', max=Math.max(...rows.map(x=>x.load),1), first=rows[0]?.load||0, last=rows.at(-1)?.load||0;
            const delta=first?Math.round(((last-first)/first)*100):0;
            el.innerHTML='<div class="history-evolution-head"><div><div class="history-evolution-title">Évolution de la charge</div><div class="history-evolution-sub">'+esc(name)+' · meilleures charges par séance</div></div><div class="history-evolution-value">'+last+' kg</div></div><select class="history-select" onchange="document.getElementById(\'historyEvolution\').dataset.exercise=this.value;renderExerciseEvolution()">'+ids.map(x=>{const r=all.find(a=>a.id===x);return '<option value="'+esc(x)+'" '+(x===id?'selected':'')+'>'+esc(r.name)+'</option>'}).join('')+'</select><div class="history-evolution-chart">'+rows.map(x=>'<div class="history-bar" style="height:'+Math.max(8,Math.round((x.load/max)*72))+'px"><span>'+x.load+' kg</span></div>').join('')+'</div><div class="history-evolution-legend"><span>'+new Date(rows[0].date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+'</span><span>'+new Date(rows.at(-1).date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+'</span></div><div class="history-progress-up">'+(delta>0?'↑ Progression de <strong>+'+delta+'%</strong> depuis la première séance':delta<0?'↓ <strong>'+Math.abs(delta)+'%</strong> depuis la première séance':'Pas encore assez de séances pour mesurer une évolution')+'</div>';
          }
          '''
          if 'function renderExerciseEvolution' not in s:
            i=s.rfind('</script>')
            s=s[:i]+fn+s[i:]
          marker='<div id="historyEvolution" class="history-evolution"></div>'
          if marker not in s:
            s=s.replace('<div class="history-toolbar"',marker+'<div class="history-toolbar"',1)
          if 'renderExerciseEvolution();' not in s:
            s=s.replace('renderHistoryPremium();\n  document.getElementById(\'historyOverlay\').hidden=false;', 'renderHistoryPremium();\n  renderExerciseEvolution();\n  document.getElementById(\'historyOverlay\').hidden=false;',1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programmes.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add Level 2 exercise evolution view'
          git push
