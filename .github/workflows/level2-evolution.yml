name: Level 2 evolution UX
on:
  push:
    paths:
      - '.github/workflows/level2-evolution.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch evolution view
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('programmes.html'); s=p.read_text()
          css='''.evolution-grid{display:grid;gap:9px}.evolution-card{background:#101010;border:1px solid #292929;border-radius:14px;padding:13px}.evolution-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.evolution-name{font-size:11px;font-weight:900}.evolution-best{font-size:11px;font-weight:900}.evolution-sub{font-size:9px;color:#666;margin-top:3px}.evolution-chart{height:42px;display:flex;align-items:end;gap:5px;margin-top:12px;padding-bottom:2px}.evolution-bar{flex:1;min-width:5px;background:#555;border-radius:4px 4px 2px 2px}.evolution-bar.last{background:#fff}.evolution-labels{display:flex;justify-content:space-between;color:#555;font-size:7px;margin-top:3px}.evolution-delta{font-size:8px;color:#777;margin-top:8px}.evolution-delta.up{color:#fff}.evolution-delta.down{color:#aaa}@media(max-width:650px){.evolution-card{padding:12px}.evolution-chart{height:38px}}'''
          if '.evolution-grid' not in s: s=s.replace('</style>',css+'</style>',1)
          fn=r'''\nfunction renderHistoryPremium(filter='all'){
  const h=readWorkoutHistory(),el=document.getElementById('historyContent');
  if(!h.length){el.innerHTML='<div class="history-empty"><strong>Pas encore de progression</strong>Termine ta première séance pour commencer à suivre tes performances.</div>';return}
  const visible=filter==='program'&&activeProgram?h.filter(x=>String(x.program_id||'')===String(activeProgram.id)):h;
  const sessions=visible.length?visible:h,byEx={};
  sessions.forEach(s=>(s.exercises||[]).forEach(e=>{const u=(e.sets||[]).filter(x=>x.load!==''||x.reps!=='');const loads=u.map(x=>Number(x.load)).filter(Number.isFinite).filter(x=>x>0);if(loads.length)(byEx[e.exercise_id]??=[]).push({date:s.date,max:Math.max(...loads)})}));
  const evolution=Object.entries(byEx).map(([id,a])=>{a.sort((x,y)=>new Date(x.date)-new Date(y.date));const p=a.slice(-8),first=p[0].max,last=p.at(-1).max,d=last-first,name=(sessions.flatMap(s=>s.exercises||[]).find(e=>String(e.exercise_id)===String(id))||{}).name||'Exercice',m=Math.max(...p.map(x=>x.max),1),bars=p.map((x,i)=>'<span class="evolution-bar '+(i===p.length-1?'last':'')+'" style="height:'+Math.max(10,Math.round(x.max/m*100))+'%" title="'+x.max+' kg"></span>').join(''),txt=d>0?'↑ +'+d+' kg depuis la première séance':d<0?'↓ '+Math.abs(d)+' kg depuis la première séance':'→ Charge stable';return '<article class="evolution-card"><div class="evolution-head"><div><div class="evolution-name">'+esc(name)+'</div><div class="evolution-sub">'+p.length+' performance'+(p.length>1?'s':'')+'</div></div><div class="evolution-best">'+last+' kg</div></div><div class="evolution-chart">'+bars+'</div><div class="evolution-labels"><span>'+new Date(p[0].date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+'</span><span>'+new Date(p.at(-1).date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+'</span></div><div class="evolution-delta '+(d>0?'up':d<0?'down':'')+'">'+txt+'</div></article>'}).join('');
  const cards=sessions.slice(0,8).map(s=>'<article class="history-card"><div class="history-card-head"><div><div class="history-date">'+new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})+'</div><div class="history-program">'+esc(s.program_name)+'</div></div><div class="history-duration">'+s.duration_minutes+' min</div></div><div class="history-meta">'+esc(s.session_name)+' · '+(s.exercises||[]).length+' exercices</div>'+(s.exercises||[]).filter(e=>(e.sets||[]).length).slice(0,5).map(e=>'<div class="history-exercise"><span><strong>'+esc(e.name)+'</strong></span><span>'+e.sets.map(x=>esc((x.load||'—')+' kg × '+(x.reps||'—'))).join(' · ')+'</span></div>').join('')+'</article>').join('');
  el.innerHTML='<div class="history-toolbar"><button class="history-filter '+(filter==='all'?'active':'')+'" onclick="renderHistoryPremium(\'all\')">Toutes</button><button class="history-filter '+(filter==='program'?'active':'')+'" onclick="renderHistoryPremium(\'program\')">Ce programme</button></div><div class="history-section-title">Évolution des charges</div>'+(evolution?'<div class="evolution-grid">'+evolution+'</div>':'<div class="history-empty">Renseigne une charge pour voir ton évolution.</div>')+'<div class="history-section-title">Séances récentes</div>'+(cards||'<div class="history-empty">Aucune séance pour ce programme.</div>')+'<div class="history-note">Les charges affichées sont tes performances réelles. Les prescriptions du coach restent distinctes.</div>';
}
'''
          if 'function renderHistoryPremium(' not in s:
            i=s.rfind('</script>'); s=s[:i]+fn+s[i:]
          s=s.replace('function openHistory(){renderHistory();','function openHistory(){renderHistoryPremium();')
          s=s.replace("program_name:activeProgram?.name||'Programme',session_name:session.name||'Séance',duration_minutes","program_id:activeProgram?.id||null,program_name:activeProgram?.name||'Programme',session_id:session.id,session_name:session.name||'Séance',duration_minutes")
          s=s.replace('Les données saisies restent sur cet appareil pendant cette séance. La sauvegarde historique viendra plus tard.','Tes performances sont enregistrées sur cet appareil pour suivre ta progression.')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programmes.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add Level 2 performance evolution view'
          git push
