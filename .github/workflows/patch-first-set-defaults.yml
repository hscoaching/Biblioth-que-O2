name: patch-first-set-defaults
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch workout validation behavior
        shell: python
        run: |
          from pathlib import Path
          p=Path('programmes.html')
          s=p.read_text()
          old="""function validateSet(i){const st=workoutState;if(!st)return;const ex=st.session.items[st.index],key=String(ex.exercise_id??ex.id);const v=st.values[key]?.[i];if(!v)return;v.done=true;startRest(ex.rest);renderWorkout()}"""
          new="""function validateSet(i){const st=workoutState;if(!st)return;const ex=st.session.items[st.index],key=String(ex.exercise_id??ex.id);const rows=st.values[key]||[];const v=rows[i];if(!v)return;if(i===0){rows.forEach((r,idx)=>{if(idx>0){r.load=v.load;r.reps=v.reps}})}v.done=true;startRest(ex.rest);renderWorkout()}"""
          if old not in s:
            raise SystemExit('validateSet pattern not found')
          s=s.replace(old,new,1)
          old2="""function validateAllSets(){const st=workoutState;if(!st)return;const ex=st.session.items[st.index],key=String(ex.exercise_id??ex.id);(st.values[key]||[]).forEach(v=>v.done=true);startRest(ex.rest);renderWorkout()}"""
          new2="""function validateAllSets(){const st=workoutState;if(!st)return;const ex=st.session.items[st.index],key=String(ex.exercise_id??ex.id);const rows=st.values[key]||[];const first=rows[0]||{};if(first.load!==''||first.reps!==''){rows.forEach(v=>{v.load=first.load;v.reps=first.reps;v.done=true})}else{rows.forEach(v=>v.done=true)}startRest(ex.rest);renderWorkout()}"""
          if old2 not in s:
            raise SystemExit('validateAllSets pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programmes.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: use first set as workout exercise default"
          git push