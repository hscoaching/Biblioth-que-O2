name: patch-live-flow
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('programmes.html')
          s=p.read_text()
          css_old='.workout-progress{height:4px;background:#202020;border-radius:99px;overflow:hidden;margin-bottom:18px}.workout-progress span{display:block;height:100%;background:#fff;width:0;transition:width .25s}'
          css_new='.workout-progress{height:4px;background:#202020;border-radius:99px;overflow:hidden;margin-bottom:10px}.workout-progress span{display:block;height:100%;background:#fff;width:0;transition:width .3s}.workout-feedback{height:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:900;letter-spacing:.5px;opacity:0;transform:translateY(-3px);transition:opacity .2s,transform .2s;margin-bottom:8px}.workout-feedback.show{opacity:1;transform:translateY(0)}'
          if css_old not in s: raise SystemExit('CSS target not found')
          s=s.replace(css_old,css_new,1)
          mark_old='<div class="workout-progress"><span id="workoutProgress"></span></div><div id="workoutContent"></div>'
          mark_new='<div class="workout-progress"><span id="workoutProgress"></span></div><div id="workoutFeedback" class="workout-feedback" aria-live="polite"></div><div id="workoutContent"></div>'
          if mark_old not in s: raise SystemExit('markup target not found')
          s=s.replace(mark_old,mark_new,1)
          render_old="document.getElementById('workoutProgress').style.width=((st.exerciseIndex+1)/Math.max(total,1)*100)+'%';"
          render_new="const validated=st.session.items.reduce((n,_,i)=>n+(i<st.exerciseIndex?1:0),0);const progress=Math.min(100,(validated/Math.max(total,1))*100);document.getElementById('workoutProgress').style.width=progress+'%';"
          if render_old not in s: raise SystemExit('progress target not found')
          s=s.replace(render_old,render_new,1)
          a=s.find('function validateAllSets(){')
          b=s.find('function nextExercise(',a)
          if a<0 or b<0: raise SystemExit('validation targets not found')
          old=s[a:b]
          new="function validateAllSets(){const st=workoutState;if(!st)return;const rows=st.values[st.exerciseIndex]||[];const first=rows[0]||{};if(first.load!==''||first.reps!==''){rows.forEach(v=>{v.load=first.load;v.reps=first.reps;v.done=true})}else{rows.forEach(v=>v.done=true)}renderWorkout();const rest=st.session.items[st.exerciseIndex].rest;if(rest)startRest(rest);const feedback=document.getElementById('workoutFeedback');if(feedback){feedback.textContent='✓ Exercice validé';feedback.classList.add('show')}setTimeout(()=>{if(!workoutState||workoutState!==st)return;if(feedback)feedback.classList.remove('show');if(st.exerciseIndex<st.session.items.length-1){nextExercise(true)}else{document.getElementById('workoutProgress').style.width='100%';finishWorkout()}},700)}"
          s=s[:a]+new+s[b:]
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add programmes.html
          git diff --cached --quiet || git commit -m "Improve workout progress feedback"
          git push
