name: Fix workout summary
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore workout summary transition
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('programmes.html')
          s=p.read_text()
          new="function finishWorkout(){clearInterval(restTimer);saveWorkoutHistory();document.getElementById('workoutOverlay').hidden=true;document.body.style.overflow='hidden';showWorkoutSummary()}"
          s2,n=re.subn(r"function finishWorkout\(\)\{.*?\}",new,s,count=1)
          if n!=1:
              raise SystemExit('finishWorkout function not found')
          p.write_text(s2)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programmes.html
          git commit -m 'Fix workout completion summary' || exit 0
          git rm .github/workflows/fix-workout-summary.yml
          git commit -m 'Remove temporary workout summary workflow'
          git push
# trigger