name: Restore program progress CTA
on:
  push:
    branches: [restore-workout-progress]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CTA
        shell: python
        run: |
          from pathlib import Path
          p=Path('programmes.html'); s=p.read_text()
          css='<style>.program-progress-cta{margin:18px 0 8px;padding:18px;background:linear-gradient(145deg,#171717,#111);border:1px solid #292929;border-radius:16px;text-align:center}.program-progress-cta strong{display:block;font-size:13px}.program-progress-cta span{display:block;color:#777;font-size:10px;margin-top:5px}.program-progress-cta button{margin-top:12px;width:100%;border:0;border-radius:11px;background:#fff;color:#000;padding:13px;font-size:12px;font-weight:900;cursor:pointer;min-height:46px}</style>'
          if 'class="program-progress-cta"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          old="setupSessionObserver();window.__sessionData=rows.map(s=>({id:s.id,items:exRows.filter(r=>String(r.session_id)===String(s.id)),names}))"
          new=old+";se.insertAdjacentHTML('beforeend','<div class=\"program-progress-cta\"><strong>Ta progression</strong><span>Retrouve tes performances et l’évolution de tes charges.</span><button type=\"button\" onclick=\"openHistory()\">Voir ma progression <span>→</span></button></div>')"
          if old not in s: raise SystemExit('render marker not found')
          s=s.replace(old,new,1); p.write_text(s)
      - name: Validate
        run: |
          grep -q 'workoutSummaryOverlay' programmes.html
          grep -q 'function showWorkoutSummary' programmes.html
          grep -q 'Voir ma progression' programmes.html
          grep -q 'program-progress-cta' programmes.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programmes.html
          git commit -m 'Restore program progress CTA' || exit 0
          git push origin HEAD:restore-workout-progress
