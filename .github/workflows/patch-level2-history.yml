name: Patch Level 2 history
on:
  push:
    paths:
      - '.github/workflows/patch-level2-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch programmes.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('programmes.html')
          s=p.read_text()
          old=""".workout-summary-close{width:100%;border:0;border-radius:11px;background:#fff;color:#000;padding:14px;font-size:12px;font-weight:900;cursor:pointer}"""
          new=old+""".workout-summary-history{width:100%;margin-top:9px;border:1px solid #333;border-radius:11px;background:#191919;color:#fff;padding:13px;font-size:12px;font-weight:900;cursor:pointer}.history-overlay{position:fixed;inset:0;z-index:6000;background:rgba(0,0,0,.96);display:grid;place-items:center;padding:14px}.history-overlay[hidden]{display:none}.history-panel{width:min(620px,100%);max-height:92vh;overflow:auto;background:#151515;border:1px solid #333;border-radius:22px;padding:22px 18px}.history-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}.history-kicker{font-size:9px;letter-spacing:1.5px;color:#777;font-weight:900}.history-head h2{margin:6px 0 0;font-size:26px}.history-close{width:38px;height:38px;border-radius:50%;border:1px solid #333;background:#222;color:#fff;font-size:22px}.history-card{background:#101010;border:1px solid #292929;border-radius:14px;padding:14px;margin-bottom:9px}.history-date{font-size:9px;color:#777}.history-program{font-size:14px;font-weight:900;margin-top:5px}.history-meta{font-size:10px;color:#999;margin-top:5px}.history-exercise{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #222;margin-top:10px;font-size:10px}.history-exercise strong{font-size:11px}.history-empty{color:#777;font-size:11px;line-height:1.6;text-align:center;padding:24px 8px}.history-section-title{font-size:9px;letter-spacing:1.3px;color:#777;font-weight:900;margin:18px 0 8px;text-transform:uppercase}.history-best{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#101010;border:1px solid #292929;border-radius:12px;padding:11px}.history-best strong{font-size:11px}.history-best span{font-size:11px;font-weight:900}.history-note{font-size:9px;color:#666;line-height:1.5;margin-top:14px}@media(max-width:650px){.history-panel{border-radius:18px;padding:19px 14px}.history-head h2{font-size:23px}}"""
          if old not in s: raise SystemExit('summary css marker not found')
          s=s.replace(old,new,1)
          old="""let programs=[],activeProgram=null,programScrollTop=0,workoutState=null,restTimer=null,restLeft=0;"""
          new=old+"""
const HISTORY_KEY='hs_workout_history_v1';
function readWorkoutHistory(){try{return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]')}catch(e){return[]}}
function latestExercisePerformance(id){const h=readWorkoutHistory();for(const session of h){const ex=(session.exercises||[]).find(x=>String(x.exercise_id)===String(id));if(ex)return ex}return null}
function saveWorkoutHistory(){const st=workoutState;if(!st)return;const session=st.session;const values=st.values||{};const exercises=session.items.map((r,i)=>{const rows=values[i]||[];const completed=rows.filter(v=>v.done||v.load!==''||v.reps!=='').map((v,n)=>({set:n+1,load:v.load||'',reps:v.reps||''}));return{exercise_id:r.exercise_id,name:session.names[r.exercise_id]||'Exercice',sets:completed}});const item={date:new Date().toISOString(),program_id:activeProgram?.id||null,program_name:activeProgram?.name||'Programme',session_id:session.id,session_name:session.name||'Séance',duration_minutes:Math.max(1,Math.round((Date.now()-(st.startedAt||Date.now()))/60000)),exercises};const h=readWorkoutHistory();h.unshift(item);localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,50)))}
function openHistory(){renderHistory();document.getElementById('historyOverlay').hidden=false;document.body.style.overflow='hidden'}
function closeHistory(){document.getElementById('historyOverlay').hidden=true;if(workoutState||!document.getElementById('programOverlay').hidden)document.body.style.overflow='hidden';else document.body.style.overflow=''}
function renderHistory(){const h=readWorkoutHistory(),el=document.getElementById('historyContent');if(!h.length){el.innerHTML='<div class="history-empty">Aucune séance enregistrée pour le moment.<br>Termine une séance pour commencer à suivre ta progression.</div>';return}const latest={};h.forEach(s=>(s.exercises||[]).forEach(e=>{const usable=(e.sets||[]).filter(x=>x.load!==''||x.reps!=='');if(usable.length&&!latest[e.exercise_id])latest[e.exercise_id]={...e,sessionDate:s.date}}));const best=Object.values(latest).slice(0,8);el.innerHTML='<div class="history-section-title">Dernières séances</div>'+h.slice(0,8).map(s=>'<article class="history-card"><div class="history-date">'+new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})+' · '+s.duration_minutes+' min</div><div class="history-program">'+esc(s.program_name)+'</div><div class="history-meta">'+esc(s.session_name)+' · '+(s.exercises||[]).length+' exercices</div>'+(s.exercises||[]).filter(e=>(e.sets||[]).length).slice(0,5).map(e=>'<div class="history-exercise"><span><strong>'+esc(e.name)+'</strong></span><span>'+e.sets.map(x=>esc((x.load||'—')+' kg × '+(x.reps||'—'))).join(' · ')+'</span></div>').join('')+'</article>').join('')+(best.length?'<div class="history-section-title">Dernières performances</div>'+best.map(e=>'<div class="history-best"><strong>'+esc(e.name)+'</strong><span>'+e.sets.map(x=>esc((x.load||'—')+' kg × '+(x.reps||'—'))).join(' · ')+'</span></div>').join(''):'')+'<div class="history-note">Historique enregistré sur cet appareil. Il sera ensuite relié au compte client pour retrouver les performances sur plusieurs appareils.</div>'}
"""
          if old not in s: raise SystemExit('state marker not found')
          s=s.replace(old,new,1)
          old="""st.values[key]??=Array.from({length:sets},()=>({load:r.load||'',reps:'',done:false}));"""
          new="""st.values[key]??=(()=>{const previous=latestExercisePerformance(id);const seed=previous?.sets?.[0]||{};return Array.from({length:sets},()=>({load:seed.load||r.load||'',reps:seed.reps||'',done:false}))})();"""
          if old not in s: raise SystemExit('render marker not found')
          s=s.replace(old,new,1)
          old="""function finishWorkout(){clearInterval(restTimer);document.getElementById('workoutOverlay').hidden=true;document.body.style.overflow='hidden';showWorkoutSummary()}"""
          new="""function finishWorkout(){clearInterval(restTimer);saveWorkoutHistory();document.getElementById('workoutOverlay').hidden=true;document.body.style.overflow='hidden';showWorkoutSummary()}"""
          if old not in s: raise SystemExit('finish marker not found')
          s=s.replace(old,new,1)
          old="""<button class=\"workout-summary-close\" onclick=\"closeWorkoutSummary()\">Retour au programme</button>"""
          new="""<button class=\"workout-summary-history\" onclick=\"openHistory()\">Voir ma progression</button><button class=\"workout-summary-close\" onclick=\"closeWorkoutSummary()\">Retour au programme</button>"""
          if old not in s: raise SystemExit('summary button marker not found')
          s=s.replace(old,new,1)
          old="""</div></div></div></body></html>\""""
          new="""</div></div></div><div id=\"historyOverlay\" class=\"history-overlay\" hidden onclick=\"if(event.target===this)closeHistory()\"><section class=\"history-panel\"><div class=\"history-head\"><div><div class=\"history-kicker\">SUIVI PERSONNEL</div><h2>Ma progression</h2></div><button class=\"history-close\" onclick=\"closeHistory()\">×</button></div><div id=\"historyContent\"></div></section></div></body></html>\""""
          if old not in s: raise SystemExit('history html marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programmes.html
          git commit -m 'Add Level 2 performance history' || exit 0
          git push
