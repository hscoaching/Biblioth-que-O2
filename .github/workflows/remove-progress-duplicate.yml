name: Remove progression CTA duplicate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate CTA
        shell: python
        run: |
          from pathlib import Path
          p = Path('programmes.html')
          s = p.read_text()
          marker = "se.insertAdjacentHTML('beforeend','<div class=\"program-progress-cta\"><strong>Ta progression</strong><span>Retrouve tes performances et l’évolution de tes charges.</span><button type=\"button\" onclick=\"openHistory()\">Voir ma progression <span>→</span></button></div>')"
          double = marker + marker
          if double not in s:
              raise SystemExit('Expected duplicate CTA not found; aborting')
          s = s.replace(double, marker, 1)
          if s.count('Voir ma progression') < 2:
              raise SystemExit('Validation failed: progression CTA content unexpectedly missing')
          p.write_text(s)
      - name: Validate
        run: |
          test "$(grep -o 'program-progress-cta' programmes.html | wc -l)" -ge 2
          grep -q 'function showWorkoutSummary' programmes.html
          grep -q 'function finishWorkout' programmes.html
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/remove-progress-duplicate.yml
          git add programmes.html .github/workflows/remove-progress-duplicate.yml
          git commit -m 'Remove duplicate progression CTA'
          git push origin HEAD:main
