name: Fix programs JS
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch programmes.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('programmes.html')
          s=p.read_text()
          # Fix the duplicated Level 2 comparison declarations.
          s,n=re.subn(r"const delta=first\?Math\.round\(\(\(last-first\)/first\)\*100\):0; const previous=.*?; const vsPrevious=.*?; const previous=.*?;", "const delta=first?Math.round(((last-first)/first)*100):0; const previous=rows.length>1?rows[rows.length-2].load:null; const vsPrevious=previous!==null?last-previous:null;", s, count=1)
          if n!=1: raise SystemExit('comparison declaration pattern not found')
          # Fix the missing string concatenation before the exercise selector.
          s,n=re.subn(r"</strong></div></div>'<select", "</strong></div></div>'+ '<select", s, count=1)
          if n!=1: raise SystemExit('selector concatenation pattern not found')
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programmes.html
          git commit -m 'Fix programs loading JavaScript' || exit 0
          git push origin HEAD:${{ github.event.pull_request.base.ref }}
