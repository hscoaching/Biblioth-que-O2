name: Fix programs JS
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch programmes.html
        shell: python
        run: |
          from pathlib import Path
          p=Path('programmes.html')
          s=p.read_text()
          old="const delta=first?Math.round(((last-first)/first)*100):0; const previous=rows.length>1?rows[rows.length-2].load:null; const vsPrevious=previous!==null?last-previous:null; const vsPrevious=previous!==null?last-previous:null; const vsPrevious=previous!==null?last-previous:null; const previous=rows.length>1?rows[rows.length-2].load:null;"
          new="const delta=first?Math.round(((last-first)/first)*100):0; const previous=rows.length>1?rows[rows.length-2].load:null; const vsPrevious=previous!==null?last-previous:null;"
          if old not in s: raise SystemExit('duplicate evolution segment not found')
          s=s.replace(old,new,1)
          old2="</strong></div></div>'<select class=\"history-select\""
          new2="</strong></div></div>'+'<select class=\"history-select\""
          if old2 not in s: raise SystemExit('missing select concatenation not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programmes.html
          git commit -m 'Fix programs loading JavaScript' || exit 0
          git push origin HEAD:${{ github.event.pull_request.base.ref }}
