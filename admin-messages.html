<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HS Coaching — Messages</title><link rel="stylesheet" href="style.css"><style>.hidden{display:none!important}.client-search{width:100%;box-sizing:border-box;margin:0 0 10px;background:#0c0c0c;color:#fff;border:1px solid #444;border-radius:10px;padding:11px 12px;font-size:13px;outline:none}.client-search:focus{border-color:#fff}.client-search::placeholder{color:#777}body{background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px}.grid{display:grid;grid-template-columns:300px 1fr;gap:14px}.panel{background:#141414;border:1px solid #292929;border-radius:16px;padding:14px}.list{display:grid;gap:8px}.client{width:100%;text-align:left;background:#101010;color:#fff;border:1px solid #292929;border-radius:11px;padding:12px;cursor:pointer}.client.active{border-color:#fff}.client .unread{display:inline-block;background:#fff;color:#000;border-radius:99px;padding:3px 7px;font-size:8px;font-weight:900;margin-top:5px}.client small,.muted{color:#777}.msgs{height:480px;overflow:auto;padding:12px;background:#0f0f0f;border-radius:12px}.bubble{max-width:75%;padding:10px 12px;border-radius:13px;margin:7px 0;font-size:12px;line-height:1.45;white-space:pre-wrap}.mine{margin-left:auto;background:#fff;color:#000}.theirs{background:#222}.composer{display:flex;gap:8px;margin-top:10px}.composer textarea{flex:1;background:#0c0c0c;color:#fff;border:1px solid #333;border-radius:10px;padding:10px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#242424;color:#fff;font-weight:700;cursor:pointer}.primary{background:#fff;color:#000}.programs{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.notice{font-size:10px;color:#777;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.msgs{height:55vh}}</style></head><body><main class="wrap"><div class="top"><div><strong>HS COACHING</strong><div class="muted">Messagerie client</div></div><a class="btn" href="admin.html">← Administration</a></div><div id="auth" class="panel hidden">Vérification de connexion…</div><div id="app" class="grid"><section class="panel"><h3>Clients</h3><input id="searchClients" class="client-search" type="search" autocomplete="off" placeholder="🔎 Rechercher un prénom ou un nom…"><div id="clients" class="list"></div></section><section class="panel"><div id="head" class="muted">Sélectionne un client</div><div id="msgs" class="msgs"></div><div class="composer"><textarea id="input" placeholder="Répondre au client…"></textarea><button id="send" class="btn primary">Envoyer</button></div><div class="programs"><select id="program" class="btn"><option value="">Choisir un programme…</option></select><button id="deliver" class="btn primary">Envoyer le programme</button></div><div class="notice">Le programme envoyé apparaît dans « Mes programmes » du client et génère une notification.</div><p id="status" class="muted"></p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',sb=supabase.createClient(URL,KEY);let admin,clients=[],active=null,ch=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tm=x=>new Date(x).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});async function boot(){try{const a=await sb.auth.getSession();const user=a.data.session?.user;if(!user){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('auth').textContent='Connecte-toi à l’administration.';return}const ad=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(!ad.data){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('auth').textContent='Accès réservé à l’administration.';return}admin=user;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadClients()}catch(e){$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('auth').textContent='Erreur de connexion : '+(e?.message||e);console.error(e)}}let unreadCounts={};function renderClients(){const q=($('searchClients').value||'').trim().toLocaleLowerCase('fr-FR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const filtered=clients.filter(c=>{const name=String(c.client_name||'').toLocaleLowerCase('fr-FR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');const email=String(c.client_email||'').toLocaleLowerCase('fr-FR');return !q||name.includes(q)||email.includes(q)});$('clients').innerHTML=filtered.map(c=>`<button class="client ${active?.user_id===c.user_id?'active':''}" onclick="openClient('${c.user_id}')"><strong>${esc(c.client_name||c.client_email||'Client')}</strong><br><small>${esc(c.client_email||'')}</small><br><small>${tm(c.last_message_at)}</small>${unreadCounts[c.id]?'<br><span class="unread">'+unreadCounts[c.id]+' nouveau'+(unreadCounts[c.id]>1?'x':'')+'</span>':''}</button>`).join('')||'<span class="muted">Aucun client trouvé.</span>'}async function loadClients(){
  $('status').textContent='Chargement des clients…';
  const cr=await sb.rpc('admin_list_clients');
  if(cr.error){
    $('status').textContent='Erreur clients : '+cr.error.message;
    $('clients').innerHTML='<span class="muted">Impossible de charger les clients.</span>';
    return
  }
  const users=cr.data||[];
  clients=users.map(u=>({id:null,user_id:u.user_id,client_name:u.first_name||'',client_email:u.email||'',last_message_at:u.created_at,conversation:null}));
  unreadCounts={};
  renderClients();
  $('status').textContent=clients.length+' client'+(clients.length>1?'s':'')+' disponible'+(clients.length>1?'s':'')+'.';
  const rr=await sb.from('chat_conversations').select('*').order('last_message_at',{ascending:false});
  if(rr.error){$('status').textContent=clients.length+' client'+(clients.length>1?'s':'')+' chargé'+(clients.length>1?'s':'')+' (conversations indisponibles).';return}
  const conversations=rr.data||[];
  clients=clients.map(u=>{const conv=conversations.find(x=>x.user_id===u.user_id);return {...u,id:conv?.id||null,client_name:conv?.client_name||u.client_name,client_email:conv?.client_email||u.client_email,last_message_at:conv?.last_message_at||u.last_message_at,conversation:conv||null}});
  const ids=conversations.map(x=>x.id);
  if(ids.length){
    const m=await sb.from('chat_messages').select('conversation_id').in('conversation_id',ids).is('read_at',null).neq('sender_user_id',admin.id);
    if(!m.error)(m.data||[]).forEach(x=>unreadCounts[x.conversation_id]=(unreadCounts[x.conversation_id]||0)+1)
  }
  renderClients();
  $('status').textContent=clients.length+' client'+(clients.length>1?'s':'')+' disponible'+(clients.length>1?'s':'')+'.';
}
async function openClient(id){active=clients.find(x=>x.user_id===id||x.id===id);if(!active)return;if(!active.id){const ins=await sb.from('chat_conversations').insert({user_id:active.user_id,subject:'Conversation HS Coaching',client_name:active.client_name||null,client_email:active.client_email||null}).select('*').single();if(ins.error){$('status').textContent='Impossible d ouvrir la conversation : '+ins.error.message;return}active={...active,...ins.data};clients=clients.map(x=>x.user_id===active.user_id?active:x)}$('head').innerHTML='<strong>'+esc(active.client_name||active.client_email||'Client')+'</strong><div class="muted">'+esc(active.client_email||'')+'</div>';await loadMsgs();await loadPrograms();if(ch)sb.removeChannel(ch);ch=sb.channel('admin-client-'+active.user_id).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'conversation_id=eq.'+active.id},p=>{if(p.new.sender_user_id!==admin.id)append(p.new)}).subscribe();loadClients()}async function loadMsgs(){const r=await sb.from('chat_messages').select('*').eq('conversation_id',active.id).order('created_at');$('msgs').innerHTML=(r.data||[]).map(bubble).join('');$('msgs').scrollTop=$('msgs').scrollHeight}function bubble(m){return `<div class="bubble ${m.sender_user_id===admin.id?'mine':'theirs'}">${esc(m.body)}<div style="font-size:8px;opacity:.5;margin-top:4px">${m.sender_user_id===admin.id?'HS Coaching':'Client'} · ${tm(m.created_at)}</div></div>`}function append(m){$('msgs').insertAdjacentHTML('beforeend',bubble(m));$('msgs').scrollTop=$('msgs').scrollHeight}async function send(){const body=$('input').value.trim();if(!body||!active)return;const r=await sb.from('chat_messages').insert({conversation_id:active.id,sender_user_id:admin.id,body});if(r.error)$('status').textContent=r.error.message;else $('input').value=''}async function loadPrograms(){const r=await sb.from('programs').select('id,name,objective,level,duration_minutes').eq('is_published',true).order('name');$('program').innerHTML='<option value="">Choisir un programme…</option>'+(r.data||[]).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}async function deliver(){if(!active)return;const pid=Number($('program').value);if(!pid){$('status').textContent='Choisis un programme.';return}const p=(await sb.from('programs').select('*').eq('id',pid).single()).data;if(!p){$('status').textContent='Programme introuvable.';return}const s=(await sb.from('program_sessions').select('*').eq('program_id',pid).order('position')).data||[];const ex=(await sb.from('program_exercises').select('*').eq('program_id',pid).order('position')).data||[];const data={source_program_id:p.id,name:p.name,objective:p.objective,description:p.description,level:p.level,duration_minutes:p.duration_minutes,sessions:s,exercises:ex,delivered_at:new Date().toISOString()};const ins=await sb.from('client_programs').insert({user_id:active.user_id,source_program_id:p.id,name:p.name,data}).select('id').single();if(ins.error){$('status').textContent='Erreur envoi : '+ins.error.message;return}const n=await sb.from('client_notifications').insert({user_id:active.user_id,type:'program',title:'Nouveau programme',body:'Un nouveau programme vient de t’être envoyé.',data:{client_program_id:ins.data.id,program_name:p.name}});if(n.error){$('status').textContent='Programme envoyé, notification non créée.'}else $('status').textContent='Programme envoyé ✓ Notification créée ✓';$('program').value=''}$('searchClients').addEventListener('input',renderClients);$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('deliver').onclick=deliver;boot();</script></body></html>
