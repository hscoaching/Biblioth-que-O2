<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>HS Coaching — Messages</title><link rel="stylesheet" href="style.css"><style>.hidden{display:none!important}.client-search{width:100%;box-sizing:border-box;margin:0 0 10px;background:#0c0c0c;color:#fff;border:1px solid #444;border-radius:10px;padding:11px 12px;font-size:13px;outline:none}.client-search:focus{border-color:#fff}.client-search::placeholder{color:#777}.search-wrap{position:relative}.suggestions{position:absolute;left:0;right:0;top:100%;z-index:20;background:#111;border:1px solid #333;border-radius:10px;overflow:hidden}.suggestion{display:block;width:100%;border:0;border-bottom:1px solid #242424;background:#111;color:#fff;text-align:left;padding:10px 12px;cursor:pointer}.suggestion:hover{background:#222}.suggestion small{display:block;color:#777;margin-top:2px}body{background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px}.grid{display:grid;grid-template-columns:300px 1fr;gap:14px}.panel{background:#141414;border:1px solid #292929;border-radius:16px;padding:14px}.list{display:grid;gap:8px}.client{width:100%;text-align:left;background:#101010;color:#fff;border:1px solid #292929;border-radius:11px;padding:12px;cursor:pointer}.client.active{border-color:#fff}.client .unread{display:inline-block;background:#fff;color:#000;border-radius:99px;padding:3px 7px;font-size:8px;font-weight:900;margin-top:5px}.client small,.muted{color:#777}.msgs{height:480px;overflow:auto;padding:12px;background:#0f0f0f;border-radius:12px}.bubble{max-width:75%;padding:10px 12px;border-radius:13px;margin:7px 0;font-size:12px;line-height:1.45;white-space:pre-wrap}.mine{margin-left:auto;background:#fff;color:#000}.theirs{background:#222}.composer{display:flex;gap:8px;margin-top:10px}.composer textarea{flex:1;background:#0c0c0c;color:#fff;border:1px solid #333;border-radius:10px;padding:10px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#242424;color:#fff;font-weight:700;cursor:pointer}.primary{background:#fff;color:#000}.programs{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.notice{font-size:10px;color:#777;margin-top:8px}@media(max-width:700px){html,body{max-width:100%;overflow-x:hidden}.wrap{width:100%;box-sizing:border-box;padding:12px}.grid{grid-template-columns:1fr}.list{max-height:240px;overflow:auto}.msgs{height:42vh;min-height:280px}.bubble{max-width:86%;font-size:13px}.composer{position:sticky;bottom:0;background:#141414;padding-top:8px}.composer textarea{min-height:46px;font-size:16px}.suggestions{position:fixed;left:12px;right:12px;max-height:45vh;overflow:auto}}</style></head><body><main class="wrap"><div class="top"><div><strong>HS COACHING</strong><div class="muted">Messagerie client</div></div><a class="btn" href="admin.html">← Administration</a></div><div id="app" class="grid"><section class="panel"><h3>Clients</h3><div class="search-wrap"><input id="searchClients" class="client-search" type="search" autocomplete="off" placeholder="🔎 Rechercher un prénom, un nom ou un email…"><div id="clientSuggestions" class="suggestions hidden"></div></div><div id="clients" class="list"><span class="muted">Connexion…</span></div></section><section class="panel"><div id="head" class="muted">Sélectionne un client</div><div id="msgs" class="msgs"></div><div class="composer"><textarea id="input" placeholder="Répondre au client…"></textarea><button id="send" class="btn primary">Envoyer</button></div><div class="programs"><select id="program" class="btn"><option value="">Choisir un programme…</option></select><button id="deliver" class="btn primary">Envoyer le programme</button></div><div class="notice">Le programme envoyé apparaît dans « Mes programmes » du client et génère une notification.</div><p id="status" class="muted"></p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',sb=supabase.createClient(URL,KEY);
let admin=null,clients=[],active=null,ch=null,unreadCounts={};
const $=x=>document.getElementById(x);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=x=>x?new Date(x).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const norm=s=>String(s||'').trim().toLocaleLowerCase('fr-FR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');

async function adminUser(){
  const r=await sb.auth.getUser();
  if(r.error) throw r.error;
  const user=r.data?.user;
  if(!user) return null;
  const a=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();
  if(a.error) throw a.error;
  return a.data?user:null;
}

function renderClients(){
  const q=norm($('searchClients').value);
  const arr=clients.filter(c=>norm([c.client_name,c.client_email].join(' ')).includes(q));
  $('clients').innerHTML=arr.map(c=>'<button class="client '+(active?.id===c.id?'active':'')+'" onclick="openClientByUser(\''+esc(c.user_id)+'\')"><strong>'+esc(c.client_name||c.client_email||'Client')+'</strong><br><small>'+esc(c.client_email||'')+'</small><br><small>'+tm(c.last_message_at)+'</small>'+(unreadCounts[c.id]?'<br><span class="unread">'+unreadCounts[c.id]+' nouveau'+(unreadCounts[c.id]>1?'x':'')+'</span>':'')+'</button>').join('')||'<span class="muted">Aucun message.</span>';
}

async function loadConversations(){
  const r=await sb.rpc('admin_chat_inbox_v4');
  if(r.error) throw r.error;
  const rows=r.data||[];
  clients=rows.map(x=>({
    id:x.conversation_id||null,
    user_id:x.user_id,
    client_name:x.client_name||x.first_name||x.email||'Client',
    client_email:x.email||'',
    subject:x.subject||'',
    last_message_at:x.last_message_at||null,
    created_at:x.conversation_created_at||x.created_at
  }));
  const ids=clients.map(c=>c.id).filter(Boolean);
  unreadCounts={};
  if(ids.length){
    const m=await sb.from('chat_messages')
      .select('conversation_id,sender_user_id,read_at')
      .in('conversation_id',ids)
      .is('read_at',null);
    if(m.error) throw m.error;
    (m.data||[]).forEach(x=>{
      if(x.sender_user_id!==admin.id)
        unreadCounts[x.conversation_id]=(unreadCounts[x.conversation_id]||0)+1;
    });
  }
  clients.sort((a,b)=>new Date(b.last_message_at||b.created_at||0)-new Date(a.last_message_at||a.created_at||0));
  renderClients();
  $('status').textContent=clients.length+' client'+(clients.length>1?'s':'')+' · '+ids.length+' conversation'+(ids.length>1?'s':'');
}

async function openClientByUser(userId){
  active=clients.find(c=>String(c.user_id)===String(userId));
  if(!active)return;
  if(!active.id){
    const ins=await sb.from('chat_conversations').insert({
      user_id:active.user_id,
      client_name:active.client_name||active.client_email||'Client',
      client_email:active.client_email||'',
      subject:''
    }).select('*').single();
    if(ins.error){
      $('status').textContent='Erreur création conversation : '+ins.error.message;
      return;
    }
    active=ins.data;
    const idx=clients.findIndex(c=>String(c.user_id)===String(active.user_id));
    if(idx>=0) clients[idx]=active; else clients.push(active);
  }
  $('head').innerHTML='<strong>'+esc(active.client_name||active.client_email||'Client')+'</strong><div class="muted">'+esc(active.client_email||'')+'</div>';
  renderClients();
  await loadMsgs();
  await loadPrograms();
  if(ch)sb.removeChannel(ch);
  ch=sb.channel('admin-client-'+active.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'conversation_id=eq.'+active.id},async p=>{
    if(active&&p.new.conversation_id===active.id) await loadMsgs();
  }).subscribe();
}

async function loadMsgs(){
  if(!active)return;
  const r=await sb.from('chat_messages').select('id,conversation_id,sender_user_id,body,created_at,read_at').eq('conversation_id',active.id).order('created_at',{ascending:true});
  if(r.error){$('msgs').innerHTML='<div class="muted">Erreur messages : '+esc(r.error.message)+'</div>';return}
  const rows=r.data||[];
  $('msgs').innerHTML=rows.length?rows.map(bubble).join(''):'<div class="muted">Aucun message.</div>';
  $('msgs').scrollTop=$('msgs').scrollHeight;
  const unread=rows.filter(m=>m.sender_user_id!==admin.id&&!m.read_at).map(m=>m.id);
  if(unread.length){await sb.from('chat_messages').update({read_at:new Date().toISOString()}).in('id',unread);unread.forEach(id=>{for(const k of Object.keys(unreadCounts)){} });}
  await loadConversations();
}

function bubble(m){
  return '<div class="bubble '+(m.sender_user_id===admin.id?'mine':'theirs')+'">'+esc(m.body)+'<div style="font-size:8px;opacity:.5;margin-top:4px">'+(m.sender_user_id===admin.id?'HS Coaching':'Client')+' · '+tm(m.created_at)+'</div></div>';
}

async function send(){
  if(!active)return;
  const body=$('input').value.trim();
  if(!body)return;
  const r=await sb.from('chat_messages').insert({conversation_id:active.id,sender_user_id:admin.id,body}).select('*').single();
  if(r.error){$('status').textContent='Erreur envoi : '+r.error.message;return}
  $('input').value='';
  await loadMsgs();
}

async function loadPrograms(){
  const r=await sb.from('programs').select('id,name,objective,level,duration_minutes').eq('is_published',true).order('name');
  if(r.error)return;
  $('program').innerHTML='<option value="">Choisir un programme…</option>'+(r.data||[]).map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');
}

async function deliver(){
  if(!active)return;
  const pid=Number($('program').value);
  if(!pid){$('status').textContent='Choisis un programme.';return}
  const p=(await sb.from('programs').select('*').eq('id',pid).single()).data;
  if(!p){$('status').textContent='Programme introuvable.';return}
  const s=(await sb.from('program_sessions').select('*').eq('program_id',pid).order('position')).data||[];
  const ex=(await sb.from('program_exercises').select('*').eq('program_id',pid).order('position')).data||[];
  const data={source_program_id:p.id,name:p.name,objective:p.objective,description:p.description,level:p.level,duration_minutes:p.duration_minutes,sessions:s,exercises:ex,delivered_at:new Date().toISOString()};
  const ins=await sb.from('client_programs').insert({user_id:active.user_id,source_program_id:p.id,name:p.name,data}).select('id').single();
  if(ins.error){$('status').textContent='Erreur envoi : '+ins.error.message;return}
  const n=await sb.from('client_notifications').insert({user_id:active.user_id,type:'program',title:'Nouveau programme',body:'Un nouveau programme vient de t’être envoyé.',data:{client_program_id:ins.data.id,program_name:p.name}});
  $('status').textContent=n.error?'Programme envoyé, notification non créée.':'Programme envoyé ✓ Notification créée ✓';
  $('program').value='';
}

async function boot(){
  try{
    admin=await adminUser();
    if(!admin)throw new Error('Session admin introuvable ou compte non autorisé');
    $('clients').innerHTML='<span class="muted">Chargement…</span>';
    await loadConversations();
    if(window.__hsAdminChatChannel)sb.removeChannel(window.__hsAdminChatChannel);
    window.__hsAdminChatChannel=sb.channel('admin-all-messages').on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages'},async p=>{
      if(active&&p.new.conversation_id===active.id) await loadMsgs(); else await loadConversations();
    }).subscribe();
  }catch(e){
    console.error(e);
    $('clients').innerHTML='<span class="muted">Erreur : '+esc(e.message||e)+'</span>';
    $('status').textContent='Erreur : '+(e.message||e);
  }
}

$('searchClients').addEventListener('input',renderClients);
$('send').onclick=send;
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('deliver').onclick=deliver;
boot();
</script></body></html>
