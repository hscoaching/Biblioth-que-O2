<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HS Coaching — Messages</title><link rel="stylesheet" href="style.css"><style>body{background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0 18px}.grid{display:grid;grid-template-columns:300px 1fr;gap:14px}.panel{background:#141414;border:1px solid #292929;border-radius:16px;padding:14px}.list{display:grid;gap:8px}.client{width:100%;text-align:left;background:#101010;color:#fff;border:1px solid #292929;border-radius:11px;padding:12px;cursor:pointer}.client.active{border-color:#fff}.client .unread{display:inline-block;background:#fff;color:#000;border-radius:99px;padding:3px 7px;font-size:8px;font-weight:900;margin-top:5px}.client small,.muted{color:#777}.msgs{height:480px;overflow:auto;padding:12px;background:#0f0f0f;border-radius:12px}.bubble{max-width:75%;padding:10px 12px;border-radius:13px;margin:7px 0;font-size:12px;line-height:1.45;white-space:pre-wrap}.mine{margin-left:auto;background:#fff;color:#000}.theirs{background:#222}.composer{display:flex;gap:8px;margin-top:10px}.composer textarea{flex:1;background:#0c0c0c;color:#fff;border:1px solid #333;border-radius:10px;padding:10px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#242424;color:#fff;font-weight:700;cursor:pointer}.primary{background:#fff;color:#000}.programs{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.notice{font-size:10px;color:#777;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.msgs{height:55vh}}</style></head><body><main class="wrap"><div class="top"><div><strong>HS COACHING</strong><div class="muted">Messagerie client</div></div><a class="btn" href="admin.html">← Administration</a></div><div id="auth" class="panel">Vérification de connexion…</div><div id="app" class="grid hidden"><section class="panel"><h3>Clients</h3><div id="clients" class="list"></div></section><section class="panel"><div id="head" class="muted">Sélectionne un client</div><div id="msgs" class="msgs"></div><div class="composer"><textarea id="input" placeholder="Répondre au client…"></textarea><button id="send" class="btn primary">Envoyer</button></div><div class="programs"><select id="program" class="btn"><option value="">Choisir un programme…</option></select><button id="deliver" class="btn primary">Envoyer le programme</button></div><div class="notice">Le programme envoyé apparaît dans « Mes programmes » du client et génère une notification.</div><p id="status" class="muted"></p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',sb=supabase.createClient(URL,KEY);let admin,clients=[],active=null,ch=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tm=x=>new Date(x).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});async function boot(){const a=await sb.auth.getUser();if(!a.data.user){$('auth').textContent='Connecte-toi à l’administration.';return}const ad=await sb.from('admin_users').select('user_id').eq('user_id',a.data.user.id).maybeSingle();if(!ad.data){$('auth').textContent='Accès réservé à l’administration.';return}admin=a.data.user;$('auth').classList.add('hidden');$('app').classList.remove('hidden');await loadClients()}async function loadClients(){const r=await sb.from('chat_conversations').select('*').order('last_message_at',{ascending:false});if(r.error){$('status').textContent=r.error.message;return}clients=r.data||[];const unread={};if(clients.length){const m=await sb.from('chat_messages').select('conversation_id').in('conversation_id',clients.map(x=>x.id)).is('read_at',null).neq('sender_user_id',admin.id);(m.data||[]).forEach(x=>unread[x.conversation_id]=(unread[x.conversation_id]||0)+1)}$('clients').innerHTML=clients.map(c=>`<button class="client ${active?.id===c.id?'active':''}" onclick="openClient('${c.id}')"><strong>${esc(c.client_name||c.client_email||'Client')}</strong><br><small>${esc(c.client_email||'')}</small><br><small>${tm(c.last_message_at)}</small>${unread[c.id]?'<br><span class="unread">'+unread[c.id]+' nouveau'+(unread[c.id]>1?'x':'')+'</span>':''}</button>`).join('')||'<span class="muted">Aucune conversation.</span>'}async function openClient(id){active=clients.find(x=>x.id===id);if(!active)return;$('head').innerHTML='<strong>'+esc(active.client_name||active.client_email||'Client')+'</strong><div class="muted">'+esc(active.client_email||'')+'</div>';await loadMsgs();await loadPrograms();if(ch)sb.removeChannel(ch);ch=sb.channel('admin-client-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'conversation_id=eq.'+id},p=>{if(p.new.sender_user_id!==admin.id)append(p.new)}).subscribe();loadClients()}async function loadMsgs(){const r=await sb.from('chat_messages').select('*').eq('conversation_id',active.id).order('created_at');$('msgs').innerHTML=(r.data||[]).map(bubble).join('');$('msgs').scrollTop=$('msgs').scrollHeight}function bubble(m){return `<div class="bubble ${m.sender_user_id===admin.id?'mine':'theirs'}">${esc(m.body)}<div style="font-size:8px;opacity:.5;margin-top:4px">${m.sender_user_id===admin.id?'HS Coaching':'Client'} · ${tm(m.created_at)}</div></div>`}function append(m){$('msgs').insertAdjacentHTML('beforeend',bubble(m));$('msgs').scrollTop=$('msgs').scrollHeight}async function send(){const body=$('input').value.trim();if(!body||!active)return;const r=await sb.from('chat_messages').insert({conversation_id:active.id,sender_user_id:admin.id,body});if(r.error)$('status').textContent=r.error.message;else $('input').value=''}async function loadPrograms(){const r=await sb.from('programs').select('id,name,objective,level,duration_minutes').eq('is_published',true).order('name');$('program').innerHTML='<option value="">Choisir un programme…</option>'+(r.data||[]).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}async function deliver(){if(!active)return;const pid=Number($('program').value);if(!pid){$('status').textContent='Choisis un programme.';return}const p=(await sb.from('programs').select('*').eq('id',pid).single()).data;if(!p){$('status').textContent='Programme introuvable.';return}const s=(await sb.from('program_sessions').select('*').eq('program_id',pid).order('position')).data||[];const ex=(await sb.from('program_exercises').select('*').eq('program_id',pid).order('position')).data||[];const data={source_program_id:p.id,name:p.name,objective:p.objective,description:p.description,level:p.level,duration_minutes:p.duration_minutes,sessions:s,exercises:ex,delivered_at:new Date().toISOString()};const ins=await sb.from('client_programs').insert({user_id:active.user_id,source_program_id:p.id,name:p.name,data}).select('id').single();if(ins.error){$('status').textContent='Erreur envoi : '+ins.error.message;return}const n=await sb.from('client_notifications').insert({user_id:active.user_id,type:'program',title:'Nouveau programme',body:'Un nouveau programme vient de t’être envoyé.',data:{client_program_id:ins.data.id,program_name:p.name}});if(n.error){$('status').textContent='Programme envoyé, notification non créée.'}else $('status').textContent='Programme envoyé ✓ Notification créée ✓';$('program').value=''}$('send').onclick=send;$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('deliver').onclick=deliver;boot();</script></body></html>
