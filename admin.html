<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HS Coaching — Admin</title><link rel="stylesheet" href="style.css"><style>
.admin{padding:35px 0 80px}.admin h1{font-size:clamp(38px,7vw,64px);letter-spacing:-3px;margin:8px 0}.sub{color:#888;line-height:1.5}.panel{background:#141414;border:1px solid #292929;border-radius:18px;padding:22px;margin:18px 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{background:#0d0d0d;border:1px solid #303030;color:#fff;border-radius:10px;padding:12px;font:inherit}.field textarea{min-height:100px;resize:vertical}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#000}.secondary{background:#242424;color:#fff}.danger{background:#351919;color:#ffb0b0}.tabs{display:flex;gap:8px;margin:20px 0}.tab{border:1px solid #292929;background:#141414;color:#888;padding:10px 14px;border-radius:10px;cursor:pointer}.tab.active{background:#fff;color:#000}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid #242424;border-radius:12px;background:#101010}.item small{color:#777}.item-actions{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none}.status{margin-top:12px;font-size:13px;color:#aaa}.login{max-width:460px;margin:50px auto}.notice{padding:12px;border-radius:10px;background:#1b1b1b;color:#aaa;font-size:13px}.topnav{display:flex;gap:8px;margin-left:auto}.topnav a{color:#888;text-decoration:none;padding:9px 12px;border-radius:9px;font-size:13px}.topnav a:hover{background:#fff;color:#000}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:#101010;border:1px solid #242424;border-radius:12px;padding:14px}.stat strong{display:block;font-size:25px}.stat small{color:#777}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.filter{display:flex;gap:7px}.filter button{border:1px solid #292929;background:#101010;color:#888;border-radius:9px;padding:8px 11px;cursor:pointer}.filter button.active{background:#fff;color:#000}.badge{display:inline-block;margin-left:6px;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800;background:#242424;color:#aaa}.badge.on{background:#19351f;color:#a9efba}.badge.off{background:#351919;color:#ffb0b0}
/* Admin fluidity */
.admin .panel{box-shadow:0 12px 35px rgba(0,0,0,.14);transition:border-color .2s,box-shadow .2s}.admin .panel:focus-within{border-color:#3b3b3b}.admin .toolbar h2{margin:0}.admin .field input,.admin .field textarea,.admin .field select{transition:border-color .18s,box-shadow .18s,background .18s}.admin .field input:focus,.admin .field textarea:focus,.admin .field select:focus{outline:none;border-color:#666;background:#111;box-shadow:0 0 0 3px rgba(255,255,255,.06)}.admin .btn{transition:transform .15s,opacity .15s,background .15s}.admin .btn:hover{transform:translateY(-1px)}.admin .btn:active{transform:translateY(0)}.admin .item{transition:transform .16s,border-color .16s,background .16s}.admin .item:hover{border-color:#383838;background:#131313}.admin .stats .stat{transition:transform .16s,border-color .16s}.admin .stats .stat:hover{transform:translateY(-2px);border-color:#383838}.admin .filter{margin-top:10px}.admin .filter button{transition:background .15s,color .15s,border-color .15s}.admin .notice{text-align:center;padding:20px}.admin .admin-editor{margin-top:18px;background:#101010;border:1px solid #303030;border-radius:16px;padding:18px}.admin .editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.admin .editor-head h3{margin:0}.admin .editor-section{border-top:1px solid #252525;padding-top:18px;margin-top:18px}.admin .editor-section:first-child{border-top:0;padding-top:0;margin-top:0}.admin .editor-section-title{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:#888;margin:0 0 12px}.admin .sticky-actions{position:sticky;bottom:12px;z-index:5;background:rgba(14,14,14,.92);backdrop-filter:blur(12px);border:1px solid #303030;border-radius:14px;padding:10px;margin-top:16px}.admin .quick-actions{display:flex;gap:7px;flex-wrap:wrap}.admin .quick-actions .btn{padding:9px 12px}.admin .item-actions .btn{padding:9px 12px}.admin .status.ok{color:#a9efba}.admin .status.error{color:#ffb0b0}.admin .loading{opacity:.55;pointer-events:none}.admin .search-wrap{position:relative}.admin .search-wrap input{padding-right:42px}.admin .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:8px;background:#222;color:#aaa;cursor:pointer;display:none}.admin .search-clear.visible{display:block}.admin .item-main{min-width:0}.admin .item-main strong{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.admin .item-meta{margin-top:5px}.admin .empty-state{padding:24px;text-align:center;color:#777;border:1px dashed #2d2d2d;border-radius:12px}
@media(max-width:650px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.item{align-items:flex-start;flex-direction:column}.item-actions{width:100%}.item-actions .btn{flex:1}.stats{grid-template-columns:1fr 1fr}.toolbar{align-items:stretch}.filter{width:100%}.filter button{flex:1}.admin{padding-top:22px}.admin .panel{padding:16px;border-radius:15px}.admin .topnav{gap:3px}.admin .topnav a{padding:8px 7px;font-size:11px}.admin .item-actions{display:grid;grid-template-columns:1fr 1fr 1fr}.admin .item-actions .btn{width:100%}.admin .editor-head{align-items:flex-start;flex-direction:column}.admin .sticky-actions{bottom:8px}}
@media(max-width:390px){.admin .item-actions{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.admin h1{letter-spacing:-2px}}
</style></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">HS</span><div><strong>HS COACHING</strong><small>Administration</small></div></div><nav class="topnav"><a href="index.html">Exercices</a><a href="programmes.html">Programmes</a><a href="qr-admin.html">QR codes</a></nav></header>
<main class="container admin">
<section id="login" class="panel login"><p class="eyebrow">ESPACE PRIVÉ</p><h1>Admin.</h1><p class="sub">Connecte-toi pour gérer ta bibliothèque HS Coaching.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field" style="margin-top:12px"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div><div class="btns"><button class="btn primary" id="loginBtn">Se connecter</button></div><div id="loginStatus" class="status"></div></section>
<section id="dashboard" class="hidden">
<div class="panel"><p class="eyebrow">TABLEAU DE BORD</p><h1>Bibliothèque.</h1><p class="sub" id="who"></p><div class="stats"><div class="stat"><strong id="statExercises">0</strong><small>Exercices</small></div><div class="stat"><strong id="statPublished">0</strong><small>Publiés</small></div><div class="stat"><strong id="statPrograms">0</strong><small>Programmes</small></div></div><div class="tabs"><button class="tab active" data-tab="exercises">Exercices</button><button class="tab" data-tab="programs">Programmes</button></div></div>
<div id="exercisePanel" class="panel"><div class="toolbar"><h2>Exercices</h2><button class="btn primary" id="newExercise">+ Nouvel exercice</button></div><div class="field search-wrap" style="margin:12px 0"><label>Rechercher</label><input id="exerciseSearch" placeholder="Nom, muscle, équipement…" autocomplete="off"><button id="searchClear" class="search-clear" type="button" aria-label="Effacer la recherche">×</button></div><div class="filter"><button class="active" data-status="all">Tous</button><button data-status="published">Publiés</button><button data-status="draft">Brouillons</button></div><div id="exerciseList" class="list" style="margin-top:12px"></div><div id="exerciseForm" class="hidden"></div></div>
<div id="programPanel" class="panel hidden"><div class="toolbar"><h2>Programmes</h2><button class="btn primary" id="newProgram">+ Nouveau programme</button></div><div id="programList" class="list" style="margin-top:12px"></div><div id="programForm" class="hidden"></div></div>
<div class="panel"><button class="btn secondary" id="logout">Se déconnecter</button><div id="dashStatus" class="status"></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co';const SUPABASE_KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let cats=[],exercises=[],programs=[],exerciseStatus='all';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function setStatus(text,type=''){const el=$('dashStatus');el.textContent=text;el.className='status '+type;clearTimeout(window.__statusTimer);if(text)window.__statusTimer=setTimeout(()=>{el.textContent='';el.className='status'},3500)}
async function isAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data,error}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return error?null:(data?user:null)}
async function boot(){const u=await isAdmin();if(!u)return;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('who').textContent='Connecté en tant que '+u.email;await loadAll()}
async function loadAll(){document.body.classList.add('loading');let r=await sb.from('categories').select('*').order('name');cats=r.data||[];r=await sb.from('exercises').select('*').order('name');exercises=r.data||[];r=await sb.from('programs').select('*').order('name');programs=r.data||[];updateStats();renderExercises();renderPrograms();document.body.classList.remove('loading')}
function updateStats(){$('statExercises').textContent=exercises.length;$('statPublished').textContent=exercises.filter(e=>e.is_published).length;$('statPrograms').textContent=programs.length}
function renderExercises(){const q=$('exerciseSearch').value.trim().toLowerCase();let list=exercises.filter(e=>(e.name+' '+(e.muscles||[]).join(' ')+' '+(e.equipment||'')).toLowerCase().includes(q));if(exerciseStatus==='published')list=list.filter(e=>e.is_published);if(exerciseStatus==='draft')list=list.filter(e=>!e.is_published);$('exerciseList').innerHTML=list.map(e=>`<div class="item"><div class="item-main"><strong>${esc(e.name)}</strong><span class="badge ${e.is_published?'on':'off'}">${e.is_published?'Publié':'Brouillon'}</span><div class="item-meta"><small>${esc(e.equipment||'Sans matériel')}</small></div></div><div class="item-actions"><button class="btn secondary" onclick="editExercise(${e.id})">Modifier</button><button class="btn secondary" onclick="toggleExercise(${e.id})">${e.is_published?'Dépublier':'Publier'}</button><button class="btn danger" onclick="deleteExercise(${e.id})">Supprimer</button></div></div>`).join('')||'<div class="empty-state">Aucun exercice trouvé.</div>';updateSearchClear()}
function renderPrograms(){$('programList').innerHTML=programs.map(p=>`<div class="item"><div class="item-main"><strong>${esc(p.name)}</strong><span class="badge ${p.is_published?'on':'off'}">${p.is_published?'Publié':'Brouillon'}</span><div class="item-meta"><small>${esc(p.objective||'')}</small></div></div><div class="item-actions"><button class="btn secondary" onclick="editProgram(${p.id})">Modifier</button></div></div>`).join('')||'<div class="empty-state">Aucun programme.</div>'}
function editorShell(title,content){return `<div class="admin-editor"><div class="editor-head"><h3>${title}</h3><button class="btn secondary" type="button" onclick="closeActiveEditor()">Fermer</button></div>${content}</div>`}
function exerciseForm(e={}){const id=e.id||'';$('exerciseForm').classList.remove('hidden');$('exerciseForm').innerHTML=editorShell(`${id?'Modifier':'Nouvel'} exercice`,`<div class="editor-section"><p class="editor-section-title">Informations principales</p><div class="form-grid"><div class="field"><label>Nom</label><input id="ef_name" value="${esc(e.name||'')}"></div><div class="field"><label>Slug</label><input id="ef_slug" value="${esc(e.slug||'')}"></div><div class="field"><label>Catégorie</label><select id="ef_cat">${cats.map(c=>`<option value="${c.id}" ${String(c.id)===String(e.category_id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Équipement</label><input id="ef_equipment" value="${esc(e.equipment||'')}"></div><div class="field"><label>Niveau</label><input id="ef_level" value="${esc(e.level||'')}"></div><div class="field"><label>Image / vidéo</label><input id="ef_media" value="${esc(e.media_url||'')}"></div><div class="field"><label>Publié</label><select id="ef_published"><option value="true" ${e.is_published?'selected':''}>Oui</option><option value="false" ${!e.is_published?'selected':''}>Non</option></select></div></div></div><div class="editor-section"><p class="editor-section-title">Contenu</p><div class="form-grid"><div class="field full"><label>Description</label><textarea id="ef_desc">${esc(e.description||'')}</textarea></div><div class="field"><label>Muscles — un par ligne</label><textarea id="ef_muscles">${esc((e.muscles||[]).join('\n'))}</textarea></div><div class="field"><label>Instructions — une par ligne</label><textarea id="ef_inst">${esc((e.instructions||[]).join('\n'))}</textarea></div><div class="field"><label>Conseils — un par ligne</label><textarea id="ef_tips">${esc((e.tips||[]).join('\n'))}</textarea></div><div class="field"><label>Erreurs — une par ligne</label><textarea id="ef_mistakes">${esc((e.common_mistakes||[]).join('\n'))}</textarea></div></div></div><div class="sticky-actions"><div class="quick-actions"><button class="btn primary" onclick="saveExercise(${id||'null'})">Enregistrer</button><button class="btn secondary" onclick="closeActiveEditor()">Annuler</button></div></div>`)}
function closeExerciseForm(){$('exerciseForm').classList.add('hidden');$('exerciseForm').innerHTML=''}
function closeActiveEditor(){closeExerciseForm();$('programForm').classList.add('hidden');$('programForm').innerHTML='';window.scrollTo({top:document.querySelector('#exercisePanel')?.offsetTop||0,behavior:'smooth'})}
window.editExercise=id=>{closeProgramForm();exerciseForm(exercises.find(e=>e.id===id)||{});$('exerciseForm').scrollIntoView({behavior:'smooth',block:'start'})};window.toggleExercise=async id=>{const e=exercises.find(x=>x.id===id);if(!e)return;setStatus('Mise à jour…');const r=await sb.from('exercises').update({is_published:!e.is_published}).eq('id',id);if(r.error){setStatus(r.error.message,'error');return}setStatus(e.is_published?'Exercice dépublié.':'Exercice publié.','ok');await loadAll()};window.deleteExercise=async id=>{const e=exercises.find(x=>x.id===id);if(!e||!confirm(`Supprimer « ${e.name} » ? Cette action est irréversible.`))return;setStatus('Suppression…');const r=await sb.from('exercises').delete().eq('id',id);if(r.error){setStatus('Suppression impossible : '+r.error.message,'error');return}setStatus('Exercice supprimé.','ok');await loadAll()};window.saveExercise=async id=>{const name=$('ef_name').value.trim();if(!name){setStatus('Le nom est obligatoire.','error');$('ef_name').focus();return}const slug=$('ef_slug').value.trim()||name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const payload={name,slug,category_id:Number($('ef_cat').value)||null,equipment:$('ef_equipment').value.trim()||null,level:$('ef_level').value.trim()||null,media_url:$('ef_media').value.trim()||null,is_published:$('ef_published').value==='true',description:$('ef_desc').value.trim()||null,muscles:$('ef_muscles').value.split('\n').map(x=>x.trim()).filter(Boolean),instructions:$('ef_inst').value.split('\n').map(x=>x.trim()).filter(Boolean),tips:$('ef_tips').value.split('\n').map(x=>x.trim()).filter(Boolean),common_mistakes:$('ef_mistakes').value.split('\n').map(x=>x.trim()).filter(Boolean)};setStatus('Enregistrement…');const r=id?await sb.from('exercises').update(payload).eq('id',id):await sb.from('exercises').insert(payload);if(r.error){setStatus(r.error.message,'error');return}setStatus('Exercice enregistré.','ok');closeExerciseForm();await loadAll()};
function closeProgramForm(){$('programForm').classList.add('hidden');$('programForm').innerHTML=''}
function programForm(p={}){const id=p.id||'';$('programForm').classList.remove('hidden');$('programForm').innerHTML=editorShell(`${id?'Modifier':'Nouveau'} programme`,`<div class="editor-section"><p class="editor-section-title">Informations</p><div class="form-grid"><div class="field"><label>Nom</label><input id="pf_name" value="${esc(p.name||'')}"></div><div class="field"><label>Slug</label><input id="pf_slug" value="${esc(p.slug||'')}"></div><div class="field"><label>Objectif</label><input id="pf_obj" value="${esc(p.objective||'')}"></div><div class="field"><label>Niveau</label><input id="pf_level" value="${esc(p.level||'')}"></div><div class="field"><label>Durée (min)</label><input id="pf_duration" type="number" value="${esc(p.duration_minutes||'')}"></div><div class="field"><label>Catégorie</label><select id="pf_cat">${cats.map(c=>`<option value="${c.id}" ${String(c.id)===String(p.category_id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Publié</label><select id="pf_published"><option value="true" ${p.is_published?'selected':''}>Oui</option><option value="false" ${!p.is_published?'selected':''}>Non</option></select></div><div class="field full"><label>Description</label><textarea id="pf_desc">${esc(p.description||'')}</textarea></div></div></div><div class="sticky-actions"><div class="quick-actions"><button class="btn primary" onclick="saveProgram(${id||'null'})">Enregistrer</button><button class="btn secondary" onclick="closeProgramForm()">Annuler</button></div></div>`)}window.editProgram=id=>{closeExerciseForm();programForm(programs.find(p=>p.id===id)||{});$('programForm').scrollIntoView({behavior:'smooth',block:'start'})};window.saveProgram=async id=>{const name=$('pf_name').value.trim();if(!name){setStatus('Le nom est obligatoire.','error');$('pf_name').focus();return}const payload={name,slug:$('pf_slug').value.trim()||name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''),objective:$('pf_obj').value.trim()||null,level:$('pf_level').value.trim()||null,duration_minutes:Number($('pf_duration').value)||null,category_id:Number($('pf_cat').value)||null,is_published:$('pf_published').value==='true',description:$('pf_desc').value.trim()||null};setStatus('Enregistrement…');const r=id?await sb.from('programs').update(payload).eq('id',id):await sb.from('programs').insert(payload);if(r.error){setStatus(r.error.message,'error');return}setStatus('Programme enregistré.','ok');closeProgramForm();await loadAll()};
function updateSearchClear(){const b=$('searchClear');if(b)b.classList.toggle('visible',!!$('exerciseSearch').value)}
$('loginBtn').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginStatus').textContent=r.error?r.error.message:'Connexion…';if(!r.error)boot()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('newExercise').onclick=()=>{closeProgramForm();exerciseForm();$('exerciseForm').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$('ef_name')?.focus(),250)};$('newProgram').onclick=()=>{closeExerciseForm();programForm();$('programForm').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$('pf_name')?.focus(),250)};$('exerciseSearch').oninput=renderExercises;$('searchClear').onclick=()=>{$('exerciseSearch').value='';renderExercises();$('exerciseSearch').focus()};document.querySelectorAll('.filter button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter button').forEach(x=>x.classList.remove('active'));b.classList.add('active');exerciseStatus=b.dataset.status;renderExercises()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('exercisePanel').classList.toggle('hidden',b.dataset.tab!=='exercises');$('programPanel').classList.toggle('hidden',b.dataset.tab!=='programs');window.scrollTo({top:0,behavior:'smooth'})});boot();
</script></body></html>
