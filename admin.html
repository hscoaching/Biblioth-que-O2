<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HS Coaching — Admin</title><link rel="stylesheet" href="style.css"><style>
.admin{padding:35px 0 80px}.admin h1{font-size:clamp(38px,7vw,64px);letter-spacing:-3px;margin:8px 0}.sub{color:#888;line-height:1.5}.panel{background:#141414;border:1px solid #292929;border-radius:18px;padding:22px;margin:18px 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{background:#0d0d0d;border:1px solid #303030;color:#fff;border-radius:10px;padding:12px;font:inherit}.field textarea{min-height:100px;resize:vertical}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#000}.secondary{background:#242424;color:#fff}.danger{background:#351919;color:#ffb0b0}.tabs{display:flex;gap:8px;margin:20px 0}.tab{border:1px solid #292929;background:#141414;color:#888;padding:10px 14px;border-radius:10px;cursor:pointer}.tab.active{background:#fff;color:#000}.list{display:grid;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid #242424;border-radius:12px;background:#101010}.item small{color:#777}.item-actions{display:flex;gap:7px}.hidden{display:none}.status{margin-top:12px;font-size:13px;color:#aaa}.login{max-width:460px;margin:50px auto}.notice{padding:12px;border-radius:10px;background:#1b1b1b;color:#aaa;font-size:13px}.topnav{display:flex;gap:8px;margin-left:auto}.topnav a{color:#888;text-decoration:none;padding:9px 12px;border-radius:9px;font-size:13px}.topnav a:hover{background:#fff;color:#000}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.item{align-items:flex-start;flex-direction:column}.item-actions{width:100%}.item-actions .btn{flex:1}}
</style></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">HS</span><div><strong>HS COACHING</strong><small>Administration</small></div></div><nav class="topnav"><a href="index.html">Exercices</a><a href="programmes.html">Programmes</a></nav></header>
<main class="container admin">
<section id="login" class="panel login"><p class="eyebrow">ESPACE PRIVÉ</p><h1>Admin.</h1><p class="sub">Connecte-toi pour gérer ta bibliothèque HS Coaching.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field" style="margin-top:12px"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div><div class="btns"><button class="btn primary" id="loginBtn">Se connecter</button></div><div id="loginStatus" class="status"></div></section>
<section id="dashboard" class="hidden">
<div class="panel"><p class="eyebrow">TABLEAU DE BORD</p><h1>Bibliothèque.</h1><p class="sub" id="who"></p><div class="tabs"><button class="tab active" data-tab="exercises">Exercices</button><button class="tab" data-tab="programs">Programmes</button></div></div>
<div id="exercisePanel" class="panel"><div class="btns" style="justify-content:space-between"><h2>Exercices</h2><button class="btn primary" id="newExercise">+ Nouvel exercice</button></div><div class="field" style="margin:12px 0"><label>Rechercher</label><input id="exerciseSearch" placeholder="Nom, muscle, équipement…"></div><div id="exerciseList" class="list"></div><div id="exerciseForm" class="hidden"></div></div>
<div id="programPanel" class="panel hidden"><div class="btns" style="justify-content:space-between"><h2>Programmes</h2><button class="btn primary" id="newProgram">+ Nouveau programme</button></div><div id="programList" class="list"></div><div id="programForm" class="hidden"></div></div>
<div class="panel"><button class="btn secondary" id="logout">Se déconnecter</button><div id="dashStatus" class="status"></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co';const SUPABASE_KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let cats=[],exercises=[],programs=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function isAdmin(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data,error}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return error?null:(data?user:null)}
async function boot(){const u=await isAdmin();if(!u)return;$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('who').textContent='Connecté en tant que '+u.email;await loadAll()}
async function loadAll(){let r=await sb.from('categories').select('*').order('name');cats=r.data||[];r=await sb.from('exercises').select('*').order('name');exercises=r.data||[];r=await sb.from('programs').select('*').order('name');programs=r.data||[];renderExercises();renderPrograms()}
function renderExercises(){const q=$('exerciseSearch').value.toLowerCase();const list=exercises.filter(e=>(e.name+' '+(e.muscles||[]).join(' ')+' '+(e.equipment||'')).toLowerCase().includes(q));$('exerciseList').innerHTML=list.map(e=>`<div class="item"><div><strong>${esc(e.name)}</strong><br><small>${esc(e.equipment||'Sans matériel')} · ${e.is_published?'Publié':'Brouillon'}</small></div><div class="item-actions"><button class="btn secondary" onclick="editExercise(${e.id})">Modifier</button></div></div>`).join('')||'<div class="notice">Aucun exercice.</div>'}
function renderPrograms(){$('programList').innerHTML=programs.map(p=>`<div class="item"><div><strong>${esc(p.name)}</strong><br><small>${esc(p.objective||'')} · ${p.is_published?'Publié':'Brouillon'}</small></div><div class="item-actions"><button class="btn secondary" onclick="editProgram(${p.id})">Modifier</button></div></div>`).join('')||'<div class="notice">Aucun programme.</div>'}
function exerciseForm(e={}){const id=e.id||'';$('exerciseForm').classList.remove('hidden');$('exerciseForm').innerHTML=`<div class="panel"><h3>${id?'Modifier':'Nouvel'} exercice</h3><div class="form-grid"><div class="field"><label>Nom</label><input id="ef_name" value="${esc(e.name||'')}"></div><div class="field"><label>Slug</label><input id="ef_slug" value="${esc(e.slug||'')}"></div><div class="field"><label>Catégorie</label><select id="ef_cat">${cats.map(c=>`<option value="${c.id}" ${String(c.id)===String(e.category_id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Équipement</label><input id="ef_equipment" value="${esc(e.equipment||'')}"></div><div class="field"><label>Niveau</label><input id="ef_level" value="${esc(e.level||'')}"></div><div class="field"><label>Image / vidéo</label><input id="ef_media" value="${esc(e.media_url||'')}"></div><div class="field full"><label>Description</label><textarea id="ef_desc">${esc(e.description||'')}</textarea></div><div class="field"><label>Muscles — un par ligne</label><textarea id="ef_muscles">${esc((e.muscles||[]).join('\n'))}</textarea></div><div class="field"><label>Instructions — une par ligne</label><textarea id="ef_inst">${esc((e.instructions||[]).join('\n'))}</textarea></div><div class="field"><label>Conseils — un par ligne</label><textarea id="ef_tips">${esc((e.tips||[]).join('\n'))}</textarea></div><div class="field"><label>Erreurs — une par ligne</label><textarea id="ef_mistakes">${esc((e.common_mistakes||[]).join('\n'))}</textarea></div></div><div class="btns"><button class="btn primary" onclick="saveExercise(${id||'null'})">Enregistrer</button><button class="btn secondary" onclick="$('exerciseForm').classList.add('hidden')">Annuler</button></div></div>`}
window.editExercise=id=>exerciseForm(exercises.find(e=>e.id===id)||{});window.saveExercise=async id=>{const slug=$('ef_slug').value.trim()||$('ef_name').value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const payload={name:$('ef_name').value.trim(),slug,category_id:Number($('ef_cat').value)||null,equipment:$('ef_equipment').value.trim()||null,level:$('ef_level').value.trim()||null,media_url:$('ef_media').value.trim()||null,description:$('ef_desc').value.trim()||null,muscles:$('ef_muscles').value.split('\n').map(x=>x.trim()).filter(Boolean),instructions:$('ef_inst').value.split('\n').map(x=>x.trim()).filter(Boolean),tips:$('ef_tips').value.split('\n').map(x=>x.trim()).filter(Boolean),common_mistakes:$('ef_mistakes').value.split('\n').map(x=>x.trim()).filter(Boolean)};const r=id?await sb.from('exercises').update(payload).eq('id',id):await sb.from('exercises').insert(payload);if(r.error){$('dashStatus').textContent=r.error.message;return}$('dashStatus').textContent='Exercice enregistré.';$('exerciseForm').classList.add('hidden');await loadAll()};
function programForm(p={}){const id=p.id||'';$('programForm').classList.remove('hidden');$('programForm').innerHTML=`<div class="panel"><h3>${id?'Modifier':'Nouveau'} programme</h3><div class="form-grid"><div class="field"><label>Nom</label><input id="pf_name" value="${esc(p.name||'')}"></div><div class="field"><label>Slug</label><input id="pf_slug" value="${esc(p.slug||'')}"></div><div class="field"><label>Objectif</label><input id="pf_obj" value="${esc(p.objective||'')}"></div><div class="field"><label>Niveau</label><input id="pf_level" value="${esc(p.level||'')}"></div><div class="field"><label>Durée (min)</label><input id="pf_duration" type="number" value="${esc(p.duration_minutes||'')}"></div><div class="field"><label>Catégorie</label><select id="pf_cat">${cats.map(c=>`<option value="${c.id}" ${String(c.id)===String(p.category_id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field full"><label>Description</label><textarea id="pf_desc">${esc(p.description||'')}</textarea></div></div><div class="btns"><button class="btn primary" onclick="saveProgram(${id||'null'})">Enregistrer</button><button class="btn secondary" onclick="$('programForm').classList.add('hidden')">Annuler</button></div></div>`}window.editProgram=id=>programForm(programs.find(p=>p.id===id)||{});window.saveProgram=async id=>{const payload={name:$('pf_name').value.trim(),slug:$('pf_slug').value.trim()||$('pf_name').value.toLowerCase().replace(/[^a-z0-9]+/g,'-'),objective:$('pf_obj').value.trim()||null,level:$('pf_level').value.trim()||null,duration_minutes:Number($('pf_duration').value)||null,category_id:Number($('pf_cat').value)||null,description:$('pf_desc').value.trim()||null};const r=id?await sb.from('programs').update(payload).eq('id',id):await sb.from('programs').insert(payload);if(r.error){$('dashStatus').textContent=r.error.message;return}$('dashStatus').textContent='Programme enregistré.';$('programForm').classList.add('hidden');await loadAll()};
$('loginBtn').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginStatus').textContent=r.error?r.error.message:'Connexion…';if(!r.error)boot()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('newExercise').onclick=()=>exerciseForm();$('newProgram').onclick=()=>programForm();$('exerciseSearch').oninput=renderExercises;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('exercisePanel').classList.toggle('hidden',b.dataset.tab!=='exercises');$('programPanel').classList.toggle('hidden',b.dataset.tab!=='programs')});boot();
</script></body></html>
