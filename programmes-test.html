<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HS Coaching — Test programmes</title><link rel="stylesheet" href="style.css"><style>body{background:#111;color:#fff}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:22px}.card h2{margin:8px 0}.meta{color:#888;font-size:13px}.state{color:#aaa;padding:30px 0}.error{color:#ff8a8a;background:#241414;border:1px solid #512323;border-radius:12px;padding:16px;line-height:1.5}button{background:#fff;color:#000;border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;margin-top:12px}.tag{font-size:10px;letter-spacing:1.5px;color:#777}</style></head><body><main class="wrap"><p class="tag">HS COACHING</p><h1>Programmes</h1><section id="cards" class="grid"><div class="state">Chargement des programmes…</div></section></main><script>const URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co/rest/v1/programs?select=id,name,slug,objective,duration_minutes,description,is_published&is_published=eq.true&order=id';const KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB';const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function load(){const el=document.getElementById('cards');try{const r=await fetch(URL,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw new Error('Supabase HTTP '+r.status);const data=await r.json();if(!data.length){el.innerHTML='<div class="state">Aucun programme publié.</div>';return}el.innerHTML=data.map(p=>'<article class="card"><span class="tag">'+esc(p.objective||'PROGRAMME')+'</span><h2>'+esc(p.name)+'</h2><p>'+esc(p.description||'')+'</p><div class="meta">'+esc(p.duration_minutes||'—')+' min</div><button>Programme disponible</button></article>').join('')}catch(e){el.innerHTML='<div class="error"><strong>Erreur de chargement</strong><br>'+esc(e.message)+'<br><br>Le problème vient donc bien de la connexion publique à Supabase, pas des programmes eux-mêmes.</div>'}}load();</script></body></html>
