<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HS Coaching — Programmes</title><link rel="stylesheet" href="style.css"><style>
.program-hero{padding:55px 0 35px}.program-hero h1{font-size:clamp(40px,7vw,70px);line-height:1;margin:12px 0 18px;letter-spacing:-3px}.program-hero p{color:#aaa;line-height:1.6;max-width:650px}.nav{margin-left:auto;margin-right:22px;display:flex;gap:8px}.nav a{color:#888;text-decoration:none;padding:9px 12px;border-radius:9px;font-size:13px}.nav a.active,.nav a:hover{background:#fff;color:#000}.programme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;padding:10px 0 50px}.programme-card{background:#141414;border:1px solid #292929;border-radius:18px;padding:24px;position:relative;overflow:hidden}.programme-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#fff}.programme-card.custom:before{background:#777}.programme-card h3{font-size:24px;margin:8px 0}.programme-card p{color:#aaa;line-height:1.55;font-size:14px;min-height:66px}.programme-meta{color:#888;font-size:12px;margin:18px 0}.programme-open{display:block;width:100%;box-sizing:border-box;background:#fff;color:#000;border-radius:10px;padding:12px;font-weight:800;text-align:center;text-decoration:none}.custom-message{background:#0f0f0f;border:1px solid #303030;border-radius:12px;padding:13px;color:#bbb;font-size:13px;line-height:1.55}.programme-detail{background:#101010;border:1px solid #292929;border-radius:18px;margin:0 0 28px;padding:24px}.programme-detail h2{margin-top:8px}.programme-day{margin-top:25px}.day-title{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;padding-bottom:10px}.day-title h3{margin:0;font-size:17px}.day-title span{color:#777;font-size:11px}.programme-row{display:grid;grid-template-columns:28px 1fr auto auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #222;color:#eee;text-decoration:none}.programme-row:hover .exercise-name{text-decoration:underline}.exercise-number{color:#666;font-size:12px}.exercise-name{font-size:14px}.programme-row strong{font-size:12px;white-space:nowrap}.programme-row small{color:#777;white-space:nowrap}.programme-row:after{content:'↗';color:#666;font-size:12px}.programme-note,.state{color:#777;font-size:12px}.programme-note{margin-top:20px}.back-link{display:inline-block;color:#aaa;text-decoration:none;margin-bottom:20px;font-size:13px}@media(max-width:600px){.nav a{padding:8px 9px}.programme-row{grid-template-columns:24px 1fr}.programme-row strong,.programme-row small{grid-column:2;font-size:11px}.programme-detail{padding:18px}}
</style></head><body id="top"><header class="topbar"><div class="brand"><span class="brand-mark">HS</span><div><strong>HS COACHING</strong><small>Bibliothèque O2</small></div></div><nav class="nav"><a href="index.html">Exercices</a><a class="active" href="programmes.html">Programmes</a></nav></header><main class="container"><section class="program-hero"><p class="eyebrow">PROGRAMMES HS COACHING</p><h1>Ton programme.<br><span>Ta progression.</span></h1><p>Des séances structurées avec séries, répétitions et temps de repos.</p></section><section id="cards" class="programme-grid"><div class="state">Chargement des programmes…</div></section><section id="details"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://hcjoagpkgpqxgzjdyfvd.supabase.co','sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB');const esc=s=>String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const clean=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9-]/g,'');
function customCard(){return '<article class="programme-card custom"><span class="tag">SUR MESURE</span><h3>Programme personnalisé</h3><p>Tu veux un programme entièrement adapté à tes objectifs, ton niveau, tes disponibilités et ton matériel ?</p><div class="custom-message">Pour un programme personnalisé, contacte directement Hugo afin de définir ensemble ce qui te correspond le mieux.</div></article>'}
function renderDetail(p,sessions){let h='<article id="'+clean(p.slug)+'" class="programme-detail"><a class="back-link" href="#top">↑ Retour aux programmes</a><span class="tag">'+esc(p.objective||'PROGRAMME')+'</span><h2>'+esc(p.name)+'</h2>';sessions.forEach(s=>{h+='<div class="programme-day"><div class="day-title"><h3>'+esc(s.name)+'</h3><span>'+s.items.length+' exercices</span></div>';s.items.forEach((x,i)=>{const e=x.exercises;const label=e.name_fr||e.name;h+='<a class="programme-row" href="index.html?exercice='+encodeURIComponent(e.slug||e.id)+'"><span class="exercise-number">'+(i+1)+'</span><span class="exercise-name">'+esc(label)+'</span><strong>'+esc(x.sets||'')+(x.reps?' × '+esc(x.reps):'')+'</strong><small>'+esc(x.rest||'')+'</small></a>'});h+='</div>'});return h+'<div class="programme-note">💡 Appuie sur un exercice pour ouvrir sa fiche technique.</div></article>'}
async function load(){const cards=document.getElementById('cards'),details=document.getElementById('details');const {data:programs,error}=await db.from('programs').select('*').eq('is_published',true).order('id');if(error||!programs?.length){cards.innerHTML=customCard();return}const all=[];for(const p of programs){const {data:sessions}=await db.from('program_sessions').select('id,name,position').eq('program_id',p.id).order('position');const built=[];for(const s of (sessions||[])){const {data:items}=await db.from('program_exercises').select('id,position,sets,reps,rest,notes,exercises(id,name,name_fr,slug,media_url)').eq('session_id',s.id).order('position');built.push({...s,items:(items||[]).filter(x=>x.exercises)});}all.push({p,sessions:built});}cards.innerHTML=all.map(({p,sessions})=>'<article class="programme-card"><span class="tag">'+esc(p.objective||'PROGRAMME')+'</span><h3>'+esc(p.name)+'</h3><p>'+esc(p.description||'')+'</p><div class="programme-meta">'+(p.duration_minutes||'—')+' min · '+sessions.length+' séances</div><a class="programme-open" href="#'+clean(p.slug)+'">Voir le programme ↓</a></article>').join('')+customCard();details.innerHTML=all.map(x=>renderDetail(x.p,x.sessions)).join('')}
load();</script></body></html>
