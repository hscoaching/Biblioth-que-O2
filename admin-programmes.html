<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HS Coaching — Éditeur de programmes</title><link rel="stylesheet" href="style.css"><style>
.editor{padding:35px 0 90px}.editor h1{font-size:clamp(40px,7vw,64px);letter-spacing:-3px;margin:8px 0}.sub{color:#888;line-height:1.5}.panel{background:#141414;border:1px solid #292929;border-radius:18px;padding:22px;margin:18px 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{background:#0d0d0d;border:1px solid #303030;color:#fff;border-radius:10px;padding:12px;font:inherit}.field textarea{min-height:100px;resize:vertical}.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#000}.secondary{background:#242424;color:#fff}.danger{background:#351919;color:#ffb0b0}.session{background:#101010;border:1px solid #292929;border-radius:16px;padding:16px;margin:16px 0}.session-head{display:flex;gap:10px;align-items:center}.session-head input{flex:1;background:#0b0b0b;border:1px solid #303030;color:#fff;border-radius:9px;padding:10px;font-weight:800}.session-tools{display:flex;gap:6px}.exercise-line{display:grid;grid-template-columns:30px minmax(220px,1fr) 80px 105px 90px 1fr 34px;gap:7px;align-items:center;background:#151515;border:1px solid #242424;border-radius:11px;padding:8px;margin:8px 0}.exercise-line input{width:100%;box-sizing:border-box;background:#0b0b0b;border:1px solid #303030;color:#fff;border-radius:8px;padding:9px}.num{text-align:center;color:#666;font-size:12px}.iconbtn{border:0;border-radius:8px;background:#242424;color:#fff;height:36px;cursor:pointer}.iconbtn.danger{background:#351919;color:#ffb0b0}.status{margin-top:12px;font-size:13px;color:#aaa}.login{max-width:460px;margin:50px auto}.hidden{display:none}.topnav{display:flex;gap:8px;margin-left:auto}.topnav a{color:#888;text-decoration:none;padding:9px 12px;border-radius:9px;font-size:13px}.topnav a:hover{background:#fff;color:#000}.program-list{display:grid;gap:8px}.program-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid #242424;border-radius:12px;background:#101010}.picker{margin-top:14px;background:#0d0d0d;border:1px solid #292929;border-radius:14px;padding:12px}.picker-search{display:grid;grid-template-columns:1fr auto;gap:8px}.picker-search input{background:#080808;border:1px solid #333;color:#fff;border-radius:9px;padding:11px;width:100%;box-sizing:border-box}.picker-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px;max-height:360px;overflow:auto}.picker-item{display:grid;grid-template-columns:54px 1fr auto;gap:9px;align-items:center;background:#151515;border:1px solid #252525;border-radius:10px;padding:7px;cursor:pointer}.picker-item:hover{border-color:#666}.picker-item img{width:54px;height:54px;border-radius:8px;object-fit:cover;background:#080808}.picker-item strong{font-size:13px;line-height:1.25}.picker-item small{display:block;color:#777;font-size:10px;margin-top:4px}.picker-add{border:0;background:#fff;color:#000;border-radius:7px;padding:7px 9px;font-weight:800;cursor:pointer}.empty{color:#777;font-size:13px;padding:15px;text-align:center}.exercise-thumb{width:30px;height:30px;border-radius:7px;object-fit:cover;background:#080808}.exercise-main{display:flex;align-items:center;gap:8px;min-width:0}.exercise-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{display:inline-block;color:#888;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.publish{display:flex;align-items:center;gap:8px;font-size:12px;color:#aaa}.publish input{accent-color:#fff;width:auto}.session-note{width:100%;box-sizing:border-box;background:#0b0b0b;border:1px solid #303030;color:#fff;border-radius:8px;padding:10px;margin-top:9px}.session-empty{border:1px dashed #333;border-radius:10px;padding:18px;color:#777;text-align:center;margin-top:10px}@media(max-width:800px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.picker-list{grid-template-columns:1fr}.exercise-line{grid-template-columns:28px 1fr 1fr}.exercise-line .wide{grid-column:2/-1}.exercise-line .remove{grid-column:3}.program-item{align-items:flex-start;flex-direction:column}.session-head{align-items:stretch;flex-direction:column}.session-tools{justify-content:flex-end}.picker-search{grid-template-columns:1fr}.exercise-main span{white-space:normal}}
</style></head><body><header class="topbar"><div class="brand"><span class="brand-mark">HS</span><div><strong>HS COACHING</strong><small>Éditeur programmes</small></div></div><nav class="topnav"><a href="index.html">Exercices</a><a href="programmes.html">Programmes</a><a href="admin.html">Admin</a></nav></header><main class="container editor"><section id="login" class="panel login"><p class="eyebrow">ESPACE PRIVÉ</p><h1>Programmes.</h1><p class="sub">Construis tes programmes avec ta bibliothèque d’exercices.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field" style="margin-top:12px"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div><div class="btns"><button class="btn primary" id="loginBtn">Se connecter</button></div><div id="loginStatus" class="status"></div></section><section id="app" class="hidden"><div class="panel"><p class="eyebrow">ÉDITEUR</p><h1>Construis ton programme.</h1><p class="sub" id="who"></p></div><div id="listPanel" class="panel"><div class="btns" style="justify-content:space-between;align-items:center"><h2>Mes programmes</h2><button class="btn primary" id="newBtn">+ Nouveau programme</button></div><div id="programList" class="program-list"></div></div><div id="editorPanel" class="panel hidden"><div class="btns" style="justify-content:space-between;align-items:center"><div><p class="eyebrow">PROGRAMME</p><h2 id="editorTitle" style="margin:0">Nouveau programme</h2></div><button class="btn secondary" id="backBtn">← Retour</button></div><div class="form-grid" style="margin-top:18px"><div class="field"><label>Nom</label><input id="p_name"></div><div class="field"><label>Slug</label><input id="p_slug"></div><div class="field"><label>Objectif</label><input id="p_objective" placeholder="Hypertrophie, force…"></div><div class="field"><label>Niveau</label><input id="p_level" placeholder="Débutant, intermédiaire…"></div><div class="field"><label>Durée moyenne (min)</label><input id="p_duration" type="number"></div><div class="field"><label>Catégorie</label><select id="p_category"></select></div><div class="field full"><label>Description</label><textarea id="p_description"></textarea></div><div class="field full"><label>Publication</label><label class="publish"><input id="p_published" type="checkbox"> Publier ce programme côté client</label></div></div><div style="margin-top:28px"><div class="btns" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">Séances</h2><p class="sub">Construis chaque séance séparément.</p></div><button class="btn secondary" id="addSession">+ Ajouter une séance</button></div><div id="sessions"></div></div><div class="btns"><button class="btn primary" id="saveBtn">Enregistrer le programme</button><button class="btn danger hidden" id="deleteBtn">Supprimer</button></div><div id="saveStatus" class="status"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co',SUPABASE_KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let cats=[],exercises=[],programs=[],current=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function adminUser(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return data?user:null}async function boot(){const u=await adminUser();if(!u)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Connecté en tant que '+u.email;await load()}async function load(){let r=await sb.from('categories').select('*').order('name');cats=r.data||[];r=await sb.from('exercises').select('id,name,name_fr,slug,media_url,equipment,muscles').eq('is_published',true).order('name_fr');exercises=r.data||[];r=await sb.from('programs').select('*').order('name');programs=r.data||[];fillCats();renderList()}
function fillCats(){$('p_category').innerHTML=cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}function renderList(){$('programList').innerHTML=programs.map(p=>`<div class="program-item"><div><strong>${esc(p.name)}</strong><br><small>${esc(p.objective||'')} · ${p.is_published?'Publié':'Brouillon'}</small></div><div class="btns" style="margin:0"><button class="btn secondary" onclick="edit(${p.id})">Modifier</button></div></div>`).join('')||'<div class="sub">Aucun programme pour le moment.</div>'}
async function edit(id){current=programs.find(p=>p.id===id);await openEditor()}async function openEditor(){$('listPanel').classList.add('hidden');$('editorPanel').classList.remove('hidden');$('saveStatus').textContent='';$('deleteBtn').classList.toggle('hidden',!current);$('editorTitle').textContent=current?'Modifier le programme':'Nouveau programme';$('p_name').value=current?.name||'';$('p_slug').value=current?.slug||'';$('p_objective').value=current?.objective||'';$('p_level').value=current?.level||'';$('p_duration').value=current?.duration_minutes||'';$('p_description').value=current?.description||'';$('p_published').checked=!!current?.is_published;if(current)$('p_category').value=current.category_id||'';$('sessions').innerHTML='';if(current){const {data}=await sb.from('program_sessions').select('*').eq('program_id',current.id).order('position');for(const s of (data||[])){const {data:items}=await sb.from('program_exercises').select('*').eq('session_id',s.id).order('position');addSession(s,items||[])}}}
function addSession(s={},items=[]){const box=document.createElement('div');box.className='session';box.dataset.id=s.id||'';box.innerHTML=`<div class="session-head"><input class="session-name" value="${esc(s.name||'Séance '+($('sessions').children.length+1))}" placeholder="Nom de la séance"><div class="session-tools"><button class="iconbtn up" title="Monter">↑</button><button class="iconbtn down" title="Descendre">↓</button><button class="iconbtn danger del-session" title="Supprimer">×</button></div></div><textarea class="session-note" placeholder="Note / objectif de la séance (optionnel)">${esc(s.notes||'')}</textarea><div class="picker"><div class="picker-search"><input class="search" placeholder="Rechercher un exercice…"><button class="btn secondary close-picker">Masquer</button></div><div class="picker-list"></div></div><div class="rows"></div><div class="session-empty">Recherche un exercice ci-dessus pour l’ajouter à cette séance.</div>`;const search=box.querySelector('.search');search.oninput=()=>renderPicker(box,search.value);box.querySelector('.close-picker').onclick=()=>box.querySelector('.picker').classList.toggle('hidden');box.querySelector('.del-session').onclick=()=>{if(confirm('Supprimer cette séance ?')){box.remove();renumberSessions()}};box.querySelector('.up').onclick=()=>move(box,-1);box.querySelector('.down').onclick=()=>move(box,1);$('sessions').appendChild(box);items.forEach(x=>addRow(box,x));renderPicker(box,'');renumberSessions()}
function renderPicker(box,q){const list=box.querySelector('.picker-list'),needle=(q||'').trim().toLowerCase();const found=exercises.filter(e=>!needle||[e.name_fr,e.name,e.equipment,...(e.muscles||[])].join(' ').toLowerCase().includes(needle)).slice(0,80);list.innerHTML=found.length?found.map(e=>`<div class="picker-item" data-id="${e.id}"><img src="${esc(e.media_url||'')}" loading="lazy"><div><strong>${esc(e.name_fr||e.name)}</strong><small>${esc(e.equipment||'')} ${e.muscles?.length?'· '+esc(e.muscles.slice(0,2).join(', ')):''}</small></div><button class="picker-add">+ Ajouter</button></div>`).join(''):'<div class="empty">Aucun exercice trouvé.</div>';list.querySelectorAll('.picker-item').forEach(item=>{item.querySelector('.picker-add').onclick=ev=>{ev.stopPropagation();const ex=exercises.find(x=>String(x.id)===item.dataset.id);addRow(box,{exercise_id:ex.id});box.querySelector('.search').value='';renderPicker(box,'')}})}
function addRow(box,x={}){const rows=box.querySelector('.rows');const row=document.createElement('div');row.className='exercise-line';row.dataset.id=x.id||'';const ex=exercises.find(e=>String(e.id)===String(x.exercise_id));row.innerHTML=`<span class="num">${rows.children.length+1}</span><div class="exercise-main"><img class="exercise-thumb" src="${esc(ex?.media_url||'')}" loading="lazy"><span>${esc(ex?.name_fr||ex?.name||'Exercice')}</span></div><input class="sets" placeholder="Séries" value="${esc(x.sets||'')}"><input class="reps" placeholder="Reps / durée" value="${esc(x.reps||'')}"><input class="rest" placeholder="Repos" value="${esc(x.rest||'')}"><input class="notes wide" placeholder="Note / consigne" value="${esc(x.notes||'')}"><button class="iconbtn danger remove">×</button><input type="hidden" class="ex-id" value="${x.exercise_id||''}">`;row.querySelector('.remove').onclick=()=>{row.remove();renumberRows(box)};rows.appendChild(row);box.querySelector('.session-empty').style.display='none';renumberRows(box)}function renumberRows(box){[...box.querySelector('.rows').children].forEach((r,i)=>r.querySelector('.num').textContent=i+1)}function renumberSessions(){[...$('sessions').children].forEach((s,i)=>s.querySelector('.session-name').placeholder='Séance '+(i+1))}function move(el,dir){const parent=el.parentElement,index=[...parent.children].indexOf(el),target=dir<0?parent.children[index-1]:parent.children[index+1];if(!target)return;dir<0?parent.insertBefore(el,target):parent.insertBefore(target,el);renumberSessions()}
async function save(){const name=$('p_name').value.trim();if(!name){$('saveStatus').textContent='Indique un nom de programme.';return}const slug=$('p_slug').value.trim()||name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const payload={name,slug,objective:$('p_objective').value.trim()||null,level:$('p_level').value.trim()||null,duration_minutes:Number($('p_duration').value)||null,category_id:Number($('p_category').value)||null,description:$('p_description').value.trim()||null,is_published:$('p_published').checked};let r=current?await sb.from('programs').update(payload).eq('id',current.id).select().single():await sb.from('programs').insert(payload).select().single();if(r.error){$('saveStatus').textContent=r.error.message;return}const pid=r.data.id;if(current){await sb.from('program_exercises').delete().eq('program_id',pid);await sb.from('program_sessions').delete().eq('program_id',pid)}for(let si=0;si<$('sessions').children.length;si++){const box=$('sessions').children[si];const sr=await sb.from('program_sessions').insert({program_id:pid,name:box.querySelector('.session-name').value.trim()||'Séance '+(si+1),position:si+1,notes:box.querySelector('.session-note').value.trim()||null}).select().single();if(sr.error){$('saveStatus').textContent=sr.error.message;return}const sid=sr.data.id;const rows=[...box.querySelector('.rows').children].map((row,i)=>({program_id:pid,session_id:sid,exercise_id:Number(row.querySelector('.ex-id').value),position:i+1,sets:row.querySelector('.sets').value.trim()||null,reps:row.querySelector('.reps').value.trim()||null,rest:row.querySelector('.rest').value.trim()||null,notes:row.querySelector('.notes').value.trim()||null})).filter(x=>x.exercise_id);if(rows.length){const ir=await sb.from('program_exercises').insert(rows);if(ir.error){$('saveStatus').textContent=ir.error.message;return}}}$('saveStatus').textContent='Programme enregistré ✓';await load();current=programs.find(p=>p.id===pid)||r.data;setTimeout(openEditor,250)}
async function removeProgram(){if(!current||!confirm('Supprimer définitivement ce programme ?'))return;let r=await sb.from('programs').delete().eq('id',current.id);if(r.error){$('saveStatus').textContent=r.error.message;return}current=null;await load();back()}function back(){$('editorPanel').classList.add('hidden');$('listPanel').classList.remove('hidden');current=null}$('loginBtn').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginStatus').textContent=r.error?r.error.message:'Connexion…';if(!r.error)boot()};$('newBtn').onclick=()=>{current=null;openEditor()};$('addSession').onclick=()=>addSession();$('saveBtn').onclick=save;$('deleteBtn').onclick=removeProgram;$('backBtn').onclick=back;boot();
</script></body></html>
