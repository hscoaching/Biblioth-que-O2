<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HS Coaching — Éditeur de programmes</title><link rel="stylesheet" href="style.css"><style>.editor{padding:35px 0 90px}.panel{background:#141414;border:1px solid #292929;border-radius:18px;padding:22px;margin:18px 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#777;text-transform:uppercase}.field input,.field textarea,.field select{background:#0d0d0d;border:1px solid #303030;color:#fff;border-radius:10px;padding:12px;font:inherit}.field textarea{min-height:100px}.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#000}.secondary{background:#242424;color:#fff}.danger{background:#351919;color:#ffb0b0}.hidden{display:none}.status{margin-top:12px;color:#aaa;font-size:13px}.login{max-width:460px;margin:50px auto}.topnav{display:flex;gap:8px;margin-left:auto}.topnav a{color:#888;text-decoration:none;padding:9px 12px}.program-list{display:grid;gap:8px}.program-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid #242424;border-radius:12px;background:#101010}.session{background:#101010;border:1px solid #292929;border-radius:16px;padding:16px;margin:16px 0}.session-head{display:flex;gap:10px;align-items:center}.session-head input{flex:1;background:#0b0b0b;border:1px solid #303030;color:#fff;border-radius:9px;padding:10px;font-weight:800}.session-tools{display:flex;gap:6px;flex-wrap:wrap}.session-note{width:100%;box-sizing:border-box;background:#0b0b0b;border:1px solid #303030;color:#fff;border-radius:8px;padding:10px;margin-top:9px}.picker{margin-top:14px;background:#0d0d0d;border:1px solid #292929;border-radius:14px;padding:12px}.picker-search{display:grid;grid-template-columns:1fr auto;gap:8px}.picker-search input{background:#080808;border:1px solid #333;color:#fff;border-radius:9px;padding:11px;width:100%;box-sizing:border-box}.picker-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:10px;max-height:360px;overflow:auto}.picker-item{display:grid;grid-template-columns:54px 1fr auto;gap:9px;align-items:center;background:#151515;border:1px solid #252525;border-radius:10px;padding:7px}.picker-item img{width:54px;height:54px;border-radius:8px;object-fit:cover;background:#080808}.picker-item strong{font-size:13px}.picker-item small{display:block;color:#777;font-size:10px}.picker-add{border:0;background:#fff;color:#000;border-radius:7px;padding:7px 9px;font-weight:800}.exercise-line{display:grid;grid-template-columns:24px 30px minmax(180px,1fr) 65px 95px 80px 105px 110px 30px;gap:7px;align-items:center;background:#151515;border:1px solid #242424;border-radius:11px;padding:8px;margin:8px 0}.exercise-line.dragging{opacity:.4}.exercise-line input,.exercise-line select{width:100%;box-sizing:border-box;background:#0b0b0b;border:1px solid #303030;color:#fff;border-radius:8px;padding:9px}.drag{cursor:grab;color:#777;text-align:center}.num{text-align:center;color:#666;font-size:12px}.exercise-main{display:flex;align-items:center;gap:8px;min-width:0}.exercise-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.exercise-thumb{width:30px;height:30px;border-radius:7px;object-fit:cover}.iconbtn{border:0;border-radius:8px;background:#242424;color:#fff;height:36px;cursor:pointer}.session-empty{border:1px dashed #333;border-radius:10px;padding:18px;color:#777;text-align:center;margin-top:10px}.publish{display:flex;align-items:center;gap:8px;color:#aaa;font-size:12px}@media(max-width:800px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.picker-list{grid-template-columns:1fr}.exercise-line{grid-template-columns:25px 30px 1fr 1fr}.exercise-line .notes{grid-column:3/-1}.program-item{align-items:flex-start;flex-direction:column}.session-head{align-items:stretch;flex-direction:column}.picker-search{grid-template-columns:1fr}.exercise-main span{white-space:normal}.drag{display:none}}</style></head><body><header class="topbar"><div class="brand"><span class="brand-mark">HS</span><div><strong>HS COACHING</strong><small>Éditeur programmes</small></div></div><nav class="topnav"><a href="index.html">Exercices</a><a href="programmes.html">Programmes</a><a href="admin.html">Admin</a></nav></header><main class="container editor"><section id="login" class="panel login"><p>ESPACE PRIVÉ</p><h1>Programmes.</h1><p>Construis tes programmes avec ta bibliothèque d’exercices.</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Mot de passe</label><input id="password" type="password"></div><div class="btns"><button class="btn primary" id="loginBtn">Se connecter</button></div><div id="loginStatus" class="status"></div></section><section id="app" class="hidden"><div class="panel"><p>ÉDITEUR</p><h1>Construis ton programme.</h1><p id="who"></p></div><div id="listPanel" class="panel"><div class="btns" style="justify-content:space-between"><h2>Mes programmes</h2><button class="btn primary" id="newBtn">+ Nouveau programme</button></div><div id="programList" class="program-list"></div></div><div id="editorPanel" class="panel hidden"><div class="btns" style="justify-content:space-between"><h2 id="editorTitle">Nouveau programme</h2><button class="btn secondary" id="backBtn">← Retour</button></div><div class="form-grid"><div class="field"><label>Nom</label><input id="p_name"></div><div class="field"><label>Slug</label><input id="p_slug"></div><div class="field"><label>Objectif</label><input id="p_objective"></div><div class="field"><label>Niveau</label><input id="p_level"></div><div class="field"><label>Durée moyenne</label><input id="p_duration" type="number"></div><div class="field"><label>Catégorie</label><select id="p_category"></select></div><div class="field full"><label>Description</label><textarea id="p_description"></textarea></div><div class="field full"><label>Publication</label><label class="publish"><input id="p_published" type="checkbox"> Publier côté client</label></div></div><div class="btns" style="justify-content:space-between"><h2>Séances</h2><button class="btn secondary" id="addSession">+ Ajouter une séance</button></div><div id="sessions"></div><div class="btns"><button class="btn primary" id="saveBtn">Enregistrer</button><button class="btn danger hidden" id="deleteBtn">Supprimer</button></div><div id="saveStatus" class="status"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U='https://hcjoagpkgpqxgzjdyfvd.supabase.co',K='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',sb=window.supabase.createClient(U,K);let cats=[],exercises=[],programs=[],current=null;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function user(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return data?user:null}async function load(){let r=await sb.from('categories').select('*').order('name');cats=r.data||[];r=await sb.from('exercises').select('id,name,name_fr,slug,media_url,equipment,muscles').eq('is_published',true).order('name_fr');exercises=r.data||[];r=await sb.from('programs').select('*').order('name');programs=r.data||[];$('p_category').innerHTML=cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');renderList()}function renderList(){$('programList').innerHTML=programs.map(p=>`<div class="program-item"><div><b>${esc(p.name)}</b><br><small>${esc(p.objective||'')} · ${p.is_published?'Publié':'Brouillon'}</small></div><div class="btns" style="margin:0"><button class="btn secondary" onclick="edit(${p.id})">Modifier</button><button class="btn secondary" onclick="dupProgram(${p.id})">Dupliquer</button></div></div>`).join('')||'<p>Aucun programme.</p>'}
async function openEditor(){ $('listPanel').classList.add('hidden');$('editorPanel').classList.remove('hidden');$('deleteBtn').classList.toggle('hidden',!current);$('editorTitle').textContent=current?'Modifier le programme':'Nouveau programme';$('p_name').value=current?.name||'';$('p_slug').value=current?.slug||'';$('p_objective').value=current?.objective||'';$('p_level').value=current?.level||'';$('p_duration').value=current?.duration_minutes||'';$('p_description').value=current?.description||'';$('p_published').checked=!!current?.is_published;$('sessions').innerHTML='';if(current){$('p_category').value=current.category_id||'';const {data:ss}=await sb.from('program_sessions').select('*').eq('program_id',current.id).order('position');for(const s of ss||[]){const {data:rr}=await sb.from('program_exercises').select('*').eq('session_id',s.id).order('position');addSession(s,rr||[])}}}
function groupOptions(v){return `<option value="">Solo</option><option value="S:A" ${v==='S:A'?'selected':''}>Superset A</option><option value="S:B" ${v==='S:B'?'selected':''}>Superset B</option><option value="S:C" ${v==='S:C'?'selected':''}>Superset C</option><option value="C:A" ${v==='C:A'?'selected':''}>Circuit A</option><option value="C:B" ${v==='C:B'?'selected':''}>Circuit B</option>`}
function addSession(s={},items=[]){const b=document.createElement('div');b.className='session';b.innerHTML=`<div class="session-head"><input class="session-name" value="${esc(s.name||'Séance '+($('sessions').children.length+1))}"><div class="session-tools"><button class="iconbtn up">↑</button><button class="iconbtn down">↓</button><button class="iconbtn duplicate-session">Dupliquer</button><button class="iconbtn danger del-session">×</button></div></div><textarea class="session-note" placeholder="Note / objectif">${esc(s.notes||'')}</textarea><div class="picker"><div class="picker-search"><input class="search" placeholder="Rechercher un exercice…"><button class="btn secondary close">Masquer</button></div><div class="picker-list"></div></div><div class="rows"></div><div class="session-empty">Recherche un exercice ci-dessus pour l’ajouter.</div>`;const q=b.querySelector('.search');q.oninput=()=>picker(b,q.value);b.querySelector('.close').onclick=()=>b.querySelector('.picker').classList.toggle('hidden');b.querySelector('.del-session').onclick=()=>b.remove();b.querySelector('.up').onclick=()=>move(b,-1);b.querySelector('.down').onclick=()=>move(b,1);b.querySelector('.duplicate-session').onclick=()=>dupSession(b);$('sessions').appendChild(b);items.forEach(x=>addRow(b,x));picker(b,'')}
function picker(b,q){const n=(q||'').toLowerCase().trim(),a=exercises.filter(e=>!n||[e.name_fr,e.name,e.equipment,...(e.muscles||[])].join(' ').toLowerCase().includes(n)).slice(0,80),l=b.querySelector('.picker-list');l.innerHTML=a.length?a.map((e,i)=>`<div class="picker-item"><img src="${esc(e.media_url||'')}"><div><strong>${esc(e.name_fr||e.name)}</strong><small>${esc(e.equipment||'')}</small></div><button class="picker-add" data-i="${i}">+</button></div>`).join(''):'<div class="empty">Aucun exercice.</div>';l.querySelectorAll('.picker-add').forEach(x=>x.onclick=()=>{addRow(b,{exercise_id:a[+x.dataset.i].id});q.value='';picker(b,'')})}
function addRow(b,x={}){const r=document.createElement('div'),rows=b.querySelector('.rows'),e=exercises.find(e=>String(e.id)===String(x.exercise_id));r.className='exercise-line';r.draggable=true;r.innerHTML=`<span class="drag">⋮⋮</span><span class="num"></span><div class="exercise-main"><img class="exercise-thumb" src="${esc(e?.media_url||'')}"><span>${esc(e?.name_fr||e?.name||'Exercice')}</span></div><input class="sets" placeholder="Séries" value="${esc(x.sets||'')}"><input class="reps" placeholder="Reps / durée" value="${esc(x.reps||'')}"><input class="rest" placeholder="Repos" value="${esc(x.rest||'')}"><select class="group">${groupOptions(x.group_key||'')}</select><input class="notes" placeholder="Note / consigne" value="${esc(x.notes||'')}"><button class="iconbtn duplicate-row">+</button><button class="iconbtn danger remove">×</button><input class="ex-id" type="hidden" value="${x.exercise_id||''}">`;r.querySelector('.remove').onclick=()=>{r.remove();nums(b)};r.querySelector('.duplicate-row').onclick=()=>dupRow(r,b);r.addEventListener('dragstart',()=>r.classList.add('dragging'));r.addEventListener('dragend',()=>{r.classList.remove('dragging');nums(b)});r.addEventListener('dragover',ev=>{ev.preventDefault();const d=b.querySelector('.dragging');if(!d||d===r)return;const z=r.getBoundingClientRect();b.querySelector('.rows').insertBefore(d,ev.clientY<z.top+z.height/2?r:r.nextSibling)});rows.appendChild(r);b.querySelector('.session-empty').style.display='none';nums(b)}function nums(b){[...b.querySelector('.rows').children].forEach((r,i)=>r.querySelector('.num').textContent=i+1)}function move(e,d){const p=e.parentElement,i=[...p.children].indexOf(e),t=d<0?p.children[i-1]:p.children[i+1];if(t)d<0?p.insertBefore(e,t):p.insertBefore(t,e)}function dataRow(r){return{exercise_id:+r.querySelector('.ex-id').value,sets:r.querySelector('.sets').value,reps:r.querySelector('.reps').value,rest:r.querySelector('.rest').value,group_key:r.querySelector('.group').value,notes:r.querySelector('.notes').value}}
function dupRow(r,b){addRow(b,dataRow(r))}function dupSession(b){const a=[...b.querySelector('.rows').children].map(dataRow);addSession({name:(b.querySelector('.session-name').value||'Séance')+' — copie',notes:b.querySelector('.session-note').value},a)}
async function dupProgram(id){const p=programs.find(x=>x.id===id);if(!p||!confirm('Dupliquer ce programme ?'))return;let r=await sb.from('programs').insert({name:p.name+' — copie',slug:(p.slug||'programme')+'-copie-'+Date.now(),objective:p.objective,level:p.level,duration_minutes:p.duration_minutes,category_id:p.category_id,description:p.description,is_published:false}).select().single();if(r.error)return alert(r.error.message);const {data:ss}=await sb.from('program_sessions').select('*').eq('program_id',id).order('position');for(const s of ss||[]){let sr=await sb.from('program_sessions').insert({program_id:r.data.id,name:s.name,position:s.position,notes:s.notes}).select().single();const {data:rr}=await sb.from('program_exercises').select('*').eq('session_id',s.id).order('position');if(rr?.length)await sb.from('program_exercises').insert(rr.map(x=>({program_id:r.data.id,session_id:sr.data.id,exercise_id:x.exercise_id,position:x.position,sets:x.sets,reps:x.reps,rest:x.rest,notes:x.notes,group_key:x.group_key})))}await load()}
async function save(){const name=$('p_name').value.trim();if(!name)return $('saveStatus').textContent='Indique un nom de programme.';const slug=$('p_slug').value.trim()||name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const p={name,slug,objective:$('p_objective').value.trim()||null,level:$('p_level').value.trim()||null,duration_minutes:+$('p_duration').value||null,category_id:+$('p_category').value||null,description:$('p_description').value.trim()||null,is_published:$('p_published').checked};let r=current?await sb.from('programs').update(p).eq('id',current.id).select().single():await sb.from('programs').insert(p).select().single();if(r.error)return $('saveStatus').textContent=r.error.message;const pid=r.data.id;if(current){await sb.from('program_exercises').delete().eq('program_id',pid);await sb.from('program_sessions').delete().eq('program_id',pid)}for(let i=0;i<$('sessions').children.length;i++){const b=$('sessions').children[i],sr=await sb.from('program_sessions').insert({program_id:pid,name:b.querySelector('.session-name').value.trim()||'Séance '+(i+1),position:i+1,notes:b.querySelector('.session-note').value.trim()||null}).select().single();if(sr.error)return $('saveStatus').textContent=sr.error.message;const rr=[...b.querySelector('.rows').children].map((x,j)=>{const d=dataRow(x);return{program_id:pid,session_id:sr.data.id,exercise_id:d.exercise_id,position:j+1,sets:d.sets||null,reps:d.reps||null,rest:d.rest||null,notes:d.notes||null,group_key:d.group_key||null}}).filter(x=>x.exercise_id);if(rr.length){const er=await sb.from('program_exercises').insert(rr);if(er.error)return $('saveStatus').textContent=er.error.message}}$('saveStatus').textContent='Programme enregistré ✓';await load();current=programs.find(x=>x.id===pid)||r.data}
async function removeProgram(){if(!current||!confirm('Supprimer définitivement ce programme ?'))return;const r=await sb.from('programs').delete().eq('id',current.id);if(r.error)return $('saveStatus').textContent=r.error.message;current=null;await load();back()}function back(){$('editorPanel').classList.add('hidden');$('listPanel').classList.remove('hidden');current=null}async function start(){const u=await user();if(!u)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Connecté en tant que '+u.email;await load()}$('loginBtn').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginStatus').textContent=r.error?r.error.message:'Connexion…';if(!r.error)start()};$('newBtn').onclick=()=>{current=null;openEditor()};$('addSession').onclick=()=>addSession();$('saveBtn').onclick=save;$('deleteBtn').onclick=removeProgram;$('backBtn').onclick=back;start();
</script></body></html>
