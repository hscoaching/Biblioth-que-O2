<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HS Coaching — Éditeur de programmes</title><link rel="stylesheet" href="style.css"><style>
.editor{padding:35px 0 90px}.editor h1{font-size:clamp(40px,7vw,64px);letter-spacing:-3px;margin:8px 0}.sub{color:#888;line-height:1.5}.panel{background:#141414;border:1px solid #292929;border-radius:18px;padding:22px;margin:18px 0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{background:#0d0d0d;border:1px solid #303030;color:#fff;border-radius:10px;padding:12px;font:inherit}.field textarea{min-height:100px;resize:vertical}.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#000}.secondary{background:#242424;color:#fff}.danger{background:#351919;color:#ffb0b0}.session{background:#101010;border:1px solid #292929;border-radius:16px;padding:16px;margin:16px 0}.session-head{display:flex;gap:10px;align-items:center}.session-head input{flex:1;background:#0b0b0b;border:1px solid #303030;color:#fff;border-radius:9px;padding:10px;font-weight:800}.exercise-line{display:grid;grid-template-columns:30px minmax(180px,1fr) 80px 100px 90px 1fr 34px;gap:7px;align-items:center;background:#151515;border:1px solid #242424;border-radius:11px;padding:8px;margin:8px 0}.exercise-line input,.exercise-line select{width:100%;box-sizing:border-box;background:#0b0b0b;border:1px solid #303030;color:#fff;border-radius:8px;padding:9px}.num{text-align:center;color:#666;font-size:12px}.iconbtn{border:0;border-radius:8px;background:#242424;color:#fff;height:36px;cursor:pointer}.iconbtn.danger{background:#351919;color:#ffb0b0}.status{margin-top:12px;font-size:13px;color:#aaa}.login{max-width:460px;margin:50px auto}.hidden{display:none}.topnav{display:flex;gap:8px;margin-left:auto}.topnav a{color:#888;text-decoration:none;padding:9px 12px;border-radius:9px;font-size:13px}.topnav a:hover{background:#fff;color:#000}.program-list{display:grid;gap:8px}.program-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid #242424;border-radius:12px;background:#101010}@media(max-width:800px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.exercise-line{grid-template-columns:28px 1fr 1fr}.exercise-line .wide{grid-column:2/-1}.exercise-line .remove{grid-column:3}.program-item{align-items:flex-start;flex-direction:column}.session-head{align-items:stretch;flex-direction:column}}
</style></head><body><header class="topbar"><div class="brand"><span class="brand-mark">HS</span><div><strong>HS COACHING</strong><small>Éditeur programmes</small></div></div><nav class="topnav"><a href="index.html">Exercices</a><a href="programmes.html">Programmes</a><a href="admin.html">Admin</a></nav></header><main class="container editor">
<section id="login" class="panel login"><p class="eyebrow">ESPACE PRIVÉ</p><h1>Programmes.</h1><p class="sub">Connecte-toi pour construire tes programmes.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field" style="margin-top:12px"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div><div class="btns"><button class="btn primary" id="loginBtn">Se connecter</button></div><div id="loginStatus" class="status"></div></section>
<section id="app" class="hidden"><div class="panel"><p class="eyebrow">ÉDITEUR</p><h1>Construis ton programme.</h1><p class="sub" id="who"></p></div><div id="listPanel" class="panel"><div class="btns" style="justify-content:space-between;align-items:center"><h2>Mes programmes</h2><button class="btn primary" id="newBtn">+ Nouveau programme</button></div><div id="programList" class="program-list"></div></div>
<div id="editorPanel" class="panel hidden"><div class="btns" style="justify-content:space-between;align-items:center"><div><p class="eyebrow">PROGRAMME</p><h2 id="editorTitle" style="margin:0">Nouveau programme</h2></div><button class="btn secondary" id="backBtn">← Retour</button></div>
<div class="form-grid" style="margin-top:18px"><div class="field"><label>Nom</label><input id="p_name"></div><div class="field"><label>Slug</label><input id="p_slug"></div><div class="field"><label>Objectif</label><input id="p_objective" placeholder="Hypertrophie, force…"></div><div class="field"><label>Niveau</label><input id="p_level" placeholder="Débutant, intermédiaire…"></div><div class="field"><label>Durée moyenne (min)</label><input id="p_duration" type="number"></div><div class="field"><label>Catégorie</label><select id="p_category"></select></div><div class="field full"><label>Description</label><textarea id="p_description"></textarea></div></div>
<div style="margin-top:28px"><div class="btns" style="justify-content:space-between;align-items:center"><div><h2 style="margin:0">Séances</h2><p class="sub">Crée autant de séances que nécessaire puis ajoute tes exercices dans chacune.</p></div><button class="btn secondary" id="addSession">+ Ajouter une séance</button></div><div id="sessions"></div></div>
<div class="btns"><button class="btn primary" id="saveBtn">Enregistrer le programme</button><button class="btn danger hidden" id="deleteBtn">Supprimer</button></div><div id="saveStatus" class="status"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co',SUPABASE_KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let cats=[],exercises=[],programs=[],current=null,sessions=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function adminUser(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return data?user:null}
async function boot(){const u=await adminUser();if(!u)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Connecté en tant que '+u.email;await load()}
async function load(){let r=await sb.from('categories').select('*').order('name');cats=r.data||[];r=await sb.from('exercises').select('id,name,name_fr,slug').order('name_fr');exercises=r.data||[];r=await sb.from('programs').select('*').order('name');programs=r.data||[];fillCats();renderList()}
function fillCats(){ $('p_category').innerHTML=cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('') }
function renderList(){ $('programList').innerHTML=programs.map(p=>`<div class="program-item"><div><strong>${esc(p.name)}</strong><br><small>${esc(p.objective||'')} · ${p.is_published?'Publié':'Brouillon'}</small></div><div class="btns" style="margin:0"><button class="btn secondary" onclick="edit(${p.id})">Modifier</button></div></div>`).join('')||'<div class="sub">Aucun programme pour le moment.</div>' }
async function edit(id){current=programs.find(p=>p.id===id);await openEditor()}
async function openEditor(){ $('listPanel').classList.add('hidden');$('editorPanel').classList.remove('hidden');$('saveStatus').textContent='';$('deleteBtn').classList.toggle('hidden',!current);$('editorTitle').textContent=current?'Modifier le programme':'Nouveau programme';$('p_name').value=current?.name||'';$('p_slug').value=current?.slug||'';$('p_objective').value=current?.objective||'';$('p_level').value=current?.level||'';$('p_duration').value=current?.duration_minutes||'';$('p_description').value=current?.description||'';$('p_category').value=current?.category_id||cats[0]?.id||'';$('sessions').innerHTML='';sessions=[];if(current){let r=await sb.from('program_sessions').select('*').eq('program_id',current.id).order('position');for(const s of (r.data||[])){const x={...s,exercises:[]};const er=await sb.from('program_exercises').select('*').eq('session_id',s.id).order('position');x.exercises=er.data||[];sessions.push(x)}}if(!sessions.length)addSession('Séance 1');else renderSessions()}
function addSession(name){sessions.push({id:null,name:name||`Séance ${sessions.length+1}`,position:sessions.length+1,notes:'',exercises:[]});renderSessions()}
function renderSessions(){ $('sessions').innerHTML=sessions.map((s,si)=>`<div class="session" data-si="${si}"><div class="session-head"><input class="sname" value="${esc(s.name)}" placeholder="Nom de la séance"><div class="btns" style="margin:0"><button class="iconbtn" onclick="moveSession(${si},-1)">↑</button><button class="iconbtn" onclick="moveSession(${si},1)">↓</button><button class="iconbtn danger" onclick="removeSession(${si})">×</button></div></div><div class="btns"><button class="btn secondary add-ex" onclick="addExercise(${si})">+ Ajouter un exercice</button></div><div class="rows">${s.exercises.map((x,ei)=>rowHtml(si,ei,x)).join('')}</div></div>`).join('')}
function rowHtml(si,ei,x){const label=x.exercise_id?((exercises.find(e=>e.id===x.exercise_id)?.name_fr||exercises.find(e=>e.id===x.exercise_id)?.name)||'Exercice'):'';return `<div class="exercise-line" data-ei="${ei}"><span class="num">${ei+1}</span><select class="ex" onchange="setExercise(${si},${ei},this.value)"><option value="">Choisir un exercice…</option>${exercises.map(e=>`<option value="${e.id}" ${String(e.id)===String(x.exercise_id)?'selected':''}>${esc(e.name_fr||e.name)}</option>`).join('')}</select><input class="sets" placeholder="Séries" value="${esc(x.sets||'')}"><input class="reps" placeholder="Reps / durée" value="${esc(x.reps||'')}"><input class="rest" placeholder="Repos" value="${esc(x.rest||'')}"><input class="notes wide" placeholder="Note / consigne" value="${esc(x.notes||'')}"><button class="iconbtn danger remove" onclick="removeExercise(${si},${ei})">×</button></div>`}
function syncRows(si){const box=document.querySelector(`.session[data-si="${si}"]`);if(!box)return;[...box.querySelectorAll('.exercise-line')].forEach((r,i)=>{const x=sessions[si].exercises[i];x.sets=r.querySelector('.sets').value;x.reps=r.querySelector('.reps').value;x.rest=r.querySelector('.rest').value;x.notes=r.querySelector('.notes').value;x.position=i+1})}
function setExercise(si,ei,v){syncRows(si);sessions[si].exercises[ei].exercise_id=Number(v)||null}
function addExercise(si){syncRows(si);sessions[si].exercises.push({exercise_id:null,sets:'',reps:'',rest:'',notes:'',position:sessions[si].exercises.length+1});renderSessions()}
function removeExercise(si,ei){syncRows(si);sessions[si].exercises.splice(ei,1);renderSessions()}
function removeSession(si){if(sessions.length===1){alert('Un programme doit contenir au moins une séance.');return}syncRows(si);sessions.splice(si,1);sessions.forEach((s,i)=>s.position=i+1);renderSessions()}
function moveSession(si,dir){syncRows(si);const to=si+dir;if(to<0||to>=sessions.length)return;[sessions[si],sessions[to]]=[sessions[to],sessions[si]];sessions.forEach((s,i)=>s.position=i+1);renderSessions()}
async function save(){for(let i=0;i<sessions.length;i++)syncRows(i);const name=$('p_name').value.trim();if(!name){$('saveStatus').textContent='Indique un nom de programme.';return}const slug=$('p_slug').value.trim()||name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const payload={name,slug,objective:$('p_objective').value.trim()||null,level:$('p_level').value.trim()||null,duration_minutes:Number($('p_duration').value)||null,category_id:Number($('p_category').value)||null,description:$('p_description').value.trim()||null};let r=current?await sb.from('programs').update(payload).eq('id',current.id).select().single():await sb.from('programs').insert(payload).select().single();if(r.error){$('saveStatus').textContent=r.error.message;return}const pid=r.data.id;if(current){await sb.from('program_sessions').delete().eq('program_id',pid)}for(let si=0;si<sessions.length;si++){const s=sessions[si];let sr=await sb.from('program_sessions').insert({program_id:pid,name:s.name.trim()||`Séance ${si+1}`,position:si+1,notes:s.notes||null}).select().single();if(sr.error){$('saveStatus').textContent=sr.error.message;return}const rows=s.exercises.filter(x=>x.exercise_id).map((x,i)=>({program_id:pid,session_id:sr.data.id,exercise_id:Number(x.exercise_id),position:i+1,sets:x.sets?.trim()||null,reps:x.reps?.trim()||null,rest:x.rest?.trim()||null,notes:x.notes?.trim()||null}));if(rows.length){let ir=await sb.from('program_exercises').insert(rows);if(ir.error){$('saveStatus').textContent=ir.error.message;return}}}$('saveStatus').textContent='Programme enregistré ✓';await load();current=programs.find(p=>p.id===pid)||r.data;setTimeout(openEditor,250)}
async function removeProgram(){if(!current||!confirm('Supprimer définitivement ce programme ?'))return;let r=await sb.from('programs').delete().eq('id',current.id);if(r.error){$('saveStatus').textContent=r.error.message;return}current=null;await load();back()}
function back(){$('editorPanel').classList.add('hidden');$('listPanel').classList.remove('hidden');current=null}
$('loginBtn').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginStatus').textContent=r.error?r.error.message:'Connexion…';if(!r.error)boot()};$('newBtn').onclick=()=>{current=null;openEditor()};$('addSession').onclick=()=>addSession();$('saveBtn').onclick=save;$('deleteBtn').onclick=removeProgram;$('backBtn').onclick=back;boot();
</script></body></html>
