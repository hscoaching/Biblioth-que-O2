<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><title>HS Coaching — Ma progression</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:560px;margin:auto;padding:22px 18px}.head{margin-bottom:16px}.k{font-size:9px;letter-spacing:1.6px;color:#666;font-weight:900}.head h1{font-size:25px;margin:4px 0}.program-name{font-size:11px;color:#999}.card{background:#141414;border:1px solid #292929;border-radius:15px;padding:15px;margin-bottom:10px}.empty{text-align:center;color:#888;font-size:11px;line-height:1.6;padding:28px 12px}.select{width:100%;border:1px solid #292929;background:#101010;color:#fff;border-radius:9px;padding:11px;font-size:11px}.main{display:flex;justify-content:space-between;gap:10px}.name{font-size:13px;font-weight:900}.sub{font-size:9px;color:#666;margin-top:4px}.value{font-size:20px;font-weight:900}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.stat{background:#101010;border:1px solid #292929;border-radius:10px;padding:10px}.stat span{display:block;color:#666;font-size:8px;text-transform:uppercase}.stat strong{display:block;margin-top:4px;font-size:12px}.chart{height:110px;display:flex;align-items:flex-end;gap:6px;margin-top:16px;padding:8px 2px 0;border-bottom:1px solid #292929}.bar{flex:1;min-width:8px;background:#555;border-radius:4px 4px 0 0;position:relative}.bar:last-child{background:#fff}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:7px;color:#777;white-space:nowrap;margin-bottom:4px}.history-row{padding:12px;border:1px solid #252525;border-radius:11px;background:#101010;margin-top:7px;cursor:pointer}.history-row strong{font-size:11px}.history-row div{font-size:9px;color:#777;margin-top:4px}.history-row small{display:block;color:#555;font-size:8px;margin-top:6px}.detail{position:fixed;inset:0;background:#0b0b0b;z-index:1000;display:none;overflow:auto}.detail.show{display:block}.detail-inner{max-width:560px;margin:auto;padding:18px}.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.detail-head h2{font-size:20px;margin:4px 0}.close{width:40px;height:40px;border-radius:50%;border:1px solid #444;background:#171717;color:#fff;font-size:24px;cursor:pointer}.exercise{background:#141414;border:1px solid #292929;border-radius:14px;padding:13px;margin-bottom:9px}.exercise-title{font-size:12px;font-weight:900;margin-bottom:9px}.set-row{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;margin-top:5px}.set-row span{background:#101010;border:1px solid #242424;border-radius:8px;padding:9px 4px;text-align:center;font-size:9px;color:#777}.set-row strong{background:#101010;border:1px solid #242424;border-radius:8px;padding:9px 4px;text-align:center;font-size:10px}.back-program{width:100%;margin-top:8px;min-height:44px;border:1px solid #333;border-radius:10px;background:#171717;color:#fff;font-size:11px;font-weight:900}</style></head><body><main class="wrap"><header class="head"><div class="k">SUIVI PERSONNEL</div><h1>Ma progression</h1><div id="programName" class="program-name"></div></header><div id="app"><section class="card empty">Chargement de ta progression…</section></div></main><div id="detail" class="detail"><div class="detail-inner"><div class="detail-head"><div><div class="k">SÉANCE TERMINÉE</div><h2 id="detailTitle"></h2><div id="detailMeta" class="program-name"></div></div><button class="close" type="button" onclick="closeDetail()">×</button></div><div id="detailBody"></div><button class="back-program" type="button" onclick="closeDetail()">Retour</button></div></div><script>(function(){const KEY='hs_workout_history_v1',app=document.getElementById('app'),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function read(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}function closeDetail(){document.getElementById('detail').classList.remove('show')}function sessionCard(s,i){const d=s&&s.date?new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}):'Date inconnue';const ex=Array.isArray(s&&s.exercises)?s.exercises.length:0;return '<div class="history-row" onclick="openDetail('+i+')"><strong>'+esc(s&&s.session_name||'Séance')+'</strong><div>'+d+' · '+esc(s&&s.duration_minutes||0)+' min</div><small>'+ex+' exercice'+(ex>1?'s':'')+' · Appuie pour voir le détail →</small></div>'}window.openDetail=function(i){const s=window.__sessions[i];if(!s)return;document.getElementById('detailTitle').textContent=s.session_name||'Séance';const d=s.date?new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}):'Date inconnue';document.getElementById('detailMeta').textContent=d+' · '+(Number(s.duration_minutes)||0)+' min';const ex=Array.isArray(s.exercises)?s.exercises:[];document.getElementById('detailBody').innerHTML=ex.map(e=>{const sets=Array.isArray(e&&e.sets)?e.sets:[];return '<section class="exercise"><div class="exercise-title">'+esc(e&&e.name||'Exercice')+'</div>'+sets.map((x,n)=>'<div class="set-row"><span>S'+(n+1)+'</span><strong>'+((Number(x&&x.load)||0)>0?(Number(x.load)||0)+' kg':'—')+'</strong><strong>'+((Number(x&&x.reps)||0)>0?(Number(x.reps)||0)+' reps':'—')+'</strong></div>').join('')+'</section>'}).join('')||'<section class="card empty">Aucune donnée détaillée enregistrée pour cette séance.</section>';document.getElementById('detail').classList.add('show')};function render(){const p=new URLSearchParams(location.search),program=p.get('program')||'';document.getElementById('programName').textContent=program?'Programme : '+program:'';const all=read(),history=program?all.filter(s=>String(s&&s.program_name||'').trim()===String(program).trim()):all;window.__sessions=history;if(!history.length){app.innerHTML='<section class="card empty">Aucune séance enregistrée pour ce programme pour le moment.<br><br>Termine une séance pour commencer à suivre ta progression.</section>';return}const chronological=history.slice().sort((a,b)=>new Date(a&&a.date||0)-new Date(b&&b.date||0)),map=new Map();chronological.forEach(s=>(Array.isArray(s&&s.exercises)?s.exercises:[]).forEach(e=>{const loads=(Array.isArray(e&&e.sets)?e.sets:[]).map(x=>Number(x&&x.load)).filter(x=>isFinite(x)&&x>0);if(!loads.length)return;const id=String(e&&e.exercise_id!=null?e.exercise_id:(e&&e.name)||'');if(!id)return;if(!map.has(id))map.set(id,{id:id,name:e&&e.name||'Exercice',rows:[]});map.get(id).rows.push({date:s&&s.date||'',load:Math.max.apply(null,loads)})}));const exercises=Array.from(map.values());if(!exercises.length){app.innerHTML='<section class="card empty">Tes séances sont bien enregistrées.<br><br>Renseigne une charge sur une série pour afficher ta progression.</section><section class="card"><div class="k">SÉANCES PRÉCÉDENTES</div>'+history.map(sessionCard).join('')+'</section>';return}const wanted=p.get('exercise'),id=wanted&&map.has(wanted)?wanted:exercises[0].id,ex=map.get(id),rows=ex.rows.slice(-8),first=rows[0].load,last=rows[rows.length-1].load,max=Math.max.apply(null,rows.map(x=>x.load).concat([1])),delta=first?Math.round((last-first)/first*100):0;app.innerHTML='<section class="card"><select class="select" id="exerciseSelect">'+exercises.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></section><section class="card"><div class="main"><div><div class="name">'+esc(ex.name)+'</div><div class="sub">Évolution de ta charge</div></div><div class="value">'+last+' kg</div></div><div class="stats"><div class="stat"><span>Progression</span><strong>'+(delta>0?'+':'')+delta+'%</strong></div><div class="stat"><span>Première charge</span><strong>'+first+' kg</strong></div></div><div class="chart">'+rows.map(x=>'<div class="bar" style="height:'+Math.max(8,Math.round(x.load/max*82))+'px"><span>'+x.load+' kg</span></div>').join('')+'</div></section><section class="card"><div class="k">SÉANCES PRÉCÉDENTES</div>'+history.map(sessionCard).join('')+'</section>';document.getElementById('exerciseSelect').onchange=function(){p.set('exercise',this.value);location.search=p.toString()}}try{render()}catch(e){console.error(e);app.innerHTML='<section class="card empty">Impossible d’afficher ta progression pour le moment.</section>'}})();</script></body></html>
