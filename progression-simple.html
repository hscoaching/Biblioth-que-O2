<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>HS Coaching — Ma progression</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:560px;margin:auto;padding:22px 18px}
.head{margin-bottom:16px;position:relative}.back-top{display:inline-block;margin-bottom:12px;color:#fff;text-decoration:none;font-size:10px;font-weight:900;border:1px solid #333;border-radius:9px;padding:8px 10px;background:#151515}
.k{font-size:9px;letter-spacing:1.6px;color:#666;font-weight:900}
.head h1{font-size:25px;margin:4px 0}
.program-name{font-size:11px;color:#999}
.card{background:#141414;border:1px solid #292929;border-radius:15px;padding:15px;margin-bottom:10px}
.empty{text-align:center;color:#888;font-size:11px;line-height:1.6;padding:28px 12px}
.select{width:100%;border:1px solid #292929;background:#101010;color:#fff;border-radius:9px;padding:11px;font-size:11px}
.main{display:flex;justify-content:space-between;gap:10px}
.name{font-size:13px;font-weight:900}
.sub{font-size:9px;color:#666;margin-top:4px}
.value{font-size:20px;font-weight:900}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.stat{background:#101010;border:1px solid #292929;border-radius:10px;padding:10px}
.stat span{display:block;color:#666;font-size:8px;text-transform:uppercase}
.stat strong{display:block;margin-top:4px;font-size:12px}
.chart-wrap{margin-top:16px}
.chart-title{font-size:10px;font-weight:900;margin-bottom:4px}
.chart-help{font-size:8px;color:#666;margin-bottom:10px}
.line-chart{position:relative;height:170px;background:#101010;border:1px solid #292929;border-radius:11px;padding:10px}
.line-chart svg{display:block;width:100%;height:115px;overflow:visible}
.line-grid{stroke:#292929;stroke-width:1}
.line-path{fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.line-point{fill:#fff;stroke:#0b0b0b;stroke-width:2}
.chart-labels{display:flex;justify-content:space-between;gap:6px;margin-top:7px}
.chart-label{font-size:7px;color:#666;text-align:center;flex:1;min-width:0}
.chart-axis{display:flex;justify-content:space-between;font-size:7px;color:#666;margin-bottom:3px}
.chart-axis strong{color:#aaa}
.chart-explain{font-size:9px;color:#aaa;line-height:1.45;margin-top:10px}
.chart-explain strong{color:#fff}
.history-row{padding:12px;border:1px solid #252525;border-radius:11px;background:#101010;margin-top:7px;cursor:pointer}
.history-row strong{font-size:11px}
.history-row div{font-size:9px;color:#777;margin-top:4px}
.history-row small{display:block;color:#555;font-size:8px;margin-top:6px}
.detail{position:fixed;inset:0;background:#0b0b0b;z-index:1000;display:none;overflow:auto}
.detail.show{display:block}
.detail-inner{max-width:560px;margin:auto;padding:18px}
.detail-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.detail-head h2{font-size:20px;margin:4px 0}
.close{width:40px;height:40px;border-radius:50%;border:1px solid #444;background:#171717;color:#fff;font-size:24px;cursor:pointer}
.exercise{background:#141414;border:1px solid #292929;border-radius:14px;padding:13px;margin-bottom:9px}
.exercise-title{font-size:12px;font-weight:900;margin-bottom:9px}
.set-row{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;margin-top:5px}
.set-row span,.set-row strong{background:#101010;border:1px solid #242424;border-radius:8px;padding:9px 4px;text-align:center;font-size:10px}
.set-row span{font-size:9px;color:#777}
</style>
</head>
<body>
<main class="wrap">
<header class="head">
<a id="backTop" class="back-top" href="programmes.html">← Retour</a>
<div class="k">SUIVI PERSONNEL</div>
<h1>Ma progression</h1>
<div id="programName" class="program-name"></div>
</header>
<div id="app"><section class="card empty">Chargement de ta progression…</section></div>
</main>

<div id="detail" class="detail" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
<div class="detail-inner">
<div class="detail-head">
<div>
<div class="k">SÉANCE TERMINÉE</div>
<h2 id="detailTitle"></h2>
<div id="detailMeta" class="program-name"></div>
</div>
<button class="close" type="button" onclick="closeDetail()" aria-label="Fermer">×</button>
</div>
<div id="detailBody"></div>
</div>
</div>

<script>
(function(){
  'use strict';

  const KEY = 'hs_workout_history_v1';
  const app = document.getElementById('app');
  const detail = document.getElementById('detail');
  const backTop = document.getElementById('backTop');
  const query = new URLSearchParams(window.location.search);
  backTop.href = query.get('program_id') ? 'programmes.html' : 'mes-programmes.html';

  function esc(value){
    return String(value == null ? '' : value)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function readHistory(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return [];
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) return parsed;
      if(parsed && Array.isArray(parsed.history)) return parsed.history;
      if(parsed && Array.isArray(parsed.sessions)) return parsed.sessions;
      return [];
    }catch(error){
      console.error('HS progression: lecture historique impossible', error);
      return [];
    }
  }

  function getProgram(){
    return new URLSearchParams(window.location.search).get('program') || '';
  }

  function formatDate(value){
    if(!value) return 'Date inconnue';
    const d = new Date(value);
    if(isNaN(d.getTime())) return 'Date inconnue';
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
  }

  function getExercises(session){
    return Array.isArray(session && session.exercises) ? session.exercises : [];
  }

  function getSets(exercise){
    return Array.isArray(exercise && exercise.sets) ? exercise.sets : [];
  }

  function renderSessionCard(session,index){
    const exercises = getExercises(session);
    return '<div class="history-row" role="button" tabindex="0" onclick="openDetail('+index+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openDetail('+index+')}" aria-label="Voir le détail de la séance">'+
      '<strong>'+esc(session && session.session_name || 'Séance')+'</strong>'+
      '<div>'+formatDate(session && session.date)+' · '+esc(Number(session && session.duration_minutes) || 0)+' min</div>'+
      '<small>'+exercises.length+' exercice'+(exercises.length > 1 ? 's' : '')+' · Appuie pour voir le détail →</small>'+
    '</div>';
  }

  window.openDetail = function(index){
    const session = window.__hsSessions && window.__hsSessions[index];
    if(!session) return;

    document.getElementById('detailTitle').textContent = session.session_name || 'Séance';
    document.getElementById('detailMeta').textContent =
      formatDate(session.date)+' · '+(Number(session.duration_minutes) || 0)+' min';

    const exercises = getExercises(session);

    if(!exercises.length){
      document.getElementById('detailBody').innerHTML =
        '<section class="card empty">Aucune donnée détaillée enregistrée pour cette séance.</section>';
    }else{
      document.getElementById('detailBody').innerHTML = exercises.map(function(exercise){
        const sets = getSets(exercise);
        return '<section class="exercise">'+
          '<div class="exercise-title">'+esc(exercise.name || 'Exercice')+'</div>'+
          (sets.length ? sets.map(function(set,index){
            const load = Number(set && set.load) || 0;
            const reps = Number(set && set.reps) || 0;
            return '<div class="set-row">'+
              '<span>S'+(index+1)+'</span>'+
              '<strong>'+(load > 0 ? load+' kg' : '—')+'</strong>'+
              '<strong>'+(reps > 0 ? reps+' reps' : '—')+'</strong>'+
            '</div>';
          }).join('') : '<div class="program-name">Aucune série enregistrée</div>')+
        '</section>';
      }).join('');
    }

    detail.classList.add('show');
    detail.setAttribute('aria-hidden','false');
    window.scrollTo(0,0);
  };

  window.addEventListener('keydown',function(e){if(e.key==='Escape'&&detail.classList.contains('show'))window.closeDetail()});

  window.closeDetail = function(){
    detail.classList.remove('show');
    detail.setAttribute('aria-hidden','true');
  };

  function buildChart(rows){
    if(!rows.length) return '';
    const width = 480;
    const height = 115;
    const padX = 18;
    const padY = 12;
    const values = rows.map(function(row){ return row.load; });
    const min = Math.min.apply(null,values);
    const maxValue = Math.max.apply(null,values);
    const range = Math.max(1,maxValue-min);
    const points = rows.map(function(row,index){
      const x = rows.length===1 ? width/2 : padX + index*(width-padX*2)/(rows.length-1);
      const y = height-padY - ((row.load-min)/range)*(height-padY*2);
      return {x:x,y:y,load:row.load,date:row.date};
    });
    const path = points.map(function(p,index){
      return (index ? 'L' : 'M')+p.x.toFixed(1)+' '+p.y.toFixed(1);
    }).join(' ');
    const circles = points.map(function(p){
      return '<circle class="line-point" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4"></circle>';
    }).join('');
    const labels = rows.map(function(row){
      const d = new Date(row.date);
      const label = isNaN(d.getTime()) ? '—' : d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
      return '<div class="chart-label">'+label+'</div>';
    }).join('');
    return '<div class="line-chart">'+
      '<div class="chart-axis"><span>'+min+' kg</span><strong>'+maxValue+' kg</strong></div>'+
      '<svg viewBox="0 0 '+width+' '+height+'" preserveAspectRatio="none" aria-label="Évolution de la charge">'+
        '<line class="line-grid" x1="'+padX+'" y1="'+padY+'" x2="'+(width-padX)+'" y2="'+padY+'"></line>'+
        '<line class="line-grid" x1="'+padX+'" y1="'+(height/2)+'" x2="'+(width-padX)+'" y2="'+(height/2)+'"></line>'+
        '<line class="line-grid" x1="'+padX+'" y1="'+(height-padY)+'" x2="'+(width-padX)+'" y2="'+(height-padY)+'"></line>'+
        '<path class="line-path" d="'+path+'"></path>'+
        circles+
      '</svg>'+
      '<div class="chart-labels">'+labels+'</div>'+
    '</div>';
  }

  function render(){
    const program = getProgram();
    document.getElementById('programName').textContent =
      program ? 'Programme : '+program : '';

    const allHistory = readHistory();

    const history = program
      ? allHistory.filter(function(session){
          return String(session && session.program_name || '').trim() === String(program).trim();
        })
      : allHistory;

    window.__hsSessions = history;

    if(!history.length){
      app.innerHTML =
        '<section class="card empty">Aucune séance enregistrée pour ce programme pour le moment.<br><br>'+
        'Termine une séance pour commencer à suivre ta progression.</section>';
      return;
    }

    const chronological = history.slice().sort(function(a,b){
      return new Date(a && a.date || 0) - new Date(b && b.date || 0);
    });

    const exerciseMap = new Map();

    chronological.forEach(function(session){
      getExercises(session).forEach(function(exercise){
        const loads = getSets(exercise)
          .map(function(set){ return Number(set && set.load) || 0; })
          .filter(function(load){ return isFinite(load) && load > 0; });

        if(!loads.length) return;

        const id = String(
          exercise && exercise.exercise_id != null
            ? exercise.exercise_id
            : (exercise && exercise.name || '')
        );

        if(!id) return;

        if(!exerciseMap.has(id)){
          exerciseMap.set(id,{
            id:id,
            name:exercise && exercise.name || 'Exercice',
            rows:[]
          });
        }

        exerciseMap.get(id).rows.push({
          date:session && session.date || '',
          load:Math.max.apply(null,loads)
        });
      });
    });

    const exercises = Array.from(exerciseMap.values());

    if(!exercises.length){
      app.innerHTML =
        '<section class="card empty">Tes séances sont bien enregistrées.<br><br>'+
        'Renseigne une charge sur une série pour afficher ta progression.</section>'+
        '<section class="card"><div class="k">SÉANCES PRÉCÉDENTES</div>'+
        history.map(renderSessionCard).join('')+
        '</section>';
      return;
    }

    const params = new URLSearchParams(window.location.search);
    const wanted = params.get('exercise');
    const selectedId = wanted && exerciseMap.has(wanted) ? wanted : exercises[0].id;
    const selected = exerciseMap.get(selectedId);
    const rows = selected.rows.slice(-8);

    const first = rows.length ? rows[0].load : 0;
    const last = rows.length ? rows[rows.length-1].load : 0;
    const max = Math.max.apply(null,rows.map(function(row){return row.load;}).concat([1]));
    const progression = first ? Math.round(((last-first)/first)*100) : 0;

    app.innerHTML =
      '<section class="card">'+
        '<select class="select" id="exerciseSelect">'+
          exercises.map(function(ex){
            return '<option value="'+esc(ex.id)+'" '+(ex.id===selectedId?'selected':'')+'>'+
              esc(ex.name)+'</option>';
          }).join('')+
        '</select>'+
      '</section>'+
      '<section class="card">'+
        '<div class="main">'+
          '<div><div class="name">'+esc(selected.name)+'</div>'+
          '<div class="sub">Évolution de ta charge</div></div>'+
          '<div class="value">'+last+' kg</div>'+
        '</div>'+
        '<div class="stats">'+
          '<div class="stat"><span>Progression</span><strong>'+
            (progression > 0 ? '+' : '')+progression+'%</strong></div>'+
          '<div class="stat"><span>Première charge</span><strong>'+first+' kg</strong></div>'+
        '</div>'+
        '<div class="chart-wrap">'+
          '<div class="chart-title">Ta charge au fil des séances</div>'+
          '<div class="chart-help">Chaque point représente une séance.</div>'+
          buildChart(rows)+
          '<div class="chart-explain"><strong>'+last+' kg actuellement</strong> · '+
            (progression > 0
              ? 'tu as augmenté ta charge de '+progression+' % depuis le début.'
              : progression < 0
                ? 'ta charge actuelle est '+Math.abs(progression)+' % plus basse qu’au début.'
                : 'ta charge est stable depuis le début.')+
          '</div>'+
        '</div>'+
      '</section>'+
      '<section class="card">'+
        '<div class="k">SÉANCES PRÉCÉDENTES</div>'+
        history.map(renderSessionCard).join('')+
      '</section>';

    document.getElementById('exerciseSelect').onchange = function(){
      params.set('exercise',this.value);
      window.location.search = params.toString();
    };
  }

  function start(){
    try{
      render();
    }catch(error){
      console.error('HS progression render error',error);
      app.innerHTML =
        '<section class="card empty">Impossible d’afficher ta progression pour le moment.</section>';
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded',start);
  }else{
    start();
  }
})();
</script>
</body>
</html>
