<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><title>HS Coaching — Ma progression</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:560px;margin:auto;padding:22px 18px}.head{margin-bottom:16px}.k{font-size:9px;letter-spacing:1.6px;color:#666;font-weight:900}.head h1{font-size:25px;margin:4px 0}.program-name{font-size:11px;color:#999}.card{background:#141414;border:1px solid #292929;border-radius:15px;padding:15px;margin-bottom:10px}.empty{text-align:center;color:#888;font-size:11px;line-height:1.6;padding:28px 12px}.select{width:100%;border:1px solid #292929;background:#101010;color:#fff;border-radius:9px;padding:11px;font-size:11px}.main{display:flex;justify-content:space-between;gap:10px}.name{font-size:13px;font-weight:900}.sub{font-size:9px;color:#666;margin-top:4px}.value{font-size:20px;font-weight:900}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.stat{background:#101010;border:1px solid #292929;border-radius:10px;padding:10px}.stat span{display:block;color:#666;font-size:8px;text-transform:uppercase}.stat strong{display:block;margin-top:4px;font-size:12px}.chart{height:110px;display:flex;align-items:flex-end;gap:6px;margin-top:16px;padding:8px 2px 0;border-bottom:1px solid #292929}.bar{flex:1;min-width:8px;background:#555;border-radius:4px 4px 0 0;position:relative}.bar:last-child{background:#fff}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:7px;color:#777;white-space:nowrap;margin-bottom:4px}.history-row{padding:11px 0;border-bottom:1px solid #222}.history-row:last-child{border-bottom:0}.history-row strong{font-size:11px}.history-row div{font-size:9px;color:#777;margin-top:4px}</style></head><body><main class="wrap"><header class="head"><div class="k">SUIVI PERSONNEL</div><h1>Ma progression</h1><div id="programName" class="program-name"></div></header><div id="app"><section class="card empty">Chargement de ta progression…</section></div></main><script>(function(){const KEY='hs_workout_history_v1';const app=document.getElementById('app');const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function read(){try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(raw)?raw:(raw&&Array.isArray(raw.history)?raw.history:raw&&Array.isArray(raw.sessions)?raw.sessions:[])}catch(e){return[]}}function historyRow(s){const d=s&&s.date?new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}):'Date inconnue';return '<div class="history-row"><strong>'+esc(s&&s.program_name||'Programme')+'</strong><div>'+d+' · '+esc(s&&s.session_name||'Séance')+' · '+(Number(s&&s.duration_minutes)||0)+' min</div></div>'}function render(){const p=new URLSearchParams(location.search),program=p.get('program')||'';document.getElementById('programName').textContent=program?'Programme : '+program:'';const allHistory=read(),history=program?allHistory.filter(s=>String(s&&s.program_name||'').trim()===String(program).trim()):allHistory,all=[];history.forEach(s=>(Array.isArray(s&&s.exercises)?s.exercises:[]).forEach(e=>{const loads=(Array.isArray(e&&e.sets)?e.sets:[]).map(x=>Number(x&&x.load)).filter(x=>isFinite(x)&&x>0);if(loads.length)all.push({id:String(e&&e.exercise_id!=null?e.exercise_id:e&&e.name||''),name:e&&e.name||'Exercice',load:Math.max.apply(null,loads)})}));const ids=[];all.forEach(x=>{if(x.id&&!ids.includes(x.id))ids.push(x.id)});if(!history.length){app.innerHTML='<section class="card empty">Aucune séance enregistrée pour ce programme pour le moment.<br><br>Termine une séance pour commencer à suivre ta progression.</section>';return}if(!ids.length){app.innerHTML='<section class="card empty">Tes séances sont bien enregistrées.<br><br>Renseigne une charge sur une série pour afficher ta progression.</section><section class="card"><div class="k">HISTORIQUE</div>'+history.slice(0,8).map(historyRow).join('')+'</section>';return}const wanted=p.get('exercise'),id=wanted&&ids.includes(wanted)?wanted:ids[0],rows=all.filter(x=>x.id===id).slice(-8),first=rows[0].load,last=rows[rows.length-1].load,max=Math.max.apply(null,rows.map(x=>x.load).concat([1])),delta=first?Math.round((last-first)/first*100):0;app.innerHTML='<section class="card"><select class="select" id="exerciseSelect">'+ids.map(x=>{const r=all.find(a=>a.id===x);return '<option value="'+esc(x)+'" '+(x===id?'selected':'')+'>'+esc(r&&r.name||'Exercice')+'</option>'}).join('')+'</select></section><section class="card"><div class="main"><div><div class="name">'+esc(rows[0].name)+'</div><div class="sub">Évolution de ta charge</div></div><div class="value">'+last+' kg</div></div><div class="stats"><div class="stat"><span>Progression</span><strong>'+(delta>0?'+':'')+delta+'%</strong></div><div class="stat"><span>Première charge</span><strong>'+first+' kg</strong></div></div><div class="chart">'+rows.map(x=>'<div class="bar" style="height:'+Math.max(8,Math.round(x.load/max*82))+'px"><span>'+x.load+' kg</span></div>').join('')+'</div></section><section class="card"><div class="k">HISTORIQUE</div>'+history.slice(0,8).map(historyRow).join('')+'</section>';document.getElementById('exerciseSelect').onchange=function(){p.set('exercise',this.value);location.search=p.toString()}}try{render()}catch(e){app.innerHTML='<section class="card empty">Une erreur empêche l’affichage de la progression.<br><br>La séance reste bien enregistrée.</section>'}})();</script></body></html>
