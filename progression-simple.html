<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><title>HS Coaching — Ma progression</title><style>body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:560px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.k{font-size:9px;letter-spacing:1.6px;color:#666;font-weight:900}.head h1{font-size:25px;margin:4px 0 0}.program-name{font-size:11px;color:#999;margin-top:5px}.close{width:36px;height:36px;border:1px solid #292929;border-radius:50%;background:#171717;color:#aaa;font-size:22px;cursor:pointer}.card{background:#141414;border:1px solid #292929;border-radius:15px;padding:14px;margin-bottom:10px}.select{width:100%;box-sizing:border-box;border:1px solid #292929;background:#101010;color:#fff;border-radius:9px;padding:10px;font-size:11px}.main{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:13px;font-weight:900}.sub{font-size:9px;color:#666;margin-top:4px}.value{font-size:20px;font-weight:900;white-space:nowrap}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.stat{background:#101010;border:1px solid #292929;border-radius:10px;padding:9px}.stat span{display:block;color:#666;font-size:8px;text-transform:uppercase}.stat strong{display:block;margin-top:4px;font-size:12px}.chart{height:110px;display:flex;align-items:flex-end;gap:6px;margin-top:16px;padding:8px 2px 0;border-bottom:1px solid #292929}.bar{flex:1;min-width:8px;background:#555;border-radius:4px 4px 0 0;position:relative}.bar:last-child{background:#fff}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:7px;color:#777;white-space:nowrap;margin-bottom:4px}.empty{text-align:center;color:#777;font-size:11px;line-height:1.5;padding:28px 8px}.history-row{padding:11px 0;border-bottom:1px solid #222}.history-row strong{font-size:11px}.history-row div{font-size:9px;color:#777;margin-top:4px}</style></head><body><main class="wrap"><header class="head"><div><div class="k">SUIVI PERSONNEL</div><h1>Ma progression</h1><div id="programName" class="program-name"></div></div><button class="close" onclick="goBack()">×</button></header><section id="app"></section></main><script>const KEY='hs_workout_history_v1';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function goBack(){if(window.parent!==window){window.parent.postMessage('close-progression','*')}else{window.location.href='programmes.html'}}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function render(){const params=new URLSearchParams(location.search),program=params.get('program')||'',allHistory=read(),history=program?allHistory.filter(s=>String(s.program_name||'')===program):allHistory;document.getElementById('programName').textContent=program?'Programme : '+program:'';const all=[];history.forEach(s=>(s.exercises||[]).forEach(e=>{const loads=(e.sets||[]).map(x=>Number(x.load)).filter(x=>x>0);if(loads.length)all.push({id:String(e.exercise_id),name:e.name||'Exercice',load:Math.max(...loads),date:s.date})}));const ids=[...new Set(all.map(x=>x.id))],app=document.getElementById('app');if(!history.length){app.innerHTML='<div class="card empty">Aucune séance enregistrée pour ce programme pour le moment.</div>';return}if(!ids.length){app.innerHTML='<div class="card empty">Termine une séance avec une charge renseignée pour commencer à suivre ta progression.</div><section class="card"><div class="k">HISTORIQUE</div>'+history.slice(0,8).map(row).join('')+'</section>';return}const id=params.get('exercise')&&ids.includes(params.get('exercise'))?params.get('exercise'):ids[0],rows=all.filter(x=>x.id===id).slice(0,8).reverse(),name=rows[0]?.name||'Exercice',first=rows[0]?.load||0,last=rows.at(-1)?.load||0,max=Math.max(...rows.map(x=>x.load),1),delta=first?Math.round(((last-first)/first)*100):0;app.innerHTML='<section class="card"><select class="select" onchange="setExercise(this.value)">'+ids.map(x=>{const r=all.find(a=>a.id===x);return '<option value="'+esc(x)+'" '+(x===id?'selected':'')+'>'+esc(r.name)+'</option>'}).join('')+'</select></section><section class="card"><div class="main"><div><div class="name">'+esc(name)+'</div><div class="sub">Évolution de ta charge</div></div><div class="value">'+last+' kg</div></div><div class="stats"><div class="stat"><span>Progression</span><strong>'+(delta>0?'+':'')+delta+'%</strong></div><div class="stat"><span>Première charge</span><strong>'+first+' kg</strong></div></div><div class="chart">'+rows.map(x=>'<div class="bar" style="height:'+Math.max(8,Math.round(x.load/max*82))+'px"><span>'+x.load+' kg</span></div>').join('')+'</div></section><section class="card"><div class="k">HISTORIQUE</div>'+history.slice(0,8).map(row).join('')+'</section>'}function row(s){return '<div class="history-row"><strong>'+esc(s.program_name||'Programme')+'</strong><div>'+new Date(s.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'})+' · '+esc(s.session_name||'Séance')+' · '+Number(s.duration_minutes||0)+' min</div></div>}function setExercise(id){const p=new URLSearchParams(location.search);p.set('exercise',id);location.search=p.toString()}render()</script></body></html>
