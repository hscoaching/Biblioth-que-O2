<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HS Coaching — Import exercices</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh}.box{max-width:760px;margin:70px auto;padding:28px;background:#141414;border:1px solid #292929;border-radius:18px}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:#fff;color:#000}.secondary{background:#242424;color:#fff}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field input{background:#0d0d0d;border:1px solid #303030;color:#fff;border-radius:10px;padding:12px;font:inherit}.status{margin-top:16px;color:#aaa;line-height:1.5}.ok{color:#a9efba}.error{color:#ffb0b0}.progress{height:8px;background:#252525;border-radius:99px;overflow:hidden;margin-top:18px}.bar{height:100%;width:0;background:#fff;transition:width .2s}</style></head><body><header class="topbar"><div class="brand"><span class="brand-mark">HS</span><div><strong>HS COACHING</strong><small>Import bibliothèque</small></div></div></header><main class="container"><div class="box"><p class="eyebrow">IMPORT ADMIN</p><h1>601 exercices.</h1><p class="sub">Cette page ajoute automatiquement les exercices RepDB manquants dans ta base Supabase, avec leur visuel identique à la bibliothèque publique. Les exercices déjà présents ne sont pas remplacés.</p><section id="login"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn">Se connecter et importer</button></section><section id="run" hidden><button class="btn primary" id="importBtn">Importer les exercices</button><div class="progress"><div class="bar" id="bar"></div></div></section><div id="status" class="status"></div><p style="margin-top:24px"><a href="admin.html" style="color:#aaa">← Retour à l'espace admin</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://hcjoagpkgpqxgzjdyfvd.supabase.co',SUPABASE_KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);function msg(t,c=''){ $('status').textContent=t;$('status').className='status '+c }async function admin(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return data?user:null}async function doLogin(){const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message,'error');const u=await admin();if(!u){await sb.auth.signOut();return msg('Ce compte n’a pas accès à l’administration.','error')}$('login').hidden=true;$('run').hidden=false;msg('Connecté. Lance l’import.','ok')}async function importAll(){const u=await admin();if(!u)return msg('Session expirée. Reconnecte-toi.','error');$('importBtn').disabled=true;try{msg('Téléchargement des 601 exercices RepDB…');const res=await fetch('https://exercise-dataset.com/exercises.json');if(!res.ok)throw new Error('Impossible de charger RepDB (HTTP '+res.status+')');const data=await res.json();const source=data.exercises||[];const {data:existing,error:existingError}=await sb.from('exercises').select('slug');if(existingError)throw existingError;const have=new Set((existing||[]).map(x=>x.slug));const rows=source.filter(e=>!have.has(e.id)).map(e=>{const flat=e.images&&e.images.flat||{};const image=flat.start||flat.main||flat.peak;return{name:e.name_en||e.id,slug:e.id,description:e.description_en||null,muscles:[...(e.primary_muscles||[]),...(e.secondary_muscles||[])],equipment:e.equipment||null,level:e.difficulty||null,instructions:e.instructions_en||[],tips:e.tips_en||[],common_mistakes:[],media_url:image?'https://exercise-dataset.com/'+image:null,is_published:true}});msg(rows.length+' nouveaux exercices à importer…');let done=0;for(let i=0;i<rows.length;i+=25){const batch=rows.slice(i,i+25);const {error}=await sb.from('exercises').insert(batch);if(error){const retry=batch.filter(x=>!have.has(x.slug));const {error:e2}=await sb.from('exercises').upsert(retry,{onConflict:'slug',ignoreDuplicates:true});if(e2)throw e2}done+=batch.length;$('bar').style.width=Math.round(done/rows.length*100)+'%';msg('Import en cours : '+done+' / '+rows.length)}const {count}=await sb.from('exercises').select('*',{count:'exact',head:true});$('bar').style.width='100%';msg('Terminé 🎉 — '+(count??'?')+' exercices sont maintenant dans l’espace admin, avec leurs visuels.','ok');$('importBtn').textContent='Import terminé';}catch(e){console.error(e);msg('Erreur : '+(e.message||e),'error');$('importBtn').disabled=false}}$('loginBtn').onclick=doLogin;$('importBtn').onclick=importAll;admin().then(u=>{if(u){$('login').hidden=true;$('run').hidden=false;msg('Session admin détectée. Tu peux lancer l’import.','ok')}});</script></body></html>
