<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0b"><title>HS Coaching — Mes clients</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 18px 60px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:28px}.brand{display:flex;gap:10px;align-items:center}.mark{width:38px;height:38px;border-radius:10px;background:#fff;color:#000;display:grid;place-items:center;font-weight:900}.brand strong{display:block;font-size:12px}.brand small{display:block;color:#666;font-size:9px;margin-top:3px}.back,.btn{border:1px solid #333;border-radius:10px;background:#151515;color:#fff;padding:10px 13px;font-size:10px;font-weight:900;text-decoration:none;cursor:pointer}.btn.primary{background:#fff;color:#000;border-color:#fff}.hero h1{font-size:46px;letter-spacing:-2px;margin:0 0 8px}.muted{color:#777;font-size:11px;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.card{background:#141414;border:1px solid #292929;border-radius:16px;padding:16px}.field{margin-top:11px}.field label{display:block;color:#777;font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}.select,.input{width:100%;height:44px;border:1px solid #333;border-radius:10px;background:#0e0e0e;color:#fff;padding:0 11px}.list{margin-top:18px}.client{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid #292929;border-radius:12px;background:#101010;margin-top:8px}.client strong{font-size:12px}.client small{display:block;color:#666;font-size:9px;margin-top:4px}.msg{margin-top:12px;padding:11px;border-radius:10px;background:#142016;border:1px solid #29402d;color:#b8d9bd;font-size:10px;display:none}.msg.show{display:block}.empty{text-align:center;color:#777;padding:28px;font-size:11px}.full{grid-column:1/-1}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:40px}.head{align-items:flex-start}.full{grid-column:auto}.client{align-items:flex-start;flex-direction:column}.client .btn{width:100%}}
</style></head>
<body><main class="wrap">
<header class="head"><div class="brand"><span class="mark">HS</span><div><strong>HS COACHING</strong><small>ESPACE COACH</small></div></div><a class="back" href="compte.html">← Mon compte</a></header>
<section class="hero"><div style="font-size:9px;letter-spacing:2px;color:#666;font-weight:900">GESTION CLIENTS</div><h1>Mes clients.</h1><p class="muted">Attribue un programme, retrouve tes clients et consulte leur suivi.</p></section>
<div id="app"><section class="card empty">Vérification de l’accès…</section></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA='https://hcjoagpkgpqxgzjdyfvd.supabase.co',KEY='sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB',sb=supabase.createClient(SUPA,KEY);let clients=[],programs=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(t){$('msg').textContent=t;$('msg').className='msg show'}
async function load(){const {data:{session}}=await sb.auth.getSession();if(!session){$('app').innerHTML='<section class="card empty">Connecte-toi pour accéder à l’espace coach.</section>';return}
const {data:isAdmin,error:ae}=await sb.rpc('is_admin');if(ae||!isAdmin){$('app').innerHTML='<section class="card empty">Accès réservé au coach.</section>';return}
const [cr,pr]=await Promise.all([sb.rpc('admin_list_clients'),sb.from('programs').select('id,name,objective,description').eq('is_published',true).order('id')]);
if(cr.error||pr.error){$('app').innerHTML='<section class="card empty">Impossible de charger les données coach.</section>';return}
clients=cr.data||[];programs=pr.data||[];
$('app').innerHTML='<section class="card"><div style="font-size:9px;letter-spacing:1.5px;color:#666;font-weight:900">ATTRIBUER UN PROGRAMME</div><div class="field"><label>Client</label><select id="client" class="select">'+(clients.length?clients.map(c=>'<option value="'+c.user_id+'">'+esc(c.first_name||'Client')+' — '+esc(c.email||'')+'</option>').join(''):'<option>Aucun client inscrit</option>')+'</select></div><div class="field"><label>Programme</label><select id="program" class="select">'+(programs.length?programs.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join(''):'<option>Aucun programme publié</option>')+'</select></div><button class="btn primary" style="margin-top:13px;width:100%" onclick="assignProgram()">Attribuer le programme</button><div id="msg" class="msg"></div></section><section class="card list full"><div style="font-size:9px;letter-spacing:1.5px;color:#666;font-weight:900">CLIENTS</div><div id="clientList"></div></section>';
renderClients();}
function renderClients(){$('clientList').innerHTML=clients.length?clients.map(c=>'<div class="client"><div><strong>'+esc(c.first_name||'Client')+'</strong><small>'+esc(c.email||'')+'</small></div><button class="btn" onclick="selectClient(\''+c.user_id+'\')">Attribuer</button></div>').join(''):'<div class="empty">Aucun client inscrit.</div>'}
function selectClient(id){$('client').value=id;window.scrollTo({top:0,behavior:'smooth'})}
async function getFullProgram(id){const p=programs.find(x=>String(x.id)===String(id));if(!p)return null;const {data:ss,error:se}=await sb.from('program_sessions').select('id,name,notes,position').eq('program_id',id).order('position');if(se)throw se;const ids=(ss||[]).map(x=>x.id);const {data:rows,error:ee}=ids.length?await sb.from('program_exercises').select('session_id,exercise_id,position,sets,reps,rest,tempo').in('session_id',ids).order('position'):({data:[],error:null});if(ee)throw ee;const exids=[...new Set((rows||[]).map(x=>x.exercise_id))];let names={};if(exids.length){const {data:ex,error:xe}=await sb.from('exercises').select('id,name_fr').in('id',exids);if(xe)throw xe;names=Object.fromEntries((ex||[]).map(x=>[x.id,x.name_fr]));}return {...p,source_program_id:p.id,assigned_at:new Date().toISOString(),sessions:(ss||[]).map(s=>({id:'assigned_'+s.id,name:s.name,notes:s.notes,exercises:(rows||[]).filter(r=>String(r.session_id)===String(s.id)).map(r=>({exercise_id:r.exercise_id,name:names[r.exercise_id]||'Exercice',sets:r.sets||3,reps:r.reps||'8-12',rest:r.rest||'90s',tempo:r.tempo||''}))}))};}
async function assignProgram(){const uid=$('client').value,pid=$('program').value;if(!uid||!pid)return;try{const p=await getFullProgram(pid);const {error}=await sb.from('client_programs').insert({user_id:uid,source_program_id:pid,name:p.name,data:p,updated_at:new Date().toISOString()});if(error)throw error;const {error:ne}=await sb.from('client_notifications').insert({user_id:uid,type:'program_assigned',title:'Nouveau programme reçu',body:'Ton coach vient de t’attribuer un nouveau programme : '+p.name,data:{client_program:true,source_program_id:pid}});if(ne)console.warn('notification',ne);show('✓ Programme attribué au client.');}catch(e){console.error(e);show('Impossible d’attribuer le programme.');}}
load();
</script><script>window.HS_SUPABASE_CONFIG={url:"https://hcjoagpkgpqxgzjdyfvd.supabase.co",key:"sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB"};</script><script src="client-ui.js"></script></body></html>
