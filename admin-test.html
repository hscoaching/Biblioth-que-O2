<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>HS Coaching — Test client</title><link rel="stylesheet" href="style.css"><style>body{background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:30px 18px}.panel{background:#141414;border:1px solid #292929;border-radius:18px;padding:22px;margin-top:18px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:12px 16px;background:#242424;color:#fff;text-decoration:none;cursor:pointer;font-weight:700}.primary{background:#fff;color:#000}.muted{color:#888;font-size:12px;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.status{margin-top:14px;color:#888;font-size:11px}</style></head>
<body><main class="wrap"><a class="btn" href="admin.html">← Retour à l’administration</a><section class="panel"><p style="font-size:9px;letter-spacing:1.6px;color:#666;font-weight:900">ADMINISTRATION</p><h1 style="margin:6px 0 10px">Mode test client.</h1><p class="muted">Cette partie est réservée à Hugo. Elle permet de consulter l’application comme un client et de tester les programmes, notifications et séances sans exposer le mode test aux comptes clients.</p><div class="actions"><button class="btn primary" id="start">🧪 Entrer en mode test client</button><button class="btn" id="clear">Réinitialiser le test</button></div><div id="status" class="status"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://hcjoagpkgpqxgzjdyfvd.supabase.co','sb_publishable_ezHZ_co222B09HGiSeCkyw_Nw4G5FLB');const $=id=>document.getElementById(id);async function guard(){const r=await sb.auth.getUser();const u=r.data?.user;if(!u){location.href='admin.html';return false}const a=await sb.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();if(!a.data){location.href='index.html';return false}return true}async function start(){if(!await guard())return;localStorage.setItem('hs_test_client_mode','1');$('status').textContent='Mode test activé. Ouverture de Mon compte…';setTimeout(()=>location.href='compte.html',150)}async function clearTest(){localStorage.removeItem('hs_test_client_mode');localStorage.removeItem('hs_test_notification_v1');$('status').textContent='Mode test réinitialisé.'}$('start').onclick=start;$('clear').onclick=clearTest;guard();</script></body></html>
